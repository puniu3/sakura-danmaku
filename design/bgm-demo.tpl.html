<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BGM Audition — 弾幕STG</title>
<style>
  :root{
    --bg:#140a20; --panel:#20122f; --edge:#3d2459; --text:#ffe9fb; --dim:#9d83c0;
    --stage:#7fe0a8; --midboss:#ffce5e; --boss:#ff6aa0; --accent:#b98cff;
    --stage2:#9ad0ff; --boss2:#c98fff;
    --stage3:#8ce0c8; --boss3:#a0b8ff;
    --stage4:#ffd98a; --midboss4:#c0a0ff; --boss4:#ffb060;
    --stage5:#a8e0ff; --midboss5:#90ffd0; --boss5:#5ad0a0;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    background:radial-gradient(120% 90% at 50% -10%, #2a1640 0%, var(--bg) 60%);
    color:var(--text); font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:18px; padding:26px 16px 40px; min-height:100%;
  }
  h1{ font-size:20px; font-weight:700; margin:0; letter-spacing:.04em; }
  .sub{ color:var(--dim); font-size:12.5px; margin-top:-10px; text-align:center; line-height:1.5; }
  .cards{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; width:100%; max-width:760px; }
  .card{
    flex:1 1 210px; min-width:200px; border:1px solid var(--edge); border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.18)); padding:16px 16px 18px;
    display:flex; flex-direction:column; gap:10px; transition:border-color .2s, box-shadow .2s, transform .12s;
  }
  .card.playing{ border-color:var(--c); box-shadow:0 0 0 1px var(--c), 0 8px 30px -8px var(--c); }
  .card .tag{ font-size:11px; letter-spacing:.18em; color:var(--c); font-weight:700; }
  .card .name{ font-size:18px; font-weight:700; }
  .card .meta{ font-size:11.5px; color:var(--dim); line-height:1.5; min-height:34px; }
  button{
    font:inherit; color:var(--text); border:1px solid var(--edge); background:#2c1a40;
    border-radius:10px; padding:11px 14px; cursor:pointer; font-weight:600; transition:filter .12s, background .12s;
  }
  button:active{ transform:translateY(1px); }
  @media (hover:hover) and (pointer:fine){ button:hover{ filter:brightness(1.18); } }
  .card .play{ background:var(--c); color:#1a0d28; border-color:transparent; font-size:15px; }
  .controls{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; max-width:760px; width:100%; }
  .controls .stop{ background:#3a2150; }
  label.vol{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); }
  input[type=range]{ width:160px; accent-color:var(--accent); }
  .viz-wrap{ width:100%; max-width:760px; }
  canvas{ width:100%; height:120px; display:block; border:1px solid var(--edge); border-radius:12px; background:#0d0617; }
  .now{ font-size:13px; color:var(--dim); height:18px; }
  .now b{ color:var(--text); }
  .footer{ font-size:11px; color:var(--dim); max-width:680px; text-align:center; line-height:1.6; }
</style>
</head>
<body>
  <h1>🌸 BGM Audition Harness</h1>
  <div class="sub">1〜5面の各トラックを試聴。5面ボス＝採用版「須佐之男（八岐の問答 / C八音音階144）」。<br>カードの再生ボタンで切替（クロスフェード）。</div>

  <div class="cards" id="cards"></div>

  <div class="controls">
    <button class="stop" id="stop">■ 停止</button>
    <button id="mute">🔊 ミュート</button>
    <label class="vol">音量 <input type="range" id="vol" min="0" max="1" step="0.01" value="0.85"></label>
  </div>

  <div class="now" id="now">停止中</div>
  <div class="viz-wrap"><canvas id="viz" width="1520" height="240"></canvas></div>

  <div class="footer">
    すべて Web Audio による手続き型合成（音声ファイル無し）。リミッタ -6dB/20:1 でクリップ防止。
    ループは複数セクション（intro→A→B→…）構成で、最後に頭へ戻ります。
  </div>

<script>
'use strict';
// ============================================================================
//  BASE AUDIO PRIMITIVES  (mirrors index.html's Audio module core)
// ============================================================================
let ctx=null, masterGain=null, limiter=null, musicGain=null, sfxGain=null, analyser=null, noiseBuf=null;
let masterVol=0.85, muted=false;
const MASTER_BASE_GAIN=0.42;

function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
function now(){ return ctx?ctx.currentTime:0; }
function makeNoiseBuffer(){ const len=(ctx.sampleRate*1)|0, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; return buf; }
function envGain(dest,t0,peak,atk,dec,sus,rel,holdAt){ const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t0+atk); const sl=Math.max(0.0002,peak*sus); g.gain.exponentialRampToValueAtTime(sl,t0+atk+dec); const rs=(holdAt!=null)?holdAt:(t0+atk+dec); g.gain.setValueAtTime(sl,rs); g.gain.exponentialRampToValueAtTime(0.0001,rs+rel); g.connect(dest); return g; }
function tone(opts){ if(!ctx) return; const dest=opts.dest||sfxGain, t0=opts.t0!=null?opts.t0:now(); const f0=opts.f0, f1=opts.f1!=null?opts.f1:f0; const peak=opts.peak!=null?opts.peak:0.3; const atk=opts.atk!=null?opts.atk:0.004,dec=opts.dec!=null?opts.dec:0.02,sus=opts.sus!=null?opts.sus:0.4,rel=opts.rel!=null?opts.rel:0.08; const dur=opts.dur!=null?opts.dur:(atk+dec+rel); const osc=ctx.createOscillator(); osc.type=opts.type||'sine'; osc.frequency.setValueAtTime(f0,t0); if(f1!==f0){ if(opts.glideExp) osc.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur); else osc.frequency.linearRampToValueAtTime(f1,t0+dur); } if(opts.detune) osc.detune.setValueAtTime(opts.detune,t0); const holdAt=t0+Math.max(atk+dec,dur-rel); const g=envGain(dest,t0,peak,atk,dec,sus,rel,holdAt); if(opts.filter){ const bq=ctx.createBiquadFilter(); bq.type=opts.filter; bq.frequency.setValueAtTime(opts.filterFreq||1200,t0); if(opts.filterFreq1!=null) bq.frequency.linearRampToValueAtTime(opts.filterFreq1,t0+dur); if(opts.q!=null) bq.Q.value=opts.q; osc.connect(bq); bq.connect(g); } else osc.connect(g); const stopAt=holdAt+rel+0.02; osc.start(t0); osc.stop(stopAt); osc.onended=function(){ try{ osc.disconnect(); g.disconnect(); }catch(e){} }; }
function noise(opts){ if(!ctx) return; const dest=opts.dest||sfxGain, t0=opts.t0!=null?opts.t0:now(); const peak=opts.peak!=null?opts.peak:0.25, atk=opts.atk!=null?opts.atk:0.002, rel=opts.rel!=null?opts.rel:0.12; const dur=opts.dur!=null?opts.dur:(atk+rel); const src=ctx.createBufferSource(); src.buffer=noiseBuf; src.loop=true; let node=src; if(opts.filter){ const bq=ctx.createBiquadFilter(); bq.type=opts.filter; bq.frequency.setValueAtTime(opts.filterFreq||2000,t0); if(opts.filterFreq1!=null) bq.frequency.exponentialRampToValueAtTime(Math.max(60,opts.filterFreq1),t0+dur); if(opts.q!=null) bq.Q.value=opts.q; src.connect(bq); node=bq; } const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t0+atk); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); node.connect(g); g.connect(dest); src.start(t0); src.stop(t0+dur+0.02); src.onended=function(){ try{ src.disconnect(); g.disconnect(); }catch(e){} }; }

function build(){
  const AC=window.AudioContext||window.webkitAudioContext; ctx=new AC();
  limiter=ctx.createDynamicsCompressor(); limiter.threshold.value=-6; limiter.knee.value=0; limiter.ratio.value=20; limiter.attack.value=0.003; limiter.release.value=0.1; limiter.connect(ctx.destination);
  analyser=ctx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.78; analyser.connect(limiter);
  masterGain=ctx.createGain(); masterGain.gain.value=MASTER_BASE_GAIN*masterVol; masterGain.connect(analyser);
  musicGain=ctx.createGain(); musicGain.gain.value=0.0001; musicGain.connect(masterGain);
  sfxGain=ctx.createGain(); sfxGain.gain.value=1.0; sfxGain.connect(masterGain);
  noiseBuf=makeNoiseBuffer();
}

// ============================================================================
//  BGM ENGINE  (inlined from design/bgm-engine.js)
// ============================================================================
/* __BGM_ENGINE__ */

// ============================================================================
//  TRACKS  (replaced with the composed arrangements)
// ============================================================================
/* __BGM_TRACKS__ */

// ============================================================================
//  TRANSPORT
// ============================================================================
let curTrack='none', pumpTimer=0, nextNoteTime=0, stepIndex=0;
const SCHEDULE_AHEAD=0.10, PUMP_MS=25, MUSIC_FADE=0.22;
function trackOf(n){ return (TRACKS && TRACKS[n]) ? TRACKS[n] : null; }
function pump(){
  if(!ctx) return;
  const trk=trackOf(curTrack);
  if(trk){ const C=compile(trk); while(nextNoteTime<ctx.currentTime+SCHEDULE_AHEAD){ scheduleTrackStep(C, musicGain, stepIndex%C.totalSteps, nextNoteTime); stepIndex++; nextNoteTime+=C.step16; } }
  pumpTimer=setTimeout(pump,PUMP_MS);
}
function startPump(){ if(pumpTimer||!ctx) return; nextNoteTime=ctx.currentTime+0.08; pump(); }
function stopPump(){ if(pumpTimer){ clearTimeout(pumpTimer); pumpTimer=0; } }
function rampMusic(target,dur){ if(!musicGain) return; const t=now(); musicGain.gain.cancelScheduledValues(t); musicGain.gain.setValueAtTime(Math.max(0.0001,musicGain.gain.value),t); musicGain.gain.exponentialRampToValueAtTime(Math.max(0.0001,target),t+dur); }
function playMusic(name){
  if(!ctx){ build(); }
  if(ctx.state==='suspended') ctx.resume();
  if(name==='none'){ rampMusic(0.0001,MUSIC_FADE); setTimeout(()=>{ if(curTrack==='none') stopPump(); },(MUSIC_FADE+0.3)*1000); curTrack='none'; updateUI(); return; }
  const trk=trackOf(name); if(!trk) return;
  const target=trk.gain||0.55;
  if(name===curTrack) return;
  if(curTrack==='none'){ curTrack=name; stepIndex=0; startPump(); rampMusic(target,MUSIC_FADE); }
  else { rampMusic(0.0001,MUSIC_FADE); setTimeout(()=>{ curTrack=name; stepIndex=0; if(ctx) nextNoteTime=ctx.currentTime+0.05; rampMusic(target,MUSIC_FADE); },MUSIC_FADE*1000); }
  updateUI();
}

// ============================================================================
//  UI
// ============================================================================
const CARD_DEFS=[
  { key:'stage',   tag:'1面道中  STAGE',   color:'var(--stage)' },
  { key:'midboss', tag:'1面中ボス  MIDBOSS', color:'var(--midboss)' },
  { key:'boss',    tag:'1面大ボス  BOSS',    color:'var(--boss)' },
  { key:'stage2',  tag:'2面道中  STAGE 2', color:'var(--stage2)' },
  { key:'boss2',   tag:'2面ボス  BOSS 2',  color:'var(--boss2)' },
  { key:'stage3',  tag:'3面道中  STAGE 3', color:'var(--stage3)' },
  { key:'boss3',   tag:'3面ボス  BOSS 3',  color:'var(--boss3)' },
  { key:'stage4',  tag:'4面道中  STAGE 4', color:'var(--stage4)' },
  { key:'midboss4',tag:'4面中ボス  MIDBOSS 4', color:'var(--midboss4)' },
  { key:'boss4',   tag:'4面ボス  BOSS 4',  color:'var(--boss4)' },
  // ---- Stage 5 road / midboss: ADOPTED winners (confirm) ----
  { key:'stage5',  tag:'★ 5面道中 (採用)', color:'var(--stage5)' },
  { key:'midboss5',tag:'★ 5面中ボス (採用)', color:'var(--midboss5)' },
  // ---- Stage 5 boss: ADOPTED winner (was candidate C, chosen 2026-06-06) ----
  { key:'boss5',   tag:'★ 5面ボス (採用) 須佐之男 — 八岐の問答 (C八音音階144)', color:'var(--boss5)' },
];
const cardsEl=document.getElementById('cards'), nowEl=document.getElementById('now');
function renderCards(){
  cardsEl.innerHTML='';
  CARD_DEFS.forEach(def=>{
    const t=(typeof TRACKS!=='undefined' && TRACKS[def.key])||null;
    const card=document.createElement('div'); card.className='card'; card.dataset.key=def.key; card.style.setProperty('--c',def.color);
    const secCount=t?t.arrangement.length:0;
    const barTotal=t?t.arrangement.reduce((a,s)=>a+(t.sections[s]?t.sections[s].bars:0),0):0;
    card.innerHTML=
      '<div class="tag">'+def.tag+'</div>'+
      '<div class="name">'+(t&&t.title?t.title:def.key)+'</div>'+
      '<div class="meta">'+(t?((t.bpm||'?')+' BPM ・ '+(t.keyName||'')+'<br>'+secCount+' sections / '+barTotal+' bars'):'（未収録）')+'</div>'+
      '<button class="play" data-key="'+def.key+'">▶ 再生</button>';
    cardsEl.appendChild(card);
  });
  cardsEl.querySelectorAll('.play').forEach(b=>b.addEventListener('click',()=>playMusic(b.dataset.key)));
}
function updateUI(){
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('playing', c.dataset.key===curTrack));
  const t=trackOf(curTrack);
  nowEl.innerHTML = curTrack==='none' ? '停止中' : ('▶ 再生中: <b>'+(t&&t.title?t.title:curTrack)+'</b>');
}
document.getElementById('stop').addEventListener('click',()=>playMusic('none'));
document.getElementById('vol').addEventListener('input',e=>{ masterVol=parseFloat(e.target.value); if(masterGain) masterGain.gain.setTargetAtTime(MASTER_BASE_GAIN*masterVol, now(), 0.02); });
document.getElementById('mute').addEventListener('click',function(){ if(!ctx) build(); muted=!muted; if(muted){ ctx.suspend(); this.textContent='🔇 解除'; } else { ctx.resume(); this.textContent='🔊 ミュート'; } });

// visualizer
const cvs=document.getElementById('viz'), vctx=cvs.getContext('2d');
function draw(){
  requestAnimationFrame(draw);
  vctx.clearRect(0,0,cvs.width,cvs.height);
  if(!analyser){ return; }
  const n=analyser.frequencyBinCount, data=new Uint8Array(n); analyser.getByteFrequencyData(data);
  const bars=96, step=Math.floor(n/bars), W=cvs.width, H=cvs.height, bw=W/bars;
  const ACCENT_MAP={
    stage:[127,224,168], midboss:[255,206,94], boss:[255,106,160],
    stage2:[154,208,255], boss2:[201,143,255],
    stage3:[140,224,200], boss3:[160,184,255],
    stage4:[255,217,138], midboss4:[192,160,255], boss4:[255,176,96],
    stage5:[168,224,255], midboss5:[144,255,208], boss5:[90,208,160] };
  const accent = ACCENT_MAP[curTrack]||[150,120,200];
  for(let i=0;i<bars;i++){
    let v=0; for(let j=0;j<step;j++) v=Math.max(v,data[i*step+j]); v/=255;
    const h=Math.pow(v,0.85)*H*0.95;
    const a=0.35+0.6*v;
    vctx.fillStyle='rgba('+accent[0]+','+accent[1]+','+accent[2]+','+a+')';
    vctx.fillRect(i*bw+1, H-h, bw-2, h);
  }
  // playhead / loop position
  const t=trackOf(curTrack);
  if(t){ const C=compile(t); const pos=(stepIndex%C.totalSteps)/C.totalSteps; vctx.fillStyle='rgba(255,255,255,.5)'; vctx.fillRect(pos*W,0,2,H); }
}
draw();
renderCards(); updateUI();
</script>
</body>
</html>
