function updateTitle(dt){ if(keyEdge('Enter')||keyEdge('KeyZ')) startGame(); }

function setState(s){ const prev=game.state; game.state=s; game.stateT=0;
  if(s!==STATE.PLAYING&&s!==STATE.PAUSED) _cutin.active=false;   // tear down any in-flight cut-in entering a menu/terminal state
  if(s===STATE.TITLE){ game.paused=false; game.boss=null; abortStage&&abortStage(); enemies.length=0; items.length=0; enemyBullets.clear(); playerShots.clear(); particles.clear(); lasers.clear(); wells.clear(); Audio.playMusic('none'); if(activeTheme!==THEMES.spring) setTheme('spring'); }   // reset to the Stage-1 (spring) backdrop so a Stage-2 game-over doesn't leave the dusk/ghost scenery under the title
  else if(s===STATE.PAUSED){ game.paused=true; }
  else if(s===STATE.PLAYING){ game.paused=false; }
  else if(s===STATE.GAMEOVER){ game.paused=false; game._goFade=false; saveHiScore(); enemyBullets.clear(); lasers.clear(); wells.clear(); Audio.playMusic('gameover'); }   // somber lament; tail fades out (GAMEOVER_FADE) then auto-returns to TITLE at GAMEOVER_AUTORET (Enter also returns early)
  else if(s===STATE.STAGECLEAR){ game.paused=false; saveHiScore(); enemyBullets.clear(); lasers.clear(); wells.clear(); game.boss=null; if(player) endGrazePower(); Audio.playMusic('none'); }
}
// run = one campaign playthrough. startRun resets the whole loadout (score/lives/bombs/power);
// enterStage does the per-stage spawn reset and CARRIES the run loadout; advanceStage steps the
// campaign. With one stage, the last stage's clear is terminal — identical to today. (Phase 10+
// wires STAGE_INTERMISSION / RESULTS / CONTINUE around these seams.)
function startRun(diff, fromStage){
  run = { difficulty:(diff||'normal'), stage:(fromStage||0), continuesUsed:0, practice:false };
  const D = BALANCE.difficulties[run.difficulty] || BALANCE.difficulties.normal;
  _cutin.active=false; game.score=0; game.grazeCount=0; game.pointTotal=0; game.scoreMul=1; game.extendsTaken=0; game.fullpower=false; game.boss=null; game.spellIntensity=0; game.grazePowerThreshold=GRAZE_POWER_FIRST; game.grazePowerInterval=GRAZE_POWER_FIRST;
  player=makePlayer(); player.lives=D.lives; player.bombs=D.bombs;
  enterStage(run.stage);
}
function enterStage(i){
  run.stage=i; game.boss=null; if(player) endGrazePower();
  game.grazeCount=0; game.grazePowerThreshold=GRAZE_POWER_FIRST; game.grazePowerInterval=GRAZE_POWER_FIRST;   // each stage restarts the graze→power-up milestone ladder, so the grown threshold doesn't starve later stages of power-ups (no-op on the fresh-run first entry; startRun already set these)
  layoutOptions(); items.length=0; enemyBullets.clear(); playerShots.clear(); particles.clear(); lasers.clear(); wells.clear(); enemies.length=0;
  const st=STAGES[i], sm=(st&&st.music&&st.music.stage)||'stage';
  startStage(); setState(STATE.PLAYING); Audio.playMusic(sm);
}
// next-stage entry is DEFERRED (processed in simStep right after Director.update): calling
// enterStage()->startStage()->Director.start() from INSIDE the running stage coro would clear+repush
// the coro array mid-iteration, and update()'s trailing length-compaction would drop the freshly
// started Stage N+1 coro. Setting a flag and entering the stage at a safe point avoids that.
function advanceStage(){ if(run && run.stage < STAGES.length-1){ run._advanceTo=run.stage+1; } else onStageClear(); }
function startGame(){ startRun('normal', 0); }
// ---- SPELL PRACTICE (dev-only; armed by ?practice=<stage>.<枠>[.<phase>] in boot, inert in ship/golden) ----
// Jump straight into ANY boss at ANY 1-indexed phase and LOOP that phase→end forever for tuning. Generous
// loadout (full power, 99 lives/bombs) so practice is gated by skill, not resources. Sets the boss's home
// stage THEME so the backdrop/visibility reads exactly as in campaign. Query is numeric: <stage 1-6>.<枠
// 1=midboss 2=boss>[.<phase>] — e.g. 5.2.7 = Stage-5 final boss phase 7; 5.1 = Stage-5 midboss phase 1.
let PRACTICE = null;
function stageOfBoss(key){ for(const st of STAGES){ let found=false,last=null; for(const e of st.timeline){ if(e.boss!=null){ last=e.boss; if(e.boss===key) found=true; } } if(found) return { st, isFinal:(last===key) }; } return null; }
// resolve a numeric (stage 1-6, 枠 1=midboss 2=final) coordinate to a BOSSES key via the stage's timeline order.
function bossKeyAt(stage1, slot1){ const st=STAGES[(stage1|0)-1]; if(!st) return null; const keys=[]; for(const e of st.timeline){ if(e.boss!=null) keys.push(e.boss); } return keys[clamp((slot1|0)-1,0,keys.length-1)]||null; }
function startPractice(bossKey, phase1, diff){
  const spec=BOSSES[bossKey]; if(!spec){ console.warn('practice: unknown boss "'+bossKey+'". valid: '+Object.keys(BOSSES).join(', ')); return false; }
  const info=stageOfBoss(bossKey);
  run = { difficulty:(diff||'normal'), stage:(info?STAGES.indexOf(info.st):0), continuesUsed:0, practice:true };
  _cutin.active=false; game.score=0; game.grazeCount=0; game.pointTotal=0; game.scoreMul=1; game.extendsTaken=0; game.fullpower=true; game.boss=null; game.spellIntensity=0; game.grazePowerThreshold=GRAZE_POWER_FIRST; game.grazePowerInterval=GRAZE_POWER_FIRST;
  player=makePlayer(); player.lives=99; player.bombs=99;
  setTheme((info&&info.st.theme)||'spring');
  layoutOptions(); items.length=0; enemyBullets.clear(); playerShots.clear(); particles.clear(); lasers.clear(); wells.clear(); enemies.length=0;
  addPower(MAXPOWER);
  PRACTICE = { bossKey, spec, phase:clamp((phase1|0)-1,0,spec.phases.length-1), diff:(diff||'normal') };
  setState(STATE.PLAYING);
  const M=(info&&info.st.music)||{}; Audio.playMusic((info&&!info.isFinal)?(M.midboss||'midboss'):(M.boss||'boss'));
  Director.start(()=>runPractice());

}
function* runPractice(){
  while(true){
    if(activeTheme&&activeTheme.iwato) _iwatoLight=0;                  // re-arm the Stage-6 暗→光 ramp each loop (dark phases stay dark; P8 re-ramps from 0)
    yield* runBoss(resolveBoss(PRACTICE.spec, PRACTICE.diff), PRACTICE.phase);
    enemyBullets.clear(); lasers.clear(); wells.clear(); game.boss=null;
    if(player){ player.lives=99; player.bombs=99; }                    // top the loadout back up between loops
    yield* waitT(1.2);
  }
}
function togglePause(){ if(game.state===STATE.PLAYING) setState(STATE.PAUSED); else if(game.state===STATE.PAUSED) setState(STATE.PLAYING); }
function onStageClear(){ setState(STATE.STAGECLEAR); }

function playerUpdate(dt){
  player.focus=focusHeld();
  if(player.invuln>0){ player.invuln-=dt; player.blink=(Math.floor(player.invuln/RESPAWN_BLINK)&1)===0; } else player.blink=false;
  if(player.bombActive>0) player.bombActive-=dt;
  if(player.state==='pendingdeath'){ player.pendingDeath-=dt; if(keyEdge('KeyX')&&player.bombs>0){ player.state='alive'; doBomb(true); return; } if(player.pendingDeath<=0){ finalizeDeath(); return; } }
  if(player.state==='dead'){ player.respawnT-=dt; if(player.respawnT<=0) respawnNow(); return; }
  let dx=0,dy=0; if(moveLeft()) dx-=1; if(moveRight()) dx+=1; if(moveUp()) dy-=1; if(moveDown()) dy+=1; if(ext.analogActive){ dx+=ext.analogX; dy+=ext.analogY; } { const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; } } player.mvx=dx; player.mvy=dy;
  const moveMul=player.focus?PLAYER_FOCUS_MUL:(fireHeld()?1:PLAYER_FAST_MUL); const spd=PLAYER_SPEED*moveMul; player.x+=dx*spd*dt; player.y+=dy*spd*dt;
  if(!ext.dragConsumed){ player.x+=ext.dragDX; player.y+=ext.dragDY; ext.dragConsumed=true; } // touch drag = direct displacement, applied once/frame
  player.x=clamp(player.x,PLAYER_MARGIN,PF_W-PLAYER_MARGIN); player.y=clamp(player.y,PLAYER_MARGIN,PF_H-PLAYER_MARGIN);
  layoutOptions();
  if(keyEdge('KeyX')) tryBomb();
  if(player.state==='alive'){
    if(player.grazePowerT>0){ player.grazePowerT-=dt; if(player.grazePowerT<=0){ endGrazePower(); } else firePowerShots(dt); }
    else playerFire(dt);
  }
}
function respawnNow(){ player.state='alive'; player.dead=false; player.x=PLAYER_START.x; player.y=PLAYER_START.y; player.invuln=RESPAWN_INVULN; player.fireCd=0; player.grazePowerT=0; ext.dragDX=0; ext.dragDY=0; layoutOptions(); }

function shotLevel(){ const p=player.power; let lvl=0; for(let i=1;i<POWER_BREAKS.length;i++) if(p>=POWER_BREAKS[i]) lvl=i; return lvl; }
function optionCount(){ return [0,0,1,2,2,3,4][shotLevel()]; }
function layoutOptions(){ const n=optionCount(); if(player.options.length!==n){ player.options.length=0; for(let i=0;i<n;i++) player.options.push({x:0,y:0,tx:0,ty:0}); } const spread=player.focus?10:22; for(let i=0;i<n;i++){ const side=(i%2===0)?-1:1, rank=Math.floor(i/2)+1, o=player.options[i]; o.tx=side*spread*rank*0.6; o.ty=-6-rank*6; o.x+=(o.tx-o.x)*0.35; o.y+=(o.ty-o.y)*0.35; } }
function addPower(p){ if(player.power>=MAXPOWER){ game.fullpower=true; return; } const before=shotLevel(); player.power=Math.min(MAXPOWER,player.power+p); if(player.power>=MAXPOWER) game.fullpower=true; if(shotLevel()>before){ sfx.powerup&&sfx.powerup(); layoutOptions(); } }

function playerFire(dt){ if(player.fireCd>0) player.fireCd-=dt; if(!fireHeld()||player.fireCd>0) return; player.fireCd+=FIRE_CADENCE;
  const lvl=shotLevel(), focus=player.focus, up=-HALFPI;
  const streams=[1,1,2,2,3,3,4][lvl], spreadAng=focus?0.0:0.10;
  for(let i=0;i<streams;i++){ const t=(streams===1)?0:(i/(streams-1)-0.5), a=up+t*spreadAng*2, ox=(streams===1)?0:t*8; fireShot(player.x+ox,player.y-12,a,SHOT_SPEED,SHOT_DMG,'main'); }
  for(let i=0;i<player.options.length;i++){ const o=player.options[i], ox=player.x+o.x, oy=player.y+o.y; if(focus){ fireShot(ox,oy,up,SHOT_SPEED*1.05,OPTION_DMG,'option'); } else { const tgt=nearestEnemy(ox,oy); let a=up; if(tgt){ a=Math.atan2(tgt.y-oy,tgt.x-ox); a=up+clampAngle(a-up,-0.55,0.55); } fireShot(ox,oy,a,SHOT_SPEED*0.9,OPTION_DMG,'option'); } }
  for(let m=0;m<MUZZLE_PARTICLES;m++) spawnParticle(player.x+(rng()-0.5)*8,player.y-12,(rng()-0.5)*40,-120-rng()*60,{life:0.12,kind:'muzzle',hue:50,r:2});
  sfx.shoot&&sfx.shoot();
}
function fireShot(x,y,a,speed,dmg,style){ const b=playerShots.acquire(); if(!b) return; b.x=x; b.y=y; b.vx=Math.cos(a)*speed; b.vy=Math.sin(a)*speed; b.ax=0; b.ay=0; b.r=4; b.dmg=dmg; b.style=style; b.kind=(style==='option')?'orb':'needle'; b.hue=(style==='option')?200:330; b.pierce=0; b.alive=true; b.born=T; b.update=null; b.life=0; b.pierceSpell=false; }
function nearestEnemy(x,y){ let best=null,bd=1e9; for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(!e||e.dead) continue; const d=(e.x-x)*(e.x-x)+(e.y-y)*(e.y-y); if(d<bd){ bd=d; best=e; } } return best; }
// homing only targets enemies with an effective hitbox — skip invulnerable ones (an entering/announcing "準備中" boss),
// but a boss in a survival/耐久 spell IS targetable since the power-up's pierce damages it.
function nearestHomingTarget(x,y){ let best=null,bd=1e9; for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(!e||e.dead) continue; if(e.y>PF_H||e.x<0||e.x>PF_W) continue; /* skip enemies that have left the visible playfield (exiting down/sideways): they're unkillable, so don't waste homing shots chasing them off-screen */ const owner=e._shareHpWith||e; if(owner.invuln&&!(owner.boss&&owner.survivalActive)) continue; const d=(e.x-x)*(e.x-x)+(e.y-y)*(e.y-y); if(d<bd){ bd=d; best=e; } } return best; }   // owner-gated so a twin body isn't targeted during the shared pool's invuln windows
function clampAngle(a,lo,hi){ while(a>Math.PI) a-=TAU; while(a<-Math.PI) a+=TAU; return a<lo?lo:(a>hi?hi:a); }

// ---- graze power-up: activation + the super-shot (ignores power level; fires regardless of fireHeld) ----
function activateGrazePower(){ player.grazePowerT=GRAZE_POWER_DURATION; player.fireCd=0; clearBulletsToSparkles(player.x,player.y,GRAZE_ACTIVATE_CLEAR_R); /* clear nearby enemy bullets on activation */ sfx.extend&&sfx.extend(); Render.flash(0.5,GRAZE_HUE); Render.shake(0.35); for(let i=0;i<16;i++){ const a=rng()*TAU,s=80+rng()*120; spawnParticle(player.x,player.y,Math.cos(a)*s,Math.sin(a)*s,{life:0.5,kind:'sparkle',hue:GRAZE_HUE,r:3}); } }
// end the power-up. Homing shots are intentionally LEFT in flight — they persist until they hit or expire (GRAZE_HOMING_LIFE).
// Only the laser stops, since it's gated on grazePowerT>0. (In-flight homing keeps its pierceSpell flag, so it can still trim a survival timer until it lands.)
function endGrazePower(){ player.grazePowerT=0; player.fireCd=0; }
function firePowerShots(dt){
  if(player.focus){                                    // FOCUS — thick piercing laser (continuous column damage + beam render)
    grazeLaserDamage(dt);
    player.fireCd-=dt; if(player.fireCd<=0){ player.fireCd+=GRAZE_HOMING_CADENCE; sfx.powerShot&&sfx.powerShot(); spawnParticle(player.x+(rng()-0.5)*GRAZE_LASER_HALFW,player.y-14,(rng()-0.5)*30,-180,{life:0.12,kind:'muzzle',hue:GRAZE_HUE,r:2.4}); }   // laser SFX/muzzle ticks at the homing cadence (same pace as the homing shots)
  } else {                                             // NON-FOCUS — giant homing bullets
    if(player.fireCd>0) player.fireCd-=dt;
    if(player.fireCd<=0){ player.fireCd+=GRAZE_HOMING_CADENCE; spawnHomingShots(); sfx.powerShot&&sfx.powerShot(); }
  }
}
function spawnHomingShots(){ const n=GRAZE_HOMING_COUNT;
  for(let i=0;i<n;i++){ const t=(n>1)?(i/(n-1)-0.5):0, a=-HALFPI+t*GRAZE_HOMING_SPREAD+(rng()-0.5)*0.12;
    const s=playerShots.acquire(); if(!s) return;
    s.x=player.x+t*10; s.y=player.y-10; s.vx=Math.cos(a)*GRAZE_HOMING_SPEED; s.vy=Math.sin(a)*GRAZE_HOMING_SPEED; s.ax=0; s.ay=0;
    s.r=GRAZE_HOMING_R; s.dmg=GRAZE_HOMING_DMG; s.style='powerHoming'; s.kind='homing'; s.hue=GRAZE_HUE; s.pierce=0; s.pierceSpell=true; s.update=updHomingShot; s.life=GRAZE_HOMING_LIFE; s.alive=true; s.born=T; }

}
function updHomingShot(s,dt){ const tgt=nearestHomingTarget(s.x,s.y);
  if(tgt){ const want=Math.atan2(tgt.y-s.y,tgt.x-s.x), cur=Math.atan2(s.vy,s.vx); let da=want-cur; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU; const m=GRAZE_HOMING_TURN*dt; if(da>m)da=m; else if(da<-m)da=-m; const na=cur+da; s.vx=Math.cos(na)*GRAZE_HOMING_SPEED; s.vy=Math.sin(na)*GRAZE_HOMING_SPEED; }
  s.x+=s.vx*dt; s.y+=s.vy*dt; }
// continuous laser: damage every enemy in a vertical column above the player (pierces all; trims survival timers)
function grazeLaserDamage(dt){ const px=player.x, py=player.y, halfW=GRAZE_LASER_HALFW, dmg=GRAZE_LASER_DPS*dt;
  for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(!e||e.dead) continue;
    const owner=e._shareHpWith||e; const pierceable=owner.boss&&owner.survivalActive; if(owner.invuln&&!pierceable) continue;   // eligibility reads the shared owner (twin-boss); the column hit stays per-body so either sister can be lasered

function tryBomb(){ if(player.state!=='alive'||player.bombs<=0) return false; doBomb(false); return true; }
function doBomb(isDeathbomb){ player.bombs--; player.invuln=Math.max(player.invuln,BOMB_INVULN); player.bombActive=BOMB_INVULN; player.bossDot=BOMB_DOT_TIME; Render.flash(BOMB_FLASH,55); Render.shake(0.6); Render.cancelWave(player.x,player.y,55,1.2); clearBulletsToSparkles(player.x,player.y,1e9); lasers.forEachLive(L=>{ if(L.alive&&L.state==='fire'){ L.state='warn'; L.t=0; } }); wells.forEachLive(w=>{ if(w.alive&&w.state==='active'){ w.state='warn'; w.t=0; } }); for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(e&&!e.boss&&!e.dead&&!e.invuln) damageEnemy(e,99999,true); } sfx.bomb&&sfx.bomb(); }   // a bomb RE-TELEGRAPHS active 御来光 beams (flip FIRE→WARN, restart their warn) so the panic window honours the bomb contract — without deleting the boss's beams (which would trivialise the laser spells; they re-fire after the warn)
function applyBossDot(dt){ if(player.bossDot>0){ player.bossDot-=dt; for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(e&&!e.dead&&!e._shareHpWith&&!e.invuln) damageEnemy(e,BOMB_BOSS_DPS*dt,true); } } }   // skip twin-boss secondary bodies: the DoT must hit a shared HP pool only ONCE per frame (the primary carries it; the redirect would otherwise double-count)
function clearBulletsToSparkles(cx,cy,radius){ const r2=radius*radius; enemyBullets.forEachLive(b=>{ if(!b.alive) return; const d=(b.x-cx)*(b.x-cx)+(b.y-cy)*(b.y-cy); if(d<=r2){ b.alive=false; addScore(10); spawnParticle(b.x,b.y,(rng()-0.5)*60,(rng()-0.5)*60,{life:0.3,kind:'sparkle',hue:b.hue||55,r:2.6}); } }); }

function onPlayerHit(srcBullet,enemy){ if(player.state!=='alive'||player.invuln>0) return;
  if(player.grazePowerT>0){ // a hit during power-up does NOT release it and grants NO i-frames — it only trims the remaining time (no miss). The bullet is consumed so one distinct bullet = one -1s (no per-frame re-hit).
    player.grazePowerT=Math.max(0,player.grazePowerT-GRAZE_HIT_PENALTY); if(srcBullet) srcBullet.alive=false;
    sfx.grazeHit&&sfx.grazeHit(); Render.flash(0.22,GRAZE_HUE); Render.shake(0.22);
    for(let i=0;i<8;i++){ const a=rng()*TAU,s=50+rng()*80; spawnParticle(player.x,player.y,Math.cos(a)*s,Math.sin(a)*s,{life:0.3,kind:'sparkle',hue:GRAZE_HUE,r:2.2}); }
    if(player.grazePowerT<=0) endGrazePower();   // a hit that drains it to 0 ends the power-up → clean up trailing shots
    return; }
  player.state='pendingdeath'; player.pendingDeath=DEATHBOMB_TIME; if(srcBullet) srcBullet.alive=false; }
function finalizeDeath(){ player.state='dead'; player.dead=true; endGrazePower(); game.scoreMul=1; player.lives--; player.bombs=START_BOMBS; player.respawnT=0.55; sfx.death&&sfx.death(); Render.shake(0.7); Render.slowmo(0.4,0.5); clearBulletsToSparkles(player.x,player.y,DEATH_CLEAR_R); for(let i=0;i<26;i++){ const a=rng()*TAU, s=60+rng()*160; spawnParticle(player.x,player.y,Math.cos(a)*s,Math.sin(a)*s,{life:0.5,kind:'death',hue:330,r:3}); } player.power=Math.max(0,player.power-Math.floor(player.power*0.25)-15); game.fullpower=(player.power>=MAXPOWER); dropItems('power',DEATH_POWER_DROP,player.x,player.y-10,80); if(player.lives<0){ player.state='gameover'; setState(STATE.GAMEOVER); } }

function addScore(n){ game.score+=n; while(game.extendsTaken<Math.floor(game.score/EXTEND_INTERVAL)){ game.extendsTaken++; spawnExtendItem(); } if(game.score>game.hi) game.hi=game.score; }
// score-extend no longer adds a life directly — it drops a 1UP at the screen top, straight above the player,
// to be collected (grantExtend('item') fires on pickup). No rng → deterministic, golden-neutral.
function spawnExtendItem(){ const px=(player&&player.x!=null)?player.x:PF_W/2; spawnItem('oneup',px,-ITEM_R,0,EXTEND_ITEM_FALL); Render.flash(0.25,ITEM_HUE.oneup); }
function addGraze(n){ n=n||1; game.grazeCount+=n; addScore(GRAZE_SCORE*n); sfx.graze&&sfx.graze();
  // graze-milestone power-up: each crossed threshold (re)activates; interval grows +10 each time.
  while(player&&player.state==='alive'&&game.grazeCount>=game.grazePowerThreshold){ activateGrazePower(); game.grazePowerInterval+=GRAZE_POWER_STEP; game.grazePowerThreshold+=game.grazePowerInterval; } }
function onGraze(bullet){ if(player.invuln>0) return; addGraze(1); spawnParticle(bullet.x,bullet.y,(rng()-0.5)*40,-30,{life:0.18,kind:'graze',hue:55,r:2}); }
// At the life cap, a collected 1UP converts to its EXTEND_INTERVAL (1M) value in score instead of a life.
// Pre-bump extendsTaken so the +1M crossing doesn't itself spawn a fresh 1UP (the score's own extend is suppressed).
function grantExtend(reason){ if(player.lives>=MAX_LIVES){ game.extendsTaken++; addScore(EXTEND_INTERVAL); sfx.oneup&&sfx.oneup(); Render.flash(0.4,150); return; } player.lives++; sfx.oneup&&sfx.oneup(); Render.flash(0.4,150); }

const HISCORE_KEY='danmaku_hiscore_v1';            // legacy v1 int (kept one release for migration)
const SAVE_KEY='danmaku_save_v2';
let save=null;
// migrate any prior save to v2, folding the legacy v1 int hi-score into hiByDiff.normal.
// read-old-before-write-new + never-lower, so returning players never lose their hi-score.
function migrateSave(old){ const s=(old&&typeof old==='object')?old:{}; s.ver=2;
  if(!s.hiByDiff||typeof s.hiByDiff!=='object') s.hiByDiff={};
  for(const k of ['easy','normal','hard','lunatic']) if(typeof s.hiByDiff[k]!=='number') s.hiByDiff[k]=0;
  if(!s.furthestStage) s.furthestStage={}; if(!s.clears) s.clears={}; if(typeof s.lastName!=='string') s.lastName='';
  try{ const v1=localStorage.getItem(HISCORE_KEY); if(v1!=null){ const n=parseInt(v1,10)||0; if(n>s.hiByDiff.normal) s.hiByDiff.normal=n; } }catch(e){}
  return s; }
function loadSave(){ let s=null; try{ const raw=localStorage.getItem(SAVE_KEY); if(raw) s=JSON.parse(raw); }catch(e){ s=null; } return migrateSave(s); }
function loadHiScore(){ save=loadSave(); const d=(run&&run.difficulty)||'normal'; game.hi=save.hiByDiff[d]||0; }
function saveHiScore(){ if(!save) save=loadSave(); const d=(run&&run.difficulty)||'normal'; if(game.score>game.hi) game.hi=game.score; if(game.hi>(save.hiByDiff[d]||0)) save.hiByDiff[d]=game.hi; try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){} }

function spawnItem(kind,x,y,vx,vy){ items.push({ kind, x, y, vx:vx||0, vy:(vy!=null?vy:-60), r:ITEM_R, hue:ITEM_HUE[kind]!=null?ITEM_HUE[kind]:55, magnet:false, dead:false, born:T }); }
function dropItems(kind,count,x,y,spread){ for(let i=0;i<count;i++){ const a=(-HALFPI)+(rng()-0.5)*1.6, s=60+rng()*90; spawnItem(kind,x+(rng()-0.5)*spread,y,Math.cos(a)*s,Math.sin(a)*s); } }
function dropItem(x,y,kind){ spawnItem(kind,x,y,rng.range(-30,30),-rng.range(40,90)); }
function updateItems(dt){ const pAlive=(player.state==='alive'||player.state==='pendingdeath'); const magnetAll=(pAlive&&player.y<=POC_LINE_Y);
  for(let i=items.length-1;i>=0;i--){ const it=items[i];
    if(!it.magnet){ if(magnetAll&&pAlive) it.magnet=true; }
    if(it.magnet&&pAlive){
      // decoupled homing: speed ramps fast (full ACC), heading slews loosely (TURN rad/s),
      // radial floor (PULL) forces the radius to shrink every tick so it can't orbit.
      const dx=player.x-it.x, dy=player.y-it.y, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
      if(it.spd==null){ it.spd=Math.hypot(it.vx,it.vy); it.dir=(it.spd>1)?Math.atan2(it.vy,it.vx):Math.atan2(dy,dx); }
      it.spd=Math.min(ITEM_MAGNET_MAXSPD, it.spd+ITEM_MAGNET_ACC*dt);
      let da=Math.atan2(dy,dx)-it.dir; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
      const maxTurn=ITEM_MAGNET_TURN*dt; if(da>maxTurn)da=maxTurn; else if(da<-maxTurn)da=-maxTurn; it.dir+=da;
      let vx=Math.cos(it.dir)*it.spd, vy=Math.sin(it.dir)*it.spd;
      const radial=vx*ux+vy*uy, minClose=ITEM_MAGNET_PULL*it.spd;
      if(radial<minClose){ const tx=vx-radial*ux, ty=vy-radial*uy, tlen=Math.hypot(tx,ty), maxTang=Math.sqrt(Math.max(0,it.spd*it.spd-minClose*minClose)), sc=tlen>0?Math.min(1,maxTang/tlen):0; vx=minClose*ux+tx*sc; vy=minClose*uy+ty*sc; it.dir=Math.atan2(vy,vx); }
      it.vx=vx; it.vy=vy;
    } else { it.vy+=ITEM_GRAV*dt; if(it.vy>ITEM_TERMINAL) it.vy=ITEM_TERMINAL; it.vx*=0.992; if(it.spd!=null){ it.spd=null; it.dir=null; } applyWellsTo(it,dt,false); }   // free-falling items feel the 嵐の渦 too (radial pull + swirl orbit); ONLY in this free-fall branch — the magnet / POC auto-collect branch above fully recomputes vx/vy so the player magnet ALWAYS wins → items stay collectable. No-op when no well is live (Stages 1-4 unchanged).
    it.x+=it.vx*dt; it.y+=it.vy*dt;
    if(pAlive){ const ddx=it.x-player.x, ddy=it.y-player.y; if(ddx*ddx+ddy*ddy<=ITEM_COLLECT_R*ITEM_COLLECT_R){ collectItem(it); swapRemove(items,i); continue; } }
    if(it.y>PF_H+ITEM_DESPAWN_GRACE){ swapRemove(items,i); }
  }
}
function pointItemValue(yAtCollect){ const top=POC_LINE_Y, bot=PF_H; const y=yAtCollect<top?top:yAtCollect; let t=(y-top)/(bot-top); t=t>1?1:t; return Math.round(POINT_BASE-t*(POINT_BASE-POINT_MIN)); }   // height bonus CAPPED at the auto-collect (POC) line: clamp y to ≥top so collecting ANYWHERE above POC_LINE_Y scores exactly the at-line value (POINT_BASE); below the line decays toward POINT_MIN. (Output identical to the prior `t<0?0` clamp — this just states the cap explicitly in y.)
function takePoint(it){ game.pointTotal++; const score=Math.round(pointItemValue(it.y)*Math.min(SCORE_MUL_MAX_APPLY,game.scoreMul)); addScore(score); if(it.kind==='point') game.scoreMul=Math.min(SCORE_MUL_CAP,game.scoreMul+SCORE_MUL_GAIN); return pitchInfoFor(score); }   // score FIRST at current (capped) mult, THEN bump; returns the score-pitched pickup note (audio-only)
function collectItem(it){ let midi; switch(it.kind){ case 'power': game.fullpower?(midi=takePoint(it)):addPower(POWER_PER_ITEM); break; case 'bigpower': game.fullpower?(midi=takePoint(it)):addPower(POWER_PER_BIG); break; case 'full': game.fullpower?(midi=takePoint(it)):addPower(MAXPOWER); break; case 'oneup': grantExtend('item'); break; case 'bomb': player.bombs=Math.min(MAX_BOMBS,player.bombs+1); break; case 'point': midi=takePoint(it); break; } if(it.kind!=='oneup') sfx.item&&sfx.item(it.kind, midi); spawnParticle(it.x,it.y,0,-40,{life:0.25,kind:'pickup',hue:it.hue,r:3}); }
function onEnemyHit(e,shot){ damageEnemy(e,shot.dmg,shot.pierceSpell?GRAZE_PIERCE:null); }

const INTRO_FADE=2.5, CALM_BEFORE_BOSS=4.0, WAVE_GAP=1.2, BOSS_ENTER=2.2, SPELL_ANNOUNCE=1.6, PHASE_HEAL=0.5;
const R_POP_LIGHT=9, R_POP_MED=11, R_POP_HEAVY=14;
const HP_POP_LIGHT=8, HP_POP_MED=16, HP_POP_HEAVY=33.6;   // real per-pop HP (the former global ×0.8 ENEMY_HP_MUL is folded in here and into every boss-phase hp below)

const SLOWMO_DEFEAT=0.35, SLOWMO_DEFEAT_DUR=2.2, CANCEL_TO_ITEM=true, CANCEL_ITEM_MAX=12;   // cap point items MINTED per cancelBullets call so a dense field-clear can't mint dozens
const EASE={ linear:t=>t, inOut:t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2, out:t=>1-(1-t)*(1-t), in:t=>t*t, smooth:t=>t*t*t*(t*(t*6-15)+10) };   // smooth = quintic smootherstep: zero velocity AND accel at both ends (silkiest glide; used by the 蛟 water-serpent so its motion never snaps)

// fx adapters (stage vocabulary -> Render.*)
function hexHue(hex){ if(!hex||hex[0]!=='#') return 0; const n=parseInt(hex.slice(1),16); let r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b); if(mx===mn) return 0; const d=mx-mn; let h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; return (h/6)*360; }

function spawnDeathPuff(x,y,hue){ spawnParticle(x,y,0,0,{life:0.5,kind:'ring',hue,r:8}); for(let i=0;i<12;i++){ const a=rng()*TAU, s=40+rng()*120; spawnParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,{life:0.4+rng()*0.3,kind:'death',hue,r:2+rng()*2}); } }
function cancelBullets(o){ o=o||{}; const all=o.all, cx=o.x, cy=o.y, rad=o.radius||1e9, r2=rad*rad, frac=o.frac!=null?o.frac:1, itemCap=o.itemCap!=null?o.itemCap:CANCEL_ITEM_MAX; let cleared=0, minted=0; enemyBullets.forEachLive(b=>{ if(!b.alive) return; if(!all){ const dx=b.x-cx,dy=b.y-cy; if(dx*dx+dy*dy>r2) return; } if(frac<1&&rng()>frac) return; b.alive=false; cleared++; addScore(20); spawnParticle(b.x,b.y,(rng()-0.5)*70,(rng()-0.5)*70,{life:0.4,kind:'sparkle',hue:b.hue||55,r:2.6}); if(o.toItems&&(cleared%8===0)&&minted<itemCap){ minted++; spawnItem('point',b.x,b.y,rng.range(-20,20),-40); } }); if(cleared){ Render.cancelWave(all?PF_W/2:cx,all?PF_H*0.42:cy,200,1); Render.flash(0.2,55); } }

// ---- Director: coroutine scheduler with phase epochs ----
const Director=(function(){
  let coros=[]; let curEpoch=0, epochSeq=0;
  function _wrap(gen,owner,epoch){ return { gen, sleep:0, owner:owner||null, alive:true, epoch:epoch }; }
  function start(genFn){ clear(); curEpoch=0; epochSeq=0; const h=_wrap(genFn(),null,-1); coros.push(h); return h; }
  function fork(genFn,owner){ const h=_wrap(genFn(),owner,curEpoch); coros.push(h); return h; }
  function kill(h){ if(h) h.alive=false; }
  function clear(){ coros.length=0; curEpoch=0; }
  function beginGroup(){ epochSeq++; const prev=curEpoch; curEpoch=epochSeq; return { id:epochSeq, prev }; }
  function endGroup(g){ for(let i=0;i<coros.length;i++) if(coros[i].epoch===g.id) coros[i].alive=false; curEpoch=g.prev; }
  function _step(h,dt){ if(!h.alive) return false; if(h.owner&&h.owner.dead) return false; if(h.sleep>0){ h.sleep-=dt; if(h.sleep>0) return true; dt=0; } let res; try{ res=h.gen.next(); }catch(e){ console.error('coro',e); return false; } if(res.done) return false; const y=res.value; if(typeof y==='number') h.sleep=y; else if(y&&typeof y==='object'&&'sleep'in y) h.sleep=y.sleep; return true; }
  function update(dt){ const n=coros.length; let w=0; for(let i=0;i<coros.length;i++){ const h=coros[i]; const keep=(i<n)?_step(h,dt):true; if(keep&&h.alive&&!(h.owner&&h.owner.dead)) coros[w++]=h; } coros.length=w; }
  return { start, fork, kill, clear, update, beginGroup, endGroup, get count(){ return coros.length; } };
})();
function tickStage(dt){ Director.update(dt); }
function startStage(){ Director.start(()=>runStage(STAGES[run.stage])); }
function abortStage(){ if(typeof Director!=='undefined') Director.clear(); }

// ---- wait primitives ----
function* waitT(sec){ yield sec; }
function* waitUntil(pred){ while(!pred()) yield; }
function* waitClear(opts){ const minHp=(opts&&opts.minHp)||0; while(true){ let live=0; for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(!e.dead&&!e.boss&&e.hp>minHp) live++; } if(live===0) return; yield; } }
function* parallel(){ const gens=Array.prototype.slice.call(arguments).map(g=>({g,done:false})); while(gens.some(o=>!o.done)){ for(const o of gens) if(!o.done&&o.g.next().done) o.done=true; yield; } }
function* spawnWave(gen){ yield* gen; }
function* delayed(sec,gen){ yield* waitT(sec); yield* gen; }   // stagger a wave inside parallel(): wait, then run the (lazily-iterated) generator

// ---- enemy ----
function spawnEnemy(spec){ const _hp=(spec.hp||1); const e={ x:spec.x, y:spec.y, vx:0, vy:0, hp:_hp, maxHp:_hp, r:spec.r||R_POP_MED, hue:spec.hue!=null?spec.hue:200, boss:!!spec.boss, bodyDamage:!!spec.bodyDamage, score:spec.score||1000, drops:spec.drops||[], dead:false, invuln:false, born:T, _spec:spec, _steered:false }; enemies.push(e); if(spec.coro) Director.fork(()=>spec.coro(e),e); return e; }
function enemyIntegrate(e,dt){ if(e._steered){ e._steered=false; return; } e.x+=e.vx*dt; e.y+=e.vy*dt; }
function damageEnemy(e,dmg,opts){ if(!e) return false; if(e._shareHpWith) e=e._shareHpWith; if(e.dead) return false;   // twin-boss body → all damage lands on the shared HP/invuln pool (the primary)
  // endurance (耐久/survival) spell: invulnerable to normal damage; only pierce-shots act, by trimming the
  // remaining timer in proportion to the HP fraction dealt. Bombs are not pierce-flagged → cannot break it.
  if(e.boss&&e.survivalActive){ if(opts&&opts.pierce){ if(e.survivalTotal>0&&e.maxHp>0) e.timer=Math.max(0,e.timer-e.survivalTotal*(dmg/e.maxHp)); e.hp=Math.max(0,e.hp-dmg); } return false; }   // pierce drains BOTH the HP bar and the survival timer (HP fraction removed == time fraction removed)
  if(e.invuln) return false;
  e.hp-=dmg; if(e.hp<=0&&!e.boss){ killEnemy(e, (opts&&opts.pierce)?POWERUP_KILL_MULT:1); return true; } return false; }
function killEnemy(e,scoreMul){ if(e.dead) return; e.dead=true; scoreMul=scoreMul||1; sfx.enemyDeath&&sfx.enemyDeath(); spawnDeathPuff(e.x,e.y,e.hue); if(e._spec&&e._spec.cancelOnDeath) cancelBullets({x:e.x,y:e.y,radius:70,frac:e._spec.cancelOnDeath,toItems:false}); if(e.drops) for(const d of e.drops) dropItem(e.x+rng.range(-8,8),e.y+rng.range(-6,6),d); if(e._spec&&e._spec.onDeath) e._spec.onDeath(e);
  if(scoreMul>1){ spawnParticle(e.x,e.y,0,0,{life:0.45,kind:'ring',hue:GRAZE_HUE,r:13}); for(let i=0;i<6;i++){ const a=i/6*TAU; spawnParticle(e.x,e.y,Math.cos(a)*95,Math.sin(a)*95,{life:0.4,kind:'sparkle',hue:GRAZE_HUE,r:2.4}); } }   // power-up bonus-kill accent in the verdant power-up hue (deterministic; only fires when a power-up shot lands the kill)
  addScore((e.score||0)*scoreMul); }
function despawnEnemy(e){ e.dead=true; }

// ---- movement helpers (generators) ----
function* moveTo(e,tx,ty,dur,ease){ ease=ease||EASE.inOut; const sx=e.x,sy=e.y,t0=T; if(dur<=0){ e.x=tx; e.y=ty; e._steered=true; return; } while(true){ const k=Math.min(1,(T-t0)/dur), u=ease(k); e.x=sx+(tx-sx)*u; e.y=sy+(ty-sy)*u; e._steered=true; if(k>=1) return; yield; } }
function* moveBezier(e,c1,c2,p3,dur,ease){ ease=ease||EASE.inOut; const p0={x:e.x,y:e.y},t0=T; while(true){ const k=Math.min(1,(T-t0)/dur),u=ease(k),iu=1-u; const b0=iu*iu*iu,b1=3*iu*iu*u,b2=3*iu*u*u,b3=u*u*u; e.x=b0*p0.x+b1*c1.x+b2*c2.x+b3*p3.x; e.y=b0*p0.y+b1*c1.y+b2*c2.y+b3*p3.y; e._steered=true; if(k>=1) return; yield; } }
function* holdFire(e,fireGenFn,sec){ const fc=Director.fork(()=>fireGenFn(e),e); yield* waitT(sec); Director.kill(fc); }
function* exitOff(e,dir,speed){ speed=speed||160; e.vx=Math.cos(dir)*speed; e.vy=Math.sin(dir)*speed; while(e.x>-OFFSCREEN_PAD&&e.x<PF_W+OFFSCREEN_PAD&&e.y>-OFFSCREEN_PAD&&e.y<PF_H+OFFSCREEN_PAD){ e.x+=e.vx*STEP; e.y+=e.vy*STEP; e._steered=true; yield; } e.dead=true; }

// ---- firing routines ----
function* fireAimedBursts(e,opts){ const period=opts.period||0.9, count=opts.count||1, n=opts.n||3; while(true){ for(let i=0;i<count;i++){ aimedShot(e,{speed:opts.speed||150,spread:opts.spread||0.2,n,hue:opts.hue!=null?opts.hue:e.hue,style:opts.style||'mid'}); yield* waitT(period/Math.max(1,count)); } } }
function* fireRings(e,opts){ const period=opts.period||1.4; while(true){ ring(e,{count:opts.count||16,speed:opts.speed||120,hue:opts.hue!=null?opts.hue:e.hue,style:opts.style||'mid',aim:opts.aim?Math.atan2(player.y-e.y,player.x-e.x):0}); yield* waitT(period); } }
function* fireSpiralTurret(e,opts){ const period=opts.period||0.06, da=opts.da||0.31; let a=opts.a0||0; while(true){ spiral(e,{angle:a,arms:opts.arms||2,speed:opts.speed||130,hue:(e.hue+(T*40))%360,style:opts.style||'small'}); a+=da; yield* waitT(period); } }

// ---- wave generators ----
// opts.yStep (px) staggers each successive enemy's entry depth → a diagonal ECHELON line instead of a flat
// 横一列 row (sign chooses up/down slant). yStep omitted ⇒ flat row, unchanged (Stage 1 never passes it).
function waveSideSweep(opts){ return (function*(){ const n=opts.n||6, side=opts.side||'left', y=opts.y||90, hue=opts.hue!=null?opts.hue:205, yStep=opts.yStep||0, halveP=!!opts.halvePower, sparse=!!opts.sparse; const fromX=side==='left'?-SPAWN_MARGIN:PF_W+SPAWN_MARGIN, toX=side==='left'?PF_W+SPAWN_MARGIN:-SPAWN_MARGIN; for(let i=0;i<n;i++){ const ey=y+i*yStep; spawnEnemy({ x:fromX, y:ey, hp:HP_POP_LIGHT, r:R_POP_LIGHT, hue:hue, score:400, drops:(sparse&&i%2!==0)?[]:((i%3===0&&(!halveP||i%6===0))?['power']:['point']), coro:function*(e){ yield* moveTo(e,side==='left'?40:PF_W-40,ey,0.7,EASE.out); const fc=Director.fork(()=>fireAimedBursts(e,{period:1.0,n:1,speed:150,hue:hue,style:'mid'}),e); yield* moveTo(e,toX,ey+60,3.2,EASE.linear); Director.kill(fc); despawnEnemy(e); } }); yield* waitT(opts.spacing||0.18); } })(); }
function waveVFormation(opts){ return (function*(){ const half=opts.half||4, apexX=opts.apexX||PF_W/2, apexY=opts.apexY||80, dx=opts.dx||30, dy=opts.dy||26, hue=opts.hue!=null?opts.hue:350, halveP=!!opts.halvePower; for(let s=-1;s<=1;s+=2){ for(let i=(s<0?half:0); s<0?i>=1:i<=half; i+=(s<0?-1:1)){ const tx=apexX+s*i*dx, ty=apexY+i*dy; spawnEnemy({ x:apexX, y:-SPAWN_MARGIN, hp:HP_POP_MED, r:R_POP_MED, hue:hue, score:600, drops:halveP?['point']:['power','point'], coro:function*(e){ yield* moveTo(e,tx,ty,0.9,EASE.out); yield* holdFire(e,function*(en){ yield* fireRings(en,{period:1.1,count:12,speed:110,hue:hue,aim:true}); },2.4); yield* exitOff(e,Math.PI*0.5+(s*0.25)); } }); yield* waitT(0.08); } } })(); }
function waveStream(opts){ return (function*(){ const n=opts.n||10, x=opts.x||PF_W*0.5, hue=opts.hue!=null?opts.hue:130, halveP=!!opts.halvePower; for(let i=0;i<n;i++){ const cx=x+Math.sin(i*0.6)*(opts.amp||60); spawnEnemy({ x:cx, y:-SPAWN_MARGIN, hp:HP_POP_MED, r:R_POP_MED, hue:hue, score:450, drops:(i%2)?['point']:((!halveP||i%4===0)?['power']:['point']), coro:function*(e){ const fc=Director.fork(()=>fireAimedBursts(e,{period:1.3,n:3,spread:0.25,speed:140,hue:hue}),e); yield* moveTo(e,cx+rng.range(-30,30),PF_H+SPAWN_MARGIN,4.0,EASE.linear); Director.kill(fc); despawnEnemy(e); } }); yield* waitT(opts.spacing||0.45); } })(); }
function waveTurrets(opts){ return (function*(){ const xs=opts.xs||[PF_W*0.28,PF_W*0.72], y=opts.y||130, hue=opts.hue!=null?opts.hue:280; for(let i=0;i<xs.length;i++){ spawnEnemy({ x:xs[i], y:-SPAWN_MARGIN, hp:HP_POP_HEAVY, r:R_POP_HEAVY, hue:hue, score:1250, drops:['power','power','point'], cancelOnDeath:0.4, coro:function*(e){ yield* moveTo(e,xs[i],y,1.0,EASE.out); yield* holdFire(e,function*(en){ yield* fireSpiralTurret(en,{da:i?-0.33:0.33,period:0.07,arms:2,speed:125,a0:i*Math.PI}); },opts.hold||5.0); yield* exitOff(e,i?Math.PI*0.85:Math.PI*0.15,140); } }); } yield; })(); }
// wave registry: friendly name -> factory(opts) -> generator. The stage timeline (Phase 7 STAGES data)
// references waves by name; runStage resolves them here. The "id-referenced generator registry" for waves.
// Stage 2 ghost-flavoured road wave: wisps drift straight down in a slow sine sway, lobbing slow
// aimed shots, then dissipate off the bottom. Manual integrate (sets _steered) like exitOff.
// opts.band (>0) scatters each enemy's spawn x across a band centred on opts.x via a low-discrepancy
// sequence (golden-ratio) → a SPREAD formation emerging from different positions, not a tight column;
// opts.bandPhase offsets that sequence so two overlapping waves interleave. band omitted ⇒ unchanged.
// opts.speed sets the base descent rate (default 52 px/s) — give overlapping clusters DIFFERENT speeds so
// they settle into distinct depth layers instead of piling into one horizontal band; opts.speedJit (0..1)
// shears the cluster, biasing speed UP across the shared low-discrepancy coord u (faster ones pull ahead →
// a vertical smear, never slower so nothing lingers); opts.drift adds px/s of lateral travel → a diagonal

// Grove vocabulary, distinct from Stage 2's ghost road: NO homing soul-orb rings (pat.delayedTurn).

// stalkFile — a straight bullet file that EMANATES from the (moving) enemy body: fires one bullet from the

// Manual integrate loop sets _steered each tick (the #1 trap). Fire fork is owner-tied (auto-kill on death).

  const cols=opts.cols||3, per=opts.per||5, hue=opts.hue!=null?opts.hue:140,

})(); }

// waveVortexRing — Stage 5's NEW road identity: a ROTATING RING of cloud-sprites orbiting a shared centre. No other

// ---- boss: descriptor-driven phase machine ----
function makeBoss(spec){ const _bd=BOSS_DESIGNS[spec.design]; const b=spawnEnemy({ x:spec.enterFrom?spec.enterFrom.x:PF_W/2, y:spec.enterFrom?spec.enterFrom.y:-60, hp:1, r:_bd?_bd.hitR:18, hue:spec.hue!=null?spec.hue:320, boss:true, score:spec.score||50000, drops:[], coro:null }); b.invuln=true; b.phaseTotal=spec.phases.length; b.phaseIndex=0; b.phasesLeft=spec.phases.length; b.spellName=''; b.inSpell=false; b.timer=null; b.hpMax=1; b.design=spec.design; b.survivalActive=false; b.survivalTotal=0; return b; }
// 2体同時出現 (shared HP): a SECOND boss body that shares the primary's single HP pool. boss:true so
// drawEnemies skips it & it's never auto-killed; its incoming damage redirects onto the primary via
// _shareHpWith (see damageEnemy + collideShotsEnemies). It carries its own position/hitbox/design so it
// can be aimed at & fired from independently; the primary's runBoss owns phases/HUD/teardown. Rendered
// next to the primary (RenderFrame draws game.boss._twin); spec phases fire from it via b._twin.
function makeTwinBody(tw,primary){ const _bd=BOSS_DESIGNS[tw.design]; const b=spawnEnemy({ x:tw.enterFrom?tw.enterFrom.x:PF_W/2, y:tw.enterFrom?tw.enterFrom.y:-60, hp:1, r:_bd?_bd.hitR:18, hue:tw.hue!=null?tw.hue:320, boss:true, score:0, drops:[], coro:null }); b.design=tw.design; b._shareHpWith=primary; b.invuln=true; b.spellName=''; b.inSpell=false; return b; }
function* runBoss(spec, startPi){ const boss=makeBoss(spec); hud.setBoss(boss);
  const twin=spec.twin?makeTwinBody(spec.twin,boss):null; if(twin) boss._twin=twin;
  if(twin) yield* parallel(moveTo(boss,spec.enterTo.x,spec.enterTo.y,BOSS_ENTER,EASE.inOut), moveTo(twin,spec.twin.enterTo.x,spec.twin.enterTo.y,BOSS_ENTER,EASE.inOut));
  else yield* moveTo(boss,spec.enterTo.x,spec.enterTo.y,BOSS_ENTER,EASE.inOut);
  boss.invuln=false; if(twin) twin.invuln=false;
  for(let pi=(startPi||0);pi<spec.phases.length;pi++){ const ph=spec.phases[pi]; boss.phaseIndex=pi; boss.phasesLeft=spec.phases.length-pi; yield* runPhase(boss,ph,pi);
    if(ph.onClear) ph.onClear(boss);   // 「撃破した瞬間」hook (symmetric with onEnter) — fires the instant the phase clears, BEFORE the bomb/flash/heal. Absent on every phase but TOKOYO P7 (queues the dawn BGM) → byte-identical elsewhere.
    sfx.bomb&&sfx.bomb(); cancelBullets({all:true,toItems:CANCEL_TO_ITEM}); screenFlash('#ffffff',0.35); shake(6,0.3);
    // per-phase drops: an opt-in ph.dropSpread fans them across a band centred on the boss (with matching lateral pop) so
    // they DON'T stack in the boss-centre column the NEXT phase may immediately flood (S5 須佐之男 P2→P3: dropped items fell
    // straight down x≈216 into P3's centre-origin burst/spiral → forced hit to collect). dropSpread absent/0 = the old
    // boss.x cluster, byte-identical (same dropItem call + rng draw order) → every other boss/stage unchanged.
    { const _drops=ph.drops||[], _ds=ph.dropSpread||0;
      for(let _i=0;_i<_drops.length;_i++){
        if(_ds>0){ const _fx=(_drops.length>1)?(_i/(_drops.length-1)-0.5):0; const _x=clamp(boss.x+_fx*_ds+rng.range(-12,12),28,PF_W-28);
          spawnItem(_drops[_i], _x, boss.y+rng.range(-10,10), _fx*120+rng.range(-40,40), -rng.range(40,90)); }
        else dropItem(boss.x+rng.range(-20,20),boss.y+rng.range(-10,10),_drops[_i]); } }
    boss.invuln=true; boss.timer=null; hud.clearSpell(); yield* waitT(PHASE_HEAL); boss.invuln=false; }
  if(spec.retreat) yield* bossRetreat(boss,spec); else yield* bossDefeat(boss,spec);
}
// Boss WITHDRAWS instead of dying — the stage boss's early "midboss" appearance flees after its
// nonspell+spell are beaten, to return for the full fight. No death explosion, no slowmo. The field
// clears, the ghost flickers and drifts off the top, THEN the HUD bar releases. game.boss stays live
// (and boss.dead false) through the whole fly-off so drawBoss keeps rendering it (drawEnemies skips
// bosses; drawBoss is gated on game.boss && !game.boss.dead). retreatDrops is separate from the phase
// drops the per-phase tail already paid out, so beating it off doesn't double-drop.
function* bossRetreat(boss,spec){ boss.invuln=true; boss.survivalActive=false; sfx.capture&&sfx.capture();
  cancelBullets({all:true,toItems:CANCEL_TO_ITEM}); screenFlash('#ffffff',0.35); Render.flash(0.5,boss.hue);
  for(const d of (spec.retreatDrops||[])) dropItem(boss.x+rng.range(-24,24),boss.y+rng.range(-12,12),d);
  for(let i=0;i<3;i++){ for(let k=0;k<10;k++){ const a=rng()*TAU,s=40+rng()*90; spawnParticle(boss.x,boss.y,Math.cos(a)*s,Math.sin(a)*s,{life:0.55,kind:'sparkle',hue:hueShift(boss.hue,rng.range(-24,24)),r:2.6}); } yield* waitT(0.14); }
  yield* moveTo(boss,boss.x+rng.range(-30,30),-100,1.3,EASE.in);
  if(boss._twin) boss._twin.dead=true;
  hud.clearBoss(); boss.dead=true; yield* waitT(0.4);
}
function* runPhase(boss,ph,pi){
  if(ph.kind==='spell'){ sfx.spell&&sfx.spell(); hud.setSpell(ph.name); banner(ph.name); cutin({ announce:SPELL_ANNOUNCE, hue:ph.cutinHue }); boss.invuln=true; yield* waitT(SPELL_ANNOUNCE); boss.invuln=false; }
  else hud.clearSpell();
  const survival=ph.survival||0;
  // survival phases expose a notional HP pool (GRAZE_SURVIVAL_HP) so the graze power-up's pierce can trim the timer.
  boss.maxHp=boss.hpMax=(survival>0)?(ph.hp!=null?ph.hp:GRAZE_SURVIVAL_HP):(ph.hp||1);
  boss.hp=boss.maxHp;
  const g=Director.beginGroup();
  Director.fork(()=>compileSpell(ph)(boss),boss);
  if(ph.onEnter) ph.onEnter(boss);
  if(survival>0){ // TIMER-driven (not wall-clock) so pierce damage that trims boss.timer actually shortens the phase
    boss.invuln=true; boss.survivalActive=true; boss.survivalTotal=survival; boss.timer=survival; let prev=T;
    const holdOnInvuln=!!ph.holdTimerWhileInvuln;   // anti-ゴリ押し: when set, the survival countdown FREEZES while the player is bomb/respawn-invuln (you can't lives/bombs your way through a survival). prev=now is still advanced every tick so the frozen span is genuinely skipped, not deferred. The graze-powerup pierce drains boss.hp separately → 突破 stays open (graze管理の戦略性). Absent on every other phase → byte-identical there.
    while(boss.timer>0&&boss.hp>0){ yield; const now=T; if(!(holdOnInvuln && player.invuln>0)) boss.timer=Math.max(0,boss.timer-(now-prev)); prev=now; }   // ends on timer expiry OR pierce draining HP to 0

}
// EXTENDED FINALE — runs only on the tokoyo final-boss defeat (the end of the game): a celebratory light-bloom before
// {stageClear} hands off to the ALL CLEAR screen. The dawn BGM (boss6dawn) plays under it; {stageClear} fades it.
function* tokoyoFinale(boss){

  _iwatoLight=1;                                                       // hold the cave at full dawn behind the bloom

    for(let k=0;k<14;k++){ const a=rng()*TAU,s=60+rng()*140; spawnParticle(cx,cy,Math.cos(a)*s,Math.sin(a)*s,{life:0.7+rng()*0.5,kind:'sparkle',hue:44+rng()*18,r:2.4+rng()*2}); }

  // 2) sunrise SWEEPS in — successive shockwave rings of golden light + radiating sparkle motes, gold flashes pulsing like the sun cresting
  for(let w=0;w<5;w++){ spawnParticle(cx,cy,0,0,{life:1.4,kind:'ring',hue:46,r:26});
    const N=22; for(let i=0;i<N;i++){ const a=i/N*TAU+w*0.35, s=130+w*42+rng()*60; spawnParticle(cx,cy,Math.cos(a)*s,Math.sin(a)*s,{life:0.9+rng()*0.5,kind:'sparkle',hue:42+rng()*18,r:2.2+rng()*1.8}); }
    screenFlash('#ffe9b0',0.5); shake(4,0.5); yield* waitT(0.55); }

  // 4) one last bright bloom, then settle into the dawn-lit field before {stageClear} runs the ALL CLEAR handoff
  screenFlash('#fffaf0',0.85); shake(6,0.6); yield* waitT(1.4);
}

function* runStage(stage){
  if(stage.theme) setTheme(stage.theme);
  const diff=(run&&run.difficulty)||'normal';
  const M=stage.music||{}, music=name=>(M[name]!=null?M[name]:name);
  const s5road = stage.id===5 || stage.id===6;   // S5 & S6 roads are timer-paced (no waitClear) so a wave can spawn INSIDE the bomb's residual bossDot window → it gets mown down at the screen edge and reads as "never appeared". Cancel the lingering bomb DoT at each timer-paced ROAD wave switch only — {boss} entries never run this branch, so bomb-vs-boss DoT stays intact. (Stages 1-4 keep stage.id≠5,6 = no-op = golden-unchanged.)
  for(const e of stage.timeline){
    if(e.wave!=null)        { if(s5road) player.bossDot=0; yield* spawnWave(WAVES[e.wave](resolveWave(e.opts||{}, diff))); }
    else if(e.parallel)     { if(s5road) player.bossDot=0; yield* parallel(...e.parallel.map(p=> p.delay ? delayed(p.delay, WAVES[p.wave](resolveWave(p.opts||{}, diff))) : WAVES[p.wave](resolveWave(p.opts||{}, diff)) )); }
    else if(e.boss!=null)   yield* runBoss(resolveBoss(BOSSES[e.boss], diff));
    else if(e.wait!=null)   yield* waitT(e.wait);
    else if(e.waitClear)    yield* waitClear({minHp:e.minHp||0});
    else if(e.music!=null)  Audio.playMusic(music(e.music));
    else if(e.banner!=null) banner(e.banner);
    else if(e.sfx!=null)    { sfx[e.sfx] && sfx[e.sfx](); }
    else if(e.flash)        screenFlash(e.flash.color, e.flash.i);
    else if(e.shake)        shake(e.shake.mag, e.shake.dur);
    else if(e.stageEnd)     { screenFlash('#ffffff',0.8); banner('STAGE CLEAR'); Audio.fadeOutMusic(1.4); yield* waitT(2.8); advanceStage(); return; }   // mid-campaign handoff: advance to the next stage (deferred via run._advanceTo) WITHOUT the terminal all-clear; next stage's music starts in enterStage
    else if(e.stageClear)   { Audio.fadeOutMusic(1.6); screenFlash('#fffaf0',0.5); yield* waitT(2.2); advanceStage(); return; }   // terminal: last stage of the run -> advanceStage()->onStageClear()->STAGECLEAR. The 常夜 defeat already ran the long tokoyoFinale (岩戸開き) + the ALL CLEAR overlay carries the closing text, so NO redundant "STAGE CLEAR" banner here — just gently fade the dawn BGM and settle into the dawn-lit field.
  }
}

// ============================ DEV/TEST HOOK ==========================
// Behaviour-neutral instrumentation, active ONLY with ?dev=1 or ?golden=1 in the URL
// (the IIFE returns immediately otherwise — zero runtime cost in the shipped game).
// Provides a deterministic, headless structural-golden harness used to verify the
// Phase 0–9 refactor preserves behaviour. Not gameplay; strippable from the itch build.
(function(){
  if(typeof location==='undefined' || (!/[?&](dev|golden)=1/.test(location.search) && !(typeof window!=='undefined'&&window.__DEMO))) return;
  function strHash(s){ let h=2166136261>>>0; for(let i=0;i<(''+s).length;i++){ h^=(''+s).charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  // Order-independent structural signature of the live enemy-bullet field: live count, enemy
  // count, and a commutative checksum over (rounded x, rounded y, style, hue-bucket). Independent
  // of Math.random (none touched in headless: no render → no camera shake, no ctx → no detune).
  function sig(){ const it=enemyBullets.items,n=enemyBullets.count; let cs=0; for(let i=0;i<n;i++){ const b=it[i]; if(!b.alive) continue;
      const x=Math.round(b.x)|0, y=Math.round(b.y)|0, hk=Math.round(((b.hue%360)+360)%360)|0;
      const h=(Math.imul(x,73856093)^Math.imul(y,19349663)^Math.imul(strHash(b.style),83492791)^Math.imul(hk|0,40503))>>>0;
      cs=(cs+h)>>>0; }
    return { nb:enemyBullets.count, ne:enemies.length, cs:cs }; }
  function freshState(){ T=0; rng.reseed(DEFAULT_SEED); enemyBullets.clear(); playerShots.clear(); particles.clear(); lasers.clear(); wells.clear(); enemies.length=0; items.length=0; if(typeof Director!=='undefined') Director.clear(); game=makeGame(); player=makePlayer(); }
  window.__dbg = {
    STEP: STEP, sig: sig, peekRng: function(){ return rng(); },
    get T(){ return T; }, get bullets(){ return enemyBullets; }, get enemies(){ return enemies; },
    get game(){ return game; }, get player(){ return player; },
    get specs(){ return { midboss: MIDBOSS_SPEC, finalboss: FINALBOSS_SPEC }; },
    get bosses(){ return BOSSES; }, compileSpell: compileSpell, get wells(){ return wells; }, get Director(){ return Director; },   // (dev-only) reach any boss spec / well pool / scheduler to headlessly capture or live-preview new phases (e.g. Stage-5 vortices) — never read by fpStage/fpEmitters, golden-inert
    get STAGES(){ return STAGES; }, showBossLive: function(spec){ const b=makeBoss(spec); b.invuln=false; b.x=PF_W/2; b.y=PF_H*0.42; game.boss=b; player.invuln=1e9; return b; },
    spawnLinger: function(o){ return spawnLinger(o); }, spawnSeed: function(o){ return spawnSeed(o); }, get iwatoLight(){ return _iwatoLight; }, set iwatoLight(v){ _iwatoLight=v; }, simStep: function(dt){ simStep(dt||STEP); }, get WAVES(){ return WAVES; },   // (dev-only) Stage-6 gimmick + 暗→光 ramp preview + manual deterministic stepping + road-wave preview — golden-inert
    // authoring-harness exports (theme-demo / sfx-demo / balance-demo, generated by design/build-*-demo.js)
    get themes(){ return THEMES; }, setTheme: function(k){ return setTheme(k); }, get balance(){ return BALANCE; },
    sfx: sfx, audio: Audio, resolveWave: resolveWave, resolveBoss: resolveBoss,
    // Deterministic stage opening: no input, player invulnerable (collisions/deaths never perturb
    // the run); all stage waves self-despawn so this reaches the midboss and its emitter.
    goldenStage: function(ticks){ freshState(); startGame(); player.invuln=1e9; const out=[]; for(let i=0;i<ticks;i++){ simStep(STEP); out.push(sig()); } return out; },
    // Deterministic single-emitter capture: run one boss-phase emitter in isolation.
    captureEmitter: function(emitterFn, ticks){ freshState(); game.state=STATE.PLAYING;
      const b=makeBoss({ design:'mandala', hue:300, score:1, enterFrom:{x:PF_W/2,y:140}, enterTo:{x:PF_W/2,y:140}, phases:[{}] });
      b.invuln=false; b.x=PF_W/2; b.y=140; b.survivalActive=false; game.boss=b; player.invuln=1e9;
      const g=Director.beginGroup(); Director.fork(function(){ return emitterFn(b); }, b);
      const out=[]; for(let i=0;i<ticks;i++){ simStep(STEP); out.push(sig()); } Director.endGroup(g); return out; },
    // Spawn a boss in PLAYING state for a visual render check (?dev=1; uses the boss's own design).
    showBoss: function(spec){ freshState(); game.state=STATE.PLAYING; const b=makeBoss(spec); b.invuln=false; b.x=PF_W/2; b.y=140; game.boss=b; player.invuln=1e9; return { design:b.design, r:b.r }; },
    // Compact fingerprint of a signature series (rolling hash + sparse samples) for cross-build A/B.
    fp: function(arr){ let h=0,sum=0; for(let i=0;i<arr.length;i++){ const s=arr[i]; h=(Math.imul(h,31)+s.nb)>>>0; h=(Math.imul(h,31)+s.cs)>>>0; h=(Math.imul(h,31)+s.ne)>>>0; sum+=s.nb; } const samp=[]; for(let i=0;i<arr.length;i+=Math.max(1,(arr.length/16)|0)) samp.push([i,arr[i].nb,arr[i].ne,arr[i].cs]); return { len:arr.length, h:h>>>0, sum:sum, last:arr[arr.length-1], samp:samp }; },
    fpStage: function(ticks){ return this.fp(this.goldenStage(ticks)); },
    fpEmitters: function(ticks){ const sp=this.specs, out={}; for(const k in sp){ out[k]=sp[k].phases.map(function(ph,i){ const em=compileSpell(ph); return em? Object.assign({phase:i}, window.__dbg.fp(window.__dbg.captureEmitter(em,ticks))) : null; }); } return out; }
  };
})();

// ============================ BOOT ===================================
(function boot(){
  const cv=document.getElementById('game');
  Render.init(cv);
  initGameSystems();
  attachInput(window);
  attachTouch(cv);
  setState(STATE.TITLE);
  // debug entry points (inert under ?golden — the headless harness owns the clock below). Two flavours:
  //  ?practice=<stage>.<枠>[.<phase>] → SPELL PRACTICE: jump into any boss at any 1-indexed phase and loop
  //        it forever for last-word tuning. <stage>=1-6, <枠>=1 (midboss) | 2 (final boss), <phase>=1-indexed
  //        (default 1). e.g. ?practice=6.2.8 = Stage-6 final boss P8 ; ?practice=5.1 = Stage-5 midboss.
  //  ?stage=N (1-indexed) [+ ?diff=] → start the whole campaign mid-way at that stage, full power.
  // Both honour ?diff=easy|normal|hard|lunatic (default normal). practice takes precedence over stage.
  if(typeof location!=='undefined' && !/[?&]golden=1/.test(location.search)){
    const dm=location.search.match(/[?&]diff=(easy|normal|hard|lunatic)/), d=dm?dm[1]:'normal';
    const pm=location.search.match(/[?&]practice=(\d+)(?:[.:](\d+))?(?:[.:](\d+))?/);
    if(pm){ const bk=bossKeyAt(parseInt(pm[1],10), pm[2]?parseInt(pm[2],10):2);
      if(bk) startPractice(bk, pm[3]?parseInt(pm[3],10):1, d);
      else console.warn('practice: no boss at stage '+pm[1]+' 枠 '+(pm[2]||2)+' (stage 1-6, 枠 1=midboss 2=final)'); }
    else { const sm=location.search.match(/[?&]stage=(\d+)/);
      if(sm){ const n=(parseInt(sm[1],10)||1)-1;
        if(n>=0 && n<STAGES.length){ startRun(d,n); addPower(MAXPOWER); } } }   // debug mid-campaign start → begin at full power (skip the natural stage-1 power ramp you'd otherwise have built up)
  }
  // ?golden=1 freezes the rAF loop so the headless structural-golden harness owns the sim clock
  // (no background petal-wrap rng consumption / state churn). Normal & ?dev=1 boots are unaffected.
  if(typeof location==='undefined' || !/[?&]golden=1/.test(location.search)) requestAnimationFrame(frame);
})();
