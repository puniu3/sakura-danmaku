"use strict";
// =====================================================================
//  桜花弾幕 — SAKURA DANMAKU   (single-file Touhou-style bullet hell)
//  Canvas2D + Web Audio. Fixed-timestep sim, pooled bullets, boss spells.
//  Assembled from 6 reconciled subsystem designs.
// =====================================================================

// ============================ CONSTANTS ==============================
const PF_W = 432, PF_H = 576, HUD_W = 208;
const CANVAS_W = PF_W + HUD_W, CANVAS_H = PF_H;
const PF_X = 0, PF_Y = 0;
const DPR_CAP = 2;

const STEP = 1/120, MAX_FRAME_DT = 0.25, MAX_STEPS = 8;
const DEFAULT_SEED = 0x9e3779b9 >>> 0;
const FPS_SMOOTH = 0.92;

const ENEMYBULLET_CAP = 8192, PLAYERSHOT_CAP = 1024, PARTICLE_CAP = 4096;
const BULLET_DESPAWN_MARGIN = 32;

const PLAYER_R = 2.4, GRAZE_R = 14;
const PLAYER_SPEED = 200, PLAYER_FOCUS_MUL = 0.45, PLAYER_FAST_MUL = 1.6, PLAYER_MARGIN = 10;
const PLAYER_START = { x: 216, y: 496 };
const FIRE_CADENCE = 0.055, SHOT_SPEED = 720, SHOT_DMG = 2, OPTION_DMG = 1.4, MUZZLE_PARTICLES = 2;

// ---- graze power-up (temporary super-shot earned at graze milestones) ----
// First fires at 20 cumulative graze; the gap then grows +20 each time (20,40,60,…), so the
// cumulative thresholds are 20,60,120,200,… Lasts GRAZE_POWER_DURATION or until a hit pops it
// (a hit ends the state instead of killing — no miss). Shot ignores power level entirely.
const GRAZE_POWER_FIRST = 20, GRAZE_POWER_STEP = 20;        // first threshold; per-activation interval growth
const GRAZE_POWER_DURATION = 8.0;                           // active seconds (refreshed if it re-triggers while active)
const GRAZE_HIT_PENALTY = 1.0;                              // a hit during power-up subtracts this many seconds of remaining time (no release, no i-frames)
const GRAZE_HUE = 140;                                      // signature colour for all power-up visuals (verdant)
// non-focus: giant homing bullets (pooled playerShots with a steering update)
const GRAZE_HOMING_CADENCE = 0.075, GRAZE_HOMING_COUNT = 2, GRAZE_HOMING_SPEED = 460;
const GRAZE_HOMING_R = 13, GRAZE_HOMING_DMG = 15, GRAZE_HOMING_TURN = 7.5, GRAZE_HOMING_SPREAD = 1.1, GRAZE_HOMING_LIFE = 2.2;
// focus: thick piercing laser — a per-tick column-damage pass (no pooled shots), drawn as a solid beam
const GRAZE_LASER_HALFW = 30, GRAZE_LASER_DPS = 620;  // HALFW drives both the beam render and the damage column
// notional HP an endurance (耐久/survival) spell exposes to the power-up: pierce damage trims the remaining
// survival timer by survivalTotal*(dmg/maxHp). Sized so a full 8s laser focus removes most of a 28s timer.
const GRAZE_SURVIVAL_HP = 6000;
const GRAZE_PIERCE = { pierce:true };                      // shared opts passed to damageEnemy by power-up shots
const GRAZE_LASER_NOSE = 18;                               // laser emerges this far ahead of the player centre (a little past the nose)
const GRAZE_ACTIVATE_CLEAR_R = 100;                        // radius of enemy-bullet clear when the power-up activates

// ---- gamepad (standard mapping) ----
const PAD_DEADZONE=0.20, PAD_AXIS_LX=0, PAD_AXIS_LY=1;
const PAD_BTN_A=0, PAD_BTN_B=1, PAD_BTN_X=2, PAD_BTN_LB=4, PAD_BTN_RB=5, PAD_BTN_LT=6, PAD_BTN_RT=7;
const PAD_BTN_SELECT=8, PAD_BTN_START=9, PAD_BTN_DUP=12, PAD_BTN_DDOWN=13, PAD_BTN_DLEFT=14, PAD_BTN_DRIGHT=15;
// ---- touch ----  (relative drag to move; sticky SHOT/FOCUS toggles; BOMB/PAUSE momentary)
const TOUCH_DRAG_SENS=1.0, TOUCH_DRAG_SENS_FOCUS=0.55;
// on-screen button rects in logical coords; all live in the HUD strip (x>=PF_W) so they never
// overlap the playfield drag-zone (x<PF_W). Gameplay cluster sits in the lower-mid HUD (thumb zone);
// PAUSE is a *system* action so it is set apart (small, muted, top of the free band) to avoid
// accidental taps and read as a different kind of control.
const TOUCH_BTN={
  shoot:{x:452,y:320,w:80,h:60,label:'SHOT'},
  focus:{x:540,y:320,w:80,h:60,label:'FOCUS'},
  bomb: {x:452,y:392,w:168,h:60,label:'BOMB'},
  pause:{x:582,y:258,w:40,h:32,label:'II'},
};
const START_POWER = 100;

const MAXPOWER = 400, POWER_BREAKS = [0,40,80,150,200,300,400];
const POWER_PER_ITEM = 8, POWER_PER_BIG = 40;

const START_BOMBS = 2, MAX_BOMBS = 6;   // cap matches MAX_LIVES (6-slot HUD). 'bomb' items drop on each stage's midboss defeat (Stage 1 Ariel / Stage 2 Tasokare-intro); collectItem caps at MAX_BOMBS.
const BOMB_INVULN = 2.5, BOMB_BOSS_DPS = 140, BOMB_DOT_TIME = 2.2, BOMB_FLASH = 0.6;
const DEATHBOMB_TIME = 9/120;
const START_LIVES = 3, MAX_LIVES = 6;
const RESPAWN_INVULN = 3.0, RESPAWN_BLINK = 0.09, DEATH_CLEAR_R = 72, DEATH_POWER_DROP = 8;

const GRAZE_SCORE = 50;
const EXTEND_INTERVAL = 1e6;   // score-extend fires every fixed 1M (was a [1M,3M,6M,10M] table); HUD shows a fill meter toward the next
const EXTEND_ITEM_FALL = 70;   // score-extend drops a 1UP from the top, straight above the player, to be collected
const POINT_BASE = 10000, POINT_MIN = 2000;   // point-item value anchors (collect high = POINT_BASE, low = POINT_MIN). spell-capture bonus 廃止 2026-06-04 (no one missed it)
// score multiplier (player state): each point-item pickup +GAIN (internal cap CAP), decays DECAY/s; applied & displayed capped at MAX_APPLY.
// Internal headroom (CAP > MAX_APPLY) keeps a hot chain pinned at the cap so the readout doesn't flicker 1.9<->2.0 each pickup/decay.
const SCORE_MUL_MAX_APPLY = 2.0, SCORE_MUL_CAP = 2.1, SCORE_MUL_GAIN = 0.1, SCORE_MUL_DECAY = 0.2;
const ITEM_GRAV = 120, ITEM_TERMINAL = 130, ITEM_R = 11, ITEM_COLLECT_R = 30;
// grace below the visible bottom (PF_H) an item stays alive-but-clipped before it actually despawns.
// at terminal velocity (130px/s) 100px ≈ 0.77s — enough to dart up to the POC line and auto-collect
// an item that just slipped off the bottom (was 40px ≈ 0.3s, which gave no realistic reaction window).
const ITEM_DESPAWN_GRACE = 100;
// magnet: speed ramps at full ACC toward MAXSPD; heading slews loosely at TURN (rad/s);
// PULL is the min closing-speed fraction (radial floor) that guarantees the radius shrinks → no orbit.
const ITEM_MAGNET_ACC = 2400, ITEM_MAGNET_MAXSPD = 1100, ITEM_MAGNET_TURN = 9, ITEM_MAGNET_PULL = 0.45;
const POC_LINE_Y = 140;
const ITEM_HUE = { power:15, point:205, bigpower:15, oneup:340, full:280, bomb:165 };  // bomb = teal (was 200≈point's 205 → indistinguishable); 165 reads clearly apart from point's blue. Diverges from HUD bomb cyan by design (item identity prioritised over HUD-match).

const STATE = { TITLE:0, PLAYING:1, PAUSED:2, GAMEOVER:3, STAGECLEAR:4,
  // reserved for the multi-stage campaign flow (screens wired when stages 2-6 land; unused at 1 stage).
  DIFFICULTY_SELECT:5, STAGE_INTERMISSION:6, CONTINUE:7, RESULTS:8, NAME_ENTRY:9 };
// The "Falling Petals" lament resolves on its final A4 (onset ~10.5s of content); auto-return is
// pulled in to 11.6s so we leave just before the 12.0s loop seam (never re-attacking A5), and the
// last GAMEOVER_FADE seconds gently fade the tail to silence so the exit lands on a clean break.
const GAMEOVER_AUTORET = 11.6, GAMEOVER_FADE = 0.7;
const GAME_KEYS = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight','KeyZ','KeyX','Escape','KeyP','Enter','KeyM']);

const TAU = Math.PI*2, HALFPI = Math.PI/2, DEG = Math.PI/180;
const DEFAULT_R = 4.5;

// ============================ ENGINE CORE ============================
// ---- math helpers ----
function clamp(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }
function approach(cur,tgt,maxDelta){ const d=tgt-cur; if(d>maxDelta) return cur+maxDelta; if(d<-maxDelta) return cur-maxDelta; return tgt; }
function hypot(dx,dy){ return Math.sqrt(dx*dx+dy*dy); }
function dist2(ax,ay,bx,by){ const dx=ax-bx,dy=ay-by; return dx*dx+dy*dy; }
function swapRemove(arr,i){ const last=arr.length-1; if(i!==last) arr[i]=arr[last]; arr.pop(); }
function polarVel(a,speed){ return { vx:Math.cos(a)*speed, vy:Math.sin(a)*speed }; }

// ---- seeded RNG (mulberry32) ----
function makeRng(seed){
  let s=(seed>>>0)||1;
  const rng=function(){ s|=0; s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
  rng.range=(a,b)=>a+(b-a)*rng();
  rng.int=(n)=>(rng()*n)|0;
  rng.pick=(arr)=>arr[(rng()*arr.length)|0];
  rng.sign=()=>(rng()<0.5?-1:1);
  rng.bool=(p=0.5)=>rng()<p;
  rng.angle=()=>rng()*TAU;
  rng.reseed=(n)=>{ s=(n>>>0)||1; };
  return rng;
}
const rng = makeRng(DEFAULT_SEED);

// ---- generic pool (dense live prefix) ----
function makePool(factory,n){
  const items=new Array(n);
  for(let i=0;i<n;i++){ const o=factory(); o.alive=false; items[i]=o; }
  const pool={
    items, count:0, cap:n, factory,
    acquire(){ if(this.count>=this.items.length) this._grow(); const o=this.items[this.count++]; o.alive=true; return o; },
    release(o){ o.alive=false; },
    compact(){ const it=this.items; let n2=this.count,i=0; while(i<n2){ if(it[i].alive){ i++; } else { n2--; if(i!==n2){ const tmp=it[i]; it[i]=it[n2]; it[n2]=tmp; } } } this.count=n2; },
    forEachLive(fn){ const it=this.items; for(let i=0;i<this.count;i++) fn(it[i],i); },
    clear(){ for(let i=0;i<this.count;i++) this.items[i].alive=false; this.count=0; },
    shrink(toCap){ toCap=Math.max(toCap|0,this.count); if(this.items.length>toCap) this.items.length=toCap; this.cap=this.items.length; },   // release backing capacity down to toCap (never below live count); for STAGE_INTERMISSION
    _grow(){ const add=Math.max(64,this.items.length>>1); for(let k=0;k<add;k++){ const o=this.factory(); o.alive=false; this.items.push(o); } this.cap=this.items.length; },
  };
  return pool;
}

function newBullet(){ return { x:0,y:0,vx:0,vy:0,ax:0,ay:0, r:DEFAULT_R, style:'orb', hue:0, alive:false, born:0,
  speed:0,dir:0,accel:0,av:0, grazed:false, fade:1, update:null, custom:false,
  delay:0,turn:0,turnAbs:false,speed2:null,bounces:0,fired:false,phase:0, _spr:null }; }
function newShot(){ return { x:0,y:0,vx:0,vy:0,ax:0,ay:0, r:4, kind:'needle', style:'main', hue:330, alive:false, born:0, dmg:1, pierce:0, update:null, life:0, pierceSpell:false }; }
function newParticle(){ return { x:0,y:0,vx:0,vy:0,ax:0,ay:0, r:2, kind:'spark', hue:0, alive:false, born:0, age:0, life:0.5, rot:0, av:0, update:null }; }

const enemyBullets = makePool(newBullet, ENEMYBULLET_CAP);
const playerShots  = makePool(newShot, PLAYERSHOT_CAP);
const particles    = makePool(newParticle, PARTICLE_CAP);
const enemies = [];
const items = [];

// ---- canonical spawners ----
function spawnBullet(o){
  const b=enemyBullets.acquire(); if(!b) return null;
  b.x=o.x; b.y=o.y; b.vx=o.vx||0; b.vy=o.vy||0; b.ax=o.ax||0; b.ay=o.ay||0;
  b.r=(o.r!=null)?o.r:DEFAULT_R; b.style=o.style||'orb'; b.hue=(o.hue!=null)?o.hue:0;
  b.alive=true; b.born=T; b.grazed=false; b.fade=1;
  b.speed=(o.speed!=null)?o.speed:Math.hypot(b.vx,b.vy);
  b.dir=(o.dir!=null)?o.dir:Math.atan2(b.vy,b.vx);
  b.av=o.av||0; b.accel=o.accel||0;
  b.update=o.update||null; b.custom=!!o.custom;
  b.delay=o.delay||0; b.bounces=o.bounces||0; b.turn=o.turn||0; b.turnAbs=!!o.turnAbs;
  b.speed2=(o.speed2!=null)?o.speed2:null; b.fired=false; b.phase=o.phase||0;
  b._spr=getBulletSprite(b.style,b.hue);
  return b;
}
function spawnPolar(o,a,speed,extra){ const v=polarVel(a,speed); const opts=extra?Object.assign({},extra):{}; opts.x=o.x; opts.y=o.y; opts.vx=v.vx; opts.vy=v.vy; opts.dir=a; opts.speed=speed; return spawnBullet(opts); }
function spawnParticle(x,y,vx,vy,opts){
  const p=particles.acquire(); if(!p) return null;
  p.x=x; p.y=y; p.vx=vx; p.vy=vy; p.ax=(opts&&opts.ax)||0; p.ay=(opts&&opts.ay)||0;
  p.age=0; p.life=(opts&&opts.life)||0.4; p.kind=(opts&&opts.kind)||'spark';
  p.hue=(opts&&opts.hue!=null)?opts.hue:0; p.r=(opts&&opts.r!=null)?opts.r:2.5;
  p.rot=(opts&&opts.rot)||0; p.av=(opts&&opts.av)||0; p.alive=true; p.born=T;
  return p;
}

// ---- integration ----
function integrateBullets(dt){
  const it=enemyBullets.items, n=enemyBullets.count;
  const minX=-BULLET_DESPAWN_MARGIN, maxX=PF_W+BULLET_DESPAWN_MARGIN, minY=-BULLET_DESPAWN_MARGIN, maxY=PF_H+BULLET_DESPAWN_MARGIN;
  for(let i=0;i<n;i++){ const b=it[i];
    if(b.update){ b.update(b,dt); }
    else if(b.av!==0){ b.dir+=b.av*dt; b.speed+=b.accel*dt; b.vx=Math.cos(b.dir)*b.speed; b.vy=Math.sin(b.dir)*b.speed; b.x+=b.vx*dt; b.y+=b.vy*dt; }
    else { b.vx+=b.ax*dt; b.vy+=b.ay*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; }
    if(b.x<minX||b.x>maxX||b.y<minY||b.y>maxY) b.alive=false;
  }
}
function integrateShots(dt){
  const it=playerShots.items, n=playerShots.count;
  for(let i=0;i<n;i++){ const s=it[i];
    if(s.update){ s.update(s,dt); } else { s.x+=s.vx*dt; s.y+=s.vy*dt; }
    if(s.life>0 && T-s.born>=s.life){ s.alive=false; continue; }
    if(s.y<-BULLET_DESPAWN_MARGIN||s.x<-BULLET_DESPAWN_MARGIN||s.x>PF_W+BULLET_DESPAWN_MARGIN) s.alive=false; }
}
function integrateParticles(dt){
  const it=particles.items, n=particles.count;
  for(let i=0;i<n;i++){ const p=it[i];
    if(p.update){ p.update(p,dt); } else { p.vx+=p.ax*dt; p.vy+=p.ay*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.av*dt; }
    p.age+=dt; if(p.age>=p.life) p.alive=false; }
}

// ---- collision ----
function collidePlayerBullets(){
  if(!player||player.dead||player.invuln>0) return;
  const px=player.x, py=player.y, it=enemyBullets.items, n=enemyBullets.count;
  for(let i=0;i<n;i++){ const b=it[i]; const dx=b.x-px,dy=b.y-py,d2=dx*dx+dy*dy;
    const hr=b.r+PLAYER_R; if(d2<=hr*hr){ onPlayerHit(b,null); return; }
    if(!b.grazed){ const gr=b.r+GRAZE_R; if(d2<=gr*gr){ b.grazed=true; onGraze(b); } } }
}
function collideShotsEnemies(){
  const sh=playerShots.items, sn=playerShots.count;
  for(let ei=0;ei<enemies.length;ei++){ const e=enemies[ei]; if(e.dead) continue;
    const owner=e._shareHpWith||e;                       // twin-boss bodies share one HP/invuln pool → state checks read the owner (geometry & the hit spark stay on the actual body e)
    const pierceable=owner.boss&&owner.survivalActive;   // endurance spell: only pierce-shots may connect
    if(owner.invuln&&!pierceable) continue;
    const ex=e.x,ey=e.y,er=e.r;
    for(let i=0;i<sn;i++){ const s=sh[i]; if(!s.alive) continue; if(owner.invuln&&!s.pierceSpell) continue; const rr=er+s.r;
      if(dist2(s.x,s.y,ex,ey)<=rr*rr){ onEnemyHit(e,s); if(s.pierce>0) s.pierce--; else s.alive=false; if(owner.dead) break; } } }
}
function collidePlayerEnemies(){
  if(!player||player.dead||player.invuln>0) return;
  const px=player.x,py=player.y;
  for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(e.dead||!e.bodyDamage) continue;
    const rr=PLAYER_R+e.r*0.6; if(dist2(px,py,e.x,e.y)<=rr*rr){ onPlayerHit(null,e); return; } }
}

// ---- FPS + main loop ----
const fps = { frame:60 };
let T = 0, renderAlpha = 0, _acc = 0, _lastMs = 0;

function simStep(dt){
  T += dt;
  updateGameSystems(dt);
  if(game.state===STATE.PLAYING){
    tickStage(dt);
    if(run && run._advanceTo!=null){ const ns=run._advanceTo; run._advanceTo=null; enterStage(ns); }   // deferred stage handoff — safe here (Director.update's coro loop has finished); the rest of this tick runs on the freshly-reset (empty) stage state
    for(let i=enemies.length-1;i>=0;i--){ const e=enemies[i]; if(e.dead){ swapRemove(enemies,i); } else { enemyIntegrate(e,dt); } }
    integrateBullets(dt);
    integrateShots(dt);
    collideShotsEnemies();
    collidePlayerBullets();
    collidePlayerEnemies();
  }
  integrateParticles(dt);
  enemyBullets.compact(); playerShots.compact(); particles.compact();
}

function frame(nowMs){
  requestAnimationFrame(frame);
  if(_lastMs===0) _lastMs=nowMs;
  let dt=(nowMs-_lastMs)/1000; _lastMs=nowMs;
  if(dt>MAX_FRAME_DT) dt=MAX_FRAME_DT;
  if(dt>0) fps.frame=fps.frame*FPS_SMOOTH+(1/dt)*(1-FPS_SMOOTH);
  pollGamepad();     // feed gamepad → rawKeys/edgeKeys/ext BEFORE edges are promoted (no 1-frame lag)
  handleInput(STEP); // promote input edges once per frame (runs even while paused)
  if((game.state===STATE.PLAYING||game.state===STATE.PAUSED) && keyEdge('Escape')) togglePause();
  ext.dragConsumed=false;
  if(!game.paused){
    _acc += dt*(Render.timeScale||1);
    let steps=0;
    while(_acc>=STEP && steps<MAX_STEPS){ simStep(STEP); _acc-=STEP; steps++; }
    if(steps>=MAX_STEPS) _acc=0;
    renderAlpha=_acc/STEP;
  }
  if(ext.dragConsumed){ ext.dragDX=0; ext.dragDY=0; } // drag applied this frame; carry-forward on 0-substep frames (120Hz)
  for(const k in stepEdge) stepEdge[k]=false; // edges are per-frame; clear leftovers
  Render.frame(nowMs, game.paused?1:renderAlpha);
}

// ============================ AUDIO ==================================
const Audio = (function(){
  let muted=(()=>{ try{ return localStorage.getItem('bh.muted')==='1'; }catch(e){ return false; } })();
  let masterVol=(()=>{ try{ const v=parseFloat(localStorage.getItem('bh.vol')); return isFinite(v)?Math.min(1,Math.max(0,v)):1; }catch(e){ return 1; } })();
  let ctx=null, masterGain=null, limiter=null, musicGain=null, sfxGain=null, noiseBuf=null;
  let curTrack='none', pumpTimer=0, nextNoteTime=0, stepIndex=0, lastShoot=0;
  const MASTER_BASE_GAIN=0.42, SCHEDULE_AHEAD=0.10, PUMP_MS=25, MUSIC_FADE=0.18, SHOOT_MIN_GAP=0.045;
  function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
  function now(){ return ctx?ctx.currentTime:0; }
  function rnd(a,b){ return a+Math.random()*(b-a); }

// ===================== bgm-engine.js =====================
// High-quality procedural BGM engine for the danmaku game.
// Drop-in replacement for the simple 2-bar-loop tracks. Designed to be INLINED
// into both bgm-demo.html (audition harness) and index.html (live game).
//
// Assumes these already exist in the host scope (they do in index.html's Audio module):
//   ctx, musicGain, mtof(midi)->Hz, tone(opts), noise(opts), now()
// where tone/noise schedule one-shot self-cleaning voices on opts.dest at opts.t0.
//
// ---- DATA MODEL ----------------------------------------------------------
// A track is authored as SECTIONS (intro/A/B/bridge/...) plus an ARRANGEMENT
// (the order the sections play; it loops at the end). At first use the track is
// COMPILED: sections are concatenated in arrangement order into long per-lane
// arrays, note gate-lengths are precomputed (legato), pad chords get hold-lengths,
// and a flat drum map is built. The scheduler then just walks `step % totalSteps`.
//
// Lanes (each is an array of absolute MIDI numbers; 0 = rest):
//   lead    main melody (THE hook) — layered/detuned for body
//   harm    secondary harmony voice (3rd/6th under lead, softer)
//   counter counter-melody that answers in the lead's rests
//   arp     fast plucky arpeggio of the chord
//   bass    main bassline
//   sub     sine sub-octave on accents (optional)
//   chords  pad: non-null entry = chord (MIDI array) struck & held until next chord
//   kick/snare/hat/crash  drums. hat: 0 none, 1 closed, 2 open. crash: 0/1.
// Any lane may be omitted from a section (treated as all-rests of correct length).
// 1 bar = 16 sixteenth steps, 4/4.

// ---- per-lane default voice timbres (a track overrides via track.voices) ----
const DEFAULT_VOICES = {
  lead: {
    maxGate: 6,
    layers: [
      { type: 'triangle', octave: 0, detune: 0, gain: 1.00 },
      { type: 'triangle', octave: 0, detune: 7, gain: 0.45 },
      { type: 'sawtooth', octave: -1, detune: 0, gain: 0.30, filter: 'lowpass', filterFreq: 1900 },
    ],
    atk: 0.006, dec: 0.06, sus: 0.55, rel: 0.14,
  },
  harm: {
    maxGate: 6,
    layers: [{ type: 'triangle', octave: 0, detune: -5, gain: 1.0 }],
    atk: 0.008, dec: 0.06, sus: 0.5, rel: 0.16, filter: 'lowpass', filterFreq: 2400,
  },
  counter: {
    maxGate: 5,
    layers: [{ type: 'square', octave: 0, detune: 0, gain: 1.0, filter: 'lowpass', filterFreq: 2200 }],
    atk: 0.006, dec: 0.05, sus: 0.4, rel: 0.12,
  },
  arp: {
    maxGate: 1,
    layers: [{ type: 'triangle', octave: 0, detune: 0, gain: 1.0 }],
    atk: 0.002, dec: 0.03, sus: 0.18, rel: 0.06, filter: 'lowpass', filterFreq: 2800,
  },
  bass: {
    maxGate: 4,
    layers: [{ type: 'sawtooth', octave: 0, detune: 0, gain: 1.0 }],
    atk: 0.005, dec: 0.06, sus: 0.6, rel: 0.09, filter: 'lowpass', filterFreq: 720,
  },
  sub: {
    maxGate: 8,
    layers: [{ type: 'sine', octave: 0, detune: 0, gain: 1.0 }],
    atk: 0.006, dec: 0.08, sus: 0.7, rel: 0.12,
  },
  pad: {
    octave: 1, voices: 2, detune: 9, type: 'sawtooth',
    atk: 0.09, dec: 0.14, sus: 0.7, rel: 0.4, filter: 'lowpass', filterFreq: 1700,
  },
  drums: {
    kick:  { f0: 150, f1: 47, peak: 0.30, atk: 0.002, dec: 0.07, rel: 0.12, dur: 0.20, click: true },
    snare: { tone1: 190, tone2: 250, hp: 1500, peak: 0.20, rel: 0.13, dur: 0.15 },
    hatC:  { hp: 9000, peak: 0.055, rel: 0.028, dur: 0.032 },
    hatO:  { hp: 8000, peak: 0.05, rel: 0.13, dur: 0.16 },
    crash: { hp: 5500, peak: 0.12, rel: 0.5, dur: 0.6 },
  },

const DEFAULT_GAINS = {
  lead: 0.135, harm: 0.07, counter: 0.085, arp: 0.06, bass: 0.16, sub: 0.13, pad: 0.05,
  kick: 1, snare: 1, hat: 1, crash: 1, // drum gains baked into voice peaks; these scale them
};

// deep-ish merge of a track's partial voices over the defaults
function mergeVoices(over) {
  over = over || {};
  const out = {};
  for (const k in DEFAULT_VOICES) {
    const d = DEFAULT_VOICES[k], o = over[k];
    if (!o) { out[k] = d; continue; }
    if (k === 'drums') {
      out.drums = {};
      for (const dk in d) out.drums[dk] = Object.assign({}, d[dk], o[dk] || {});
    } else {
      out[k] = Object.assign({}, d, o);
      if (o.layers) out[k].layers = o.layers; // replace layers wholesale if given
    }
  }
  return out;
}

// ---- COMPILE -------------------------------------------------------------
// Concatenate sections (per arrangement) into flat lanes; precompute gates.
const MELODIC_LANES = ['lead', 'harm', 'counter', 'arp', 'bass', 'sub'];

function laneFromSections(track, lane) {
  const out = [];
  for (const secName of track.arrangement) {
    const sec = track.sections[secName];
    const len = sec.bars * 16;
    const a = sec[lane];
    for (let i = 0; i < len; i++) out.push((a && a[i]) ? a[i] : 0);
  }
  return out;
}

function drumFromSections(track, lane) {
  const out = [];
  for (const secName of track.arrangement) {
    const sec = track.sections[secName];
    const len = sec.bars * 16;
    const a = sec[lane];
    for (let i = 0; i < len; i++) out.push((a && a[i]) ? a[i] : 0);
  }
  return out;
}

// for each onset (note!=0) compute how many steps it sounds: to next onset, capped.
function computeGates(notes, maxGate) {
  const n = notes.length, gate = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    if (!notes[i]) continue;
    let d = 1;
    while (d < n && !notes[(i + d) % n]) d++;
    gate[i] = Math.min(d, maxGate);
  }
  return gate;
}

function compile(track) {
  if (track._compiled) return track._compiled;
  const voices = mergeVoices(track.voices);
  const gains = Object.assign({}, DEFAULT_GAINS, track.gains || {});
  const step16 = 60 / track.bpm / 4;

  const lanes = {};
  for (const ln of MELODIC_LANES) {
    const notes = laneFromSections(track, ln);
    lanes[ln] = { notes, gate: computeGates(notes, voices[ln].maxGate) };
  }
  const totalSteps = lanes.lead.notes.length;

  // pad chords: flatten, then hold each chord until the next non-null chord
  const padFlat = new Array(totalSteps).fill(null);
  {
    let w = 0;
    for (const secName of track.arrangement) {
      const sec = track.sections[secName];
      const len = sec.bars * 16;
      const c = sec.chords;
      for (let i = 0; i < len; i++) { padFlat[w++] = (c && c[i]) ? c[i] : null; }
    }
  }
  const pad = new Array(totalSteps).fill(null);
  for (let i = 0; i < totalSteps; i++) {
    if (!padFlat[i]) continue;
    let d = 1;
    while (d < totalSteps && !padFlat[(i + d) % totalSteps]) d++;
    pad[i] = { notes: padFlat[i], hold: d };
  }

  const drums = {
    kick: drumFromSections(track, 'kick'),
    snare: drumFromSections(track, 'snare'),
    hat: drumFromSections(track, 'hat'),
    crash: drumFromSections(track, 'crash'),
  };

  track._compiled = { totalSteps, step16, lanes, pad, drums, voices, gains };
  return track._compiled;
}

// ---- SYNTH ---------------------------------------------------------------
function playLaneNote(dst, when, midi, vcfg, gain, gateSteps, step16) {
  const dur = Math.max(0.05, gateSteps * step16 * 0.92);
  const layers = vcfg.layers || [{ type: vcfg.type || 'triangle', octave: 0, detune: 0, gain: 1 }];
  for (let i = 0; i < layers.length; i++) {
    const l = layers[i];
    tone({
      dest: dst, t0: when, type: l.type || vcfg.type || 'triangle',
      f0: mtof(midi + 12 * (l.octave || 0)), detune: l.detune || 0,
      peak: Math.max(0.0008, gain * (l.gain != null ? l.gain : 1)),
      atk: vcfg.atk, dec: vcfg.dec, sus: vcfg.sus, rel: vcfg.rel, dur: dur,
      filter: l.filter || vcfg.filter, filterFreq: l.filterFreq || vcfg.filterFreq,
      filterFreq1: l.filterFreq1 != null ? l.filterFreq1 : vcfg.filterFreq1,
    });
  }
}

function playPad(dst, when, chord, holdSteps, vcfg, gain, step16) {
  const dur = Math.max(0.2, holdSteps * step16 * 0.96);
  const nVoices = vcfg.voices || 1;
  for (let c = 0; c < chord.length; c++) {
    const base = chord[c] + 12 * (vcfg.octave || 0);
    for (let v = 0; v < nVoices; v++) {
      const det = nVoices > 1 ? (vcfg.detune || 9) * (v - (nVoices - 1) / 2) : 0;
      tone({
        dest: dst, t0: when, type: vcfg.type || 'sawtooth',
        f0: mtof(base), detune: det,
        peak: Math.max(0.0008, gain / Math.sqrt(chord.length * nVoices)),
        atk: vcfg.atk, dec: vcfg.dec, sus: vcfg.sus, rel: vcfg.rel, dur: dur,
        filter: vcfg.filter, filterFreq: vcfg.filterFreq, filterFreq1: vcfg.filterFreq1,
      });
    }
  }
}

function playKick(dst, when, d, g) {
  tone({ dest: dst, t0: when, type: 'sine', f0: d.f0, f1: d.f1, glideExp: true,
    peak: d.peak * g, atk: d.atk, dec: d.dec, sus: 0.3, rel: d.rel, dur: d.dur });
  if (d.click) noise({ dest: dst, t0: when, filter: 'bandpass', filterFreq: 2200, q: 0.8,
    peak: d.peak * 0.35 * g, atk: 0.0005, rel: 0.02, dur: 0.025 });
}
function playSnare(dst, when, d, g) {
  noise({ dest: dst, t0: when, filter: 'highpass', filterFreq: d.hp,
    peak: d.peak * g, atk: 0.001, rel: d.rel, dur: d.dur });
  tone({ dest: dst, t0: when, type: 'triangle', f0: d.tone1, peak: d.peak * 0.5 * g,
    atk: 0.001, dec: 0.02, sus: 0.2, rel: 0.06, dur: 0.07 });
  tone({ dest: dst, t0: when, type: 'triangle', f0: d.tone2, peak: d.peak * 0.35 * g,
    atk: 0.001, dec: 0.02, sus: 0.2, rel: 0.05, dur: 0.06 });
}
function playHat(dst, when, open, d, g) {
  const cfg = open ? d.hatO : d.hatC;
  noise({ dest: dst, t0: when, filter: 'highpass', filterFreq: cfg.hp,
    peak: cfg.peak * g, atk: 0.001, rel: cfg.rel, dur: cfg.dur });
}
function playCrash(dst, when, d, g) {
  noise({ dest: dst, t0: when, filter: 'highpass', filterFreq: d.crash.hp,
    peak: d.crash.peak * g, atk: 0.002, rel: d.crash.rel, dur: d.crash.dur });
}

// schedule one 16th step `s` of compiled track `C` at ctx time `when`
function scheduleTrackStep(C, dst, s, when) {
  // melodic lanes
  for (let li = 0; li < MELODIC_LANES.length; li++) {
    const ln = MELODIC_LANES[li];
    const L = C.lanes[ln];
    const note = L.notes[s];
    if (note) playLaneNote(dst, when, note, C.voices[ln], C.gains[ln], L.gate[s], C.step16);
  }
  // pad
  const p = C.pad[s];
  if (p) playPad(dst, when, p.notes, p.hold, C.voices.pad, C.gains.pad, C.step16);
  // drums
  const dv = C.voices.drums;
  if (C.drums.kick[s]) playKick(dst, when, dv.kick, C.gains.kick);
  if (C.drums.snare[s]) playSnare(dst, when, dv.snare, C.gains.snare);
  const h = C.drums.hat[s];
  if (h) playHat(dst, when, h === 2, dv, C.gains.hat);
  if (C.drums.crash[s]) playCrash(dst, when, dv, C.gains.crash);
}

// ===================== bgm-tracks.js =====================
// The three composed BGM tracks (stage / midboss / boss), built from the
// theory-verified blueprints. Authored via a small music-theory builder so the
// source stays compact and correct; melodies (the lead/counter "art") are
// hand-placed from the verified motifs, while pad/bass/arp/drums are generated
// from chord-per-bar progressions.
//
// Pure data + builders — NO audio API used here, so it runs in Node for
// validation (`node design/bgm-tracks.js`): checks lane lengths and in-key.
// Inlined (with bgm-engine.js) into bgm-demo.html and index.html.

// ---------------------------------------------------------------- theory
const PC = { C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11 };

  Fharm: [0,1,4,5,7,8,10],   // F harmonic minor: F G Ab Bb C Db E   (Stage 2 boss climax lift)

function drawScenery(){

  ctx.save();

  ctx.fillStyle=G.laneBed; ctx.beginPath(); ctx.moveTo(_cxs[0]-22*_ss[0],_ys[0]); for(let i=1;i<n;i++) ctx.lineTo(_cxs[i]-22*_ss[i],_ys[i]); for(let i=n-1;i>=0;i--) ctx.lineTo(_cxs[i]+22*_ss[i],_ys[i]); ctx.closePath(); ctx.fill();
  ctx.setLineDash([10,16]); ctx.strokeStyle=G.lanePave; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(_cxs[0],_ys[0]); for(let i=1;i<n;i++) ctx.lineTo(_cxs[i],_ys[i]); ctx.stroke(); ctx.setLineDash([]);
  // SCENERY: sakura canopies (far→near painter order) + lanterns, depth-scaled, hugging the same lane curve
  puffs.sort((a,b)=>(((b.worldY-sc)%SCN_SPAN+SCN_SPAN)%SCN_SPAN)-(((a.worldY-sc)%SCN_SPAN+SCN_SPAN)%SCN_SPAN));
  for(const p of puffs){ const g=((p.worldY-sc)%SCN_SPAN+SCN_SPAN)%SCN_SPAN, s=sOfG(g); if(s<PUFF_CULL_S) continue; const y=HORIZON_Y+DEN*s, x=PF_W/2+(laneCx(sc+g)-PF_W/2)*s+p.side*(30+p.off)*s, spr=canopyVar[p.v], w=spr.width*s; ctx.drawImage(spr,x-w/2,y-w/2,w,w); }

  { const wb=ctx.createLinearGradient(0,GHOST_HOR,0,PF_H); wb.addColorStop(0,'rgba(20,52,46,0)'); wb.addColorStop(1,'rgba(26,66,54,0.5)'); ctx.fillStyle=wb; ctx.fillRect(0,GHOST_HOR,PF_W,PF_H-GHOST_HOR); }  // marsh-water base

// lantern-gold horizon glow marks a lit clearing deep in the grove, and pale jade fog sheets drift across
// for the 迷宮 (lost-in-the-grove) veil. Positions baked off the independent srng (gameplay rng untouched).
function buildBambooScenery(srng){

function drawBambooStalk(x,baseY,s,a,e){

function drawSceneryBamboo(sc){

  { const gx=PF_W*0.5, gy=BAMBOO_HOR+8, gg=ctx.createRadialGradient(gx,gy,0,gx,gy,PF_W*0.9); gg.addColorStop(0,'rgba(120,210,150,0.22)'); gg.addColorStop(0.5,'rgba(150,200,120,0.09)'); gg.addColorStop(1,'rgba(150,200,120,0)'); ctx.fillStyle=gg; ctx.fillRect(0,BAMBOO_HOR-60,PF_W,PF_H-BAMBOO_HOR+60); }

// ---- character cut-in (一枚絵 演出): FULL-SCREEN illustration on a spell-card declaration ----
// Cover-fits the whole playfield (crops overflow), fades in → holds → fades out. Sits ABOVE the
// background but BELOW bullets/sprites, so danmaku & the player ship stay readable on top.
const CUTIN_IN=0.30, CUTIN_OUT=0.40;
function triggerCutin(o){ o=o||{}; const hold=(o.announce!=null)?Math.max(0.3,o.announce-CUTIN_IN-CUTIN_OUT):(o.hold!=null?o.hold:0.7); _cutin={ active:true, t:0, hold, hue:(o.hue!=null?o.hue:null) }; }   // dim 暗転 (no portrait art); optional faint hue tint per spell
function drawCutin(dt){
  const ci=_cutin; if(!ci.active) return;
  ci.t+=dt; const t=ci.t, inD=CUTIN_IN, outD=CUTIN_OUT, total=inD+ci.hold+outD;
  if(t>=total){ ci.active=false; return; }
  let a;                                                   // fade envelope (0..1)
  if(t<inD) a=easeOut(t/inD);
  else if(t<inD+ci.hold) a=1;
  else a=1-easeIn((t-inD-ci.hold)/outD);
  // Spell-declaration "暗転" — dim the playfield only (no portrait art: playtest found the images noisy).
  // Uniform darken + soft centre-focused vignette, fading in→hold→out with the same envelope.
  const DIM=0.52;                                          // peak darkening (0..1) — tune to taste
  ctx.save();
  ctx.globalAlpha=a; ctx.fillStyle='rgba(8,3,16,'+DIM+')'; ctx.fillRect(0,0,PF_W,PF_H);
  const vg=ctx.createRadialGradient(PF_W/2,PF_H*0.46,PF_H*0.30,PF_W/2,PF_H*0.5,PF_H*0.85); vg.addColorStop(0,'rgba(6,2,12,0)'); vg.addColorStop(1,'rgba(6,2,12,0.5)'); ctx.fillStyle=vg; ctx.fillRect(0,0,PF_W,PF_H);
  if(ci.hue!=null){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a*0.16; ctx.fillStyle='hsl('+ci.hue+',75%,55%)'; ctx.fillRect(0,0,PF_W,PF_H); ctx.globalCompositeOperation='source-over'; }   // optional per-spell hue wash (inert unless spec sets cutinHue)
  ctx.globalAlpha=1; ctx.restore();
}

// beam itself is unchanged (original additive look). To keep enemy bullets readable where they overlap the
// bright bar (additive bullet over an additive saturated beam washes out), lay a soft DARK backing under each on-beam
// bullet just before the bullet pass. The beam's solid bar is FLAT max-bright out to ±half (hard-edged fillRects), so
// the backing is uniform across the whole bar and tapers to 0 only across the dimming glow beyond it — giving stable
// contrast at every offset (a centre-weighted taper left the bar edges under-shadowed → flickery visibility).

// Endurance (耐久 / Last Word) bar. Same geometry + rounded HP fill as the normal boss HP bar above
// (unified look). The HP bar IS the goal: damaging it shrinks it from the right. goalFrac = hp/hpMax,
// gap = timer/survivalTotal, cursor(elapsed) = goalFrac − gap. A cyan "time" cursor starts at the LEFT
// and advances right; pierce damage drops hp AND timer equally → the goal (HP right edge) slides left
// without moving the cursor. Cursor reaches the HP right edge ⇒ clear (timer 0); HP→0 also clears.
function drawSurvivalBar(boss){
  const bx=20, by=6, bw=PF_W-40, bh=8, r=4;
  const total=boss.survivalTotal>0?boss.survivalTotal:1;
  const gapFrac=clamp(boss.timer/total,0,1);             // remaining survival (the gap)
  const hpFrac=clamp(boss.hp/boss.hpMax,0,1);            // GOAL = HP bar right edge
  const cursorFrac=clamp(hpFrac-gapFrac,0,1);            // elapsed time; == hpFrac exactly at clear
  const xCur=bx+bw*cursorFrac, xGoal=bx+bw*hpFrac;
  const near=gapFrac<0.18, pulse=near?0.5+0.5*Math.sin(T*9):0.5;
  // base track + rounded HP fill (identical roundRect idiom to the normal HP bar), shaded into the
  // elapsed (dim, behind the cursor) and remaining (lit, cursor→edge) stretches.
  ctx.fillStyle='rgba(0,0,0,0.45)'; roundRect(bx,by,bw,bh,r); ctx.fill();
  const hw=bw*hpFrac;
  if(hw>0){ ctx.save(); roundRect(bx,by,hw,bh,r); ctx.clip();
    const hg=ctx.createLinearGradient(bx,0,bx+bw,0); hg.addColorStop(0,PALETTE.hp0); hg.addColorStop(1,PALETTE.hp1); ctx.fillStyle=hg; ctx.fillRect(bx,by,hw,bh);
    if(xCur>bx){ ctx.fillStyle='rgba(6,3,14,0.46)'; ctx.fillRect(bx,by,xCur-bx,bh); }                 // dim the elapsed stretch
    if(xGoal>xCur+0.5){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(255,255,255,'+(0.08+0.12*pulse).toFixed(3)+')'; ctx.fillRect(xCur,by,xGoal-xCur,bh); ctx.restore(); }   // highlight remaining survival
    ctx.restore(); }
  // goal cursor (elapsed time): a cyan line + soft glow column, riding the bar left → right
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(94,224,255,'+(0.22*(0.5+0.5*pulse)).toFixed(3)+')'; ctx.fillRect(xCur-3,by-2,6,bh+4); ctx.restore();
  ctx.fillStyle='#5ee0ff'; ctx.fillRect(xCur-1,by-3,2,bh+6); ctx.fillStyle='#eaffff'; ctx.fillRect(xCur-0.5,by-3,1,bh+6);
  ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=1; roundRect(bx,by,bw,bh,r); ctx.stroke();   // crisp border

function bakePetals(theme){ const out=[]; theme.petal.forEach(col=>{ const W=24,cv=document.createElement('canvas'); cv.width=W; cv.height=W; const c=cv.getContext('2d'); c.translate(W/2,W/2); c.fillStyle=col; c.beginPath(); c.moveTo(0,-9); c.bezierCurveTo(7,-6,7,6,0,9); c.bezierCurveTo(-7,6,-7,-6,0,-9); c.fill(); c.strokeStyle=theme.petalEdge; c.lineWidth=0.8; c.beginPath(); c.moveTo(0,-8); c.lineTo(0,7); c.stroke(); out.push(cv); }); _petalSprite=out; }

const HUE_SPAN_RING=40, HUE_SPAN_LAYER=60, HUE_SPIN_PERTICK=7, MAX_BOUNCES_DEFAULT=2;

function hueShift(hue,d){ let h=(hue+d)%360; if(h<0) h+=360; return h; }
function layerHue(baseHue,i,n,span){ if(n<=1) return baseHue; const t=i/(n-1); return hueShift(baseHue,(t-0.5)*span); }
function _updBounce(b,dt){ b.vx+=b.ax*dt; b.vy+=b.ay*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.bounces>0){ if(b.x<b.r){ b.x=b.r; b.vx=-b.vx; b.bounces--; } else if(b.x>PF_W-b.r){ b.x=PF_W-b.r; b.vx=-b.vx; b.bounces--; } if(b.y<b.r){ b.y=b.r; b.vy=-b.vy; b.bounces--; } else if(b.y>PF_H-b.r){ b.y=PF_H-b.r; b.vy=-b.vy; b.bounces--; } } }
function _updGhost(b,dt){ if(!b.fired && (T-b.born)>=b.delay){ b.fired=true; let na; if(b.turn==='aim') na=angleToPlayer(b.x,b.y); else na=b.dir+b.turn; if(b.turnAbs) na=b.turn; b.dir=na; const v=polarVel(na,b.speed2!=null?b.speed2:b.speed); b.vx=v.vx; b.vy=v.vy; } b.vx+=b.ax*dt; b.vy+=b.ay*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; }

// ========================= SPELL REGISTRY ===========================
// "registry over generators": a boss phase declares either body:'raw' (+ raw: a generator,
// the mainstream case) or body:'<motifId>' (+ params:) referencing a SPELLS motif. compileSpell
// resolves a phase to its emitter generator-function (boss => generator), matching runPhase's
// contract. Promote a motif into SPELLS only when 3+ cards reuse it; raw stays mainstream.
const SPELLS = {};
// twin counter-rotating spirals + a periodic aimed wall fork — midboss "Petal Whirlpool".
SPELLS.twinSpiralWall = (P)=>function*(b){ let a=0;
  Director.fork(function*(){ while(true){ wall(b,{n:P.wallN,speed:P.wallSpd,hue:P.hueB,style:'dart'}); yield* waitT(P.wallGap); } },b);
  while(true){ spiral(b,{angle:a,arms:P.arms,speed:P.spd,hue:(P.hueA+T*30)%360,style:'small'}); spiral(b,{angle:-a*P.cross,arms:P.arms,speed:P.spd,hue:(P.hueA2+T*30)%360,style:'small'}); a+=P.da; yield* waitT(P.gap); } };

// BALANCE — master tuning table (ARCHITECTURE-V2 §6). difficulties = the cross-cutting knobs applied
// by resolveWave/resolveBoss at spawn time; normal is identity (×1.0) so default play is byte-for-byte
// unchanged. Per-phase base numbers stay in the stage specs/timeline (their single source); BALANCE
// scales them by difficulty. New difficulties / per-stage ranks append here.
const BALANCE = {
  difficulties: {
    easy:   { countMul:0.7, hpMul:0.8,  lives:4, bombs:3 },
    normal: { countMul:1.0, hpMul:1.0,  lives:3, bombs:2 },
    hard:   { countMul:1.2, hpMul:1.15, lives:3, bombs:2 },
    lunatic:{ countMul:1.4, hpMul:1.3,  lives:2, bombs:2 },
  },
};
/*END:CONTENT*/

// ============================== INTERP ==============================
// Difficulty resolution: scale a wave's count / a boss's phase HP by the selected difficulty.
// At normal the multipliers are 1.0 so both return the ORIGINAL object unchanged (identity) — the
// default playthrough is byte-for-byte unaffected. (runStage itself lives in STAGE/ENEMIES.)
function resolveWave(opts, diff){ const D=BALANCE.difficulties[diff]||BALANCE.difficulties.normal; if(D.countMul===1) return opts;
  const o=Object.assign({},opts); if(o.n!=null) o.n=Math.max(1,Math.round(o.n*D.countMul)); if(o.half!=null) o.half=Math.max(1,Math.round(o.half*D.countMul)); return o; }
function resolveBoss(spec, diff){ const D=BALANCE.difficulties[diff]||BALANCE.difficulties.normal; if(D.hpMul===1) return spec;
  const s=Object.assign({},spec); s.phases=spec.phases.map(ph=>{ if(ph.hp==null) return ph; const p=Object.assign({},ph); p.hp=Math.round(ph.hp*D.hpMul); return p; }); return s; }

const rawKeys=Object.create(null), edgeKeys=Object.create(null), stepEdge=Object.create(null);

const ext={ analogX:0, analogY:0, analogActive:false, dragDX:0, dragDY:0, dragConsumed:false };

let inputMode=(typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches)?'touch':'key';

const _padPrev=Object.create(null); let _padIndex=-1;       // gamepad cross-frame edge memory

function held2(a,b){ return !!(rawKeys[a]||rawKeys[b]); }

// ---- gamepad: poll once per frame, BEFORE handleInput, so pad edges land in edgeKeys in time ----
function pollGamepad(){
  ext.analogActive=false; ext.analogX=0; ext.analogY=0;
  const pads=navigator.getGamepads?navigator.getGamepads():null; if(!pads) return;

  if(!gp) return;

  const down=i=>!!(b[i]&&(b[i].pressed||b[i].value>0.5));
  // pad becomes the active input only on real activity (a button or stick past deadzone) — an idle
  // connected pad must NOT hijack a keyboard/touch player or hide the touch UI.
  let anyBtn=false; for(let i=0;i<b.length;i++){ if(down(i)){ anyBtn=true; break; } }
  let sx=ax[PAD_AXIS_LX]||0, sy=ax[PAD_AXIS_LY]||0, mag=Math.hypot(sx,sy);

  rawKeys['ArrowUp']=down(PAD_BTN_DUP); rawKeys['ArrowDown']=down(PAD_BTN_DDOWN); rawKeys['ArrowLeft']=down(PAD_BTN_DLEFT); rawKeys['ArrowRight']=down(PAD_BTN_DRIGHT);

  if(rising(PAD_BTN_A)&&menu){ edgeKeys['Enter']=true; edgeKeys['KeyZ']=true; } // confirm/start on menus

}

// ---- touch: relative-drag move + on-canvas toggle/momentary buttons (Pointer Events, multi-touch) ----
function eventToLogical(e){ const r=canvas.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*CANVAS_W, y:(e.clientY-r.top)/r.height*CANVAS_H }; }

function onPointerDown(e){

  if(Audio&&Audio.unlock) Audio.unlock();                       // touch-first audio unlock (keydown path misses this)
  if(e.pointerType==='touch') e.preventDefault();
  const p=eventToLogical(e), st=game.state;

    if(ptInRect(p.x,p.y,TOUCH_BTN.pause)){ edgeKeys['Escape']=true; touchPointers.set(e.pointerId,{role:'btn'}); return; }
    if(ptInRect(p.x,p.y,TOUCH_BTN.shoot)){ touchShoot=!touchShoot; touchPointers.set(e.pointerId,{role:'btn'}); return; }
    if(ptInRect(p.x,p.y,TOUCH_BTN.focus)){ touchFocus=!touchFocus; touchPointers.set(e.pointerId,{role:'btn'}); return; }
    if(ptInRect(p.x,p.y,TOUCH_BTN.bomb)){ edgeKeys['KeyX']=true; touchPointers.set(e.pointerId,{role:'btn'}); return; }
  }

}
function onPointerMove(e){ const rec=touchPointers.get(e.pointerId); if(!rec||rec.role!=='move'||game.state!==STATE.PLAYING) return; if(e.pointerType==='touch') e.preventDefault(); const p=eventToLogical(e); const s=focusHeld()?TOUCH_DRAG_SENS_FOCUS:TOUCH_DRAG_SENS; ext.dragDX+=(p.x-rec.lastX)*s; ext.dragDY+=(p.y-rec.lastY)*s; rec.lastX=p.x; rec.lastY=p.y; }

  window.addEventListener('gamepaddisconnected',e=>{ if(e.gamepad.index===_padIndex){ _padIndex=-1; clearTransientInput(); rawKeys['KeyZ']=false; rawKeys['ShiftLeft']=false; rawKeys['ArrowUp']=rawKeys['ArrowDown']=rawKeys['ArrowLeft']=rawKeys['ArrowRight']=false; if(inputMode==='pad') inputMode=(typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches)?'touch':'key'; } });
}

let player=null, game=null, run=null;
// difficulty knobs now live in BALANCE.difficulties (CONTENT DATA); resolveWave/resolveBoss apply them.
function makePlayer(){ return { x:PLAYER_START.x, y:PLAYER_START.y, r:PLAYER_R, focus:false, state:'alive', dead:false, invuln:0, blink:false, fireCd:0, power:START_POWER, bombs:START_BOMBS, lives:START_LIVES, itemR:14, bombActive:0, bossDot:0, pendingDeath:0, respawnT:0, options:[], mvx:0, mvy:0, grazePowerT:0 }; }
function makeGame(){ return { state:STATE.TITLE, score:0, hi:0, grazeCount:0, pointTotal:0, scoreMul:1, extendsTaken:0, stateT:0, fullpower:false, paused:false, boss:null, spellIntensity:0, powerMax:MAXPOWER, grazePowerThreshold:GRAZE_POWER_FIRST, grazePowerInterval:GRAZE_POWER_FIRST }; }
function initGameSystems(){ game=makeGame(); player=makePlayer(); loadHiScore(); setState(STATE.TITLE); }

function updateGameSystems(dt){ game.stateT+=dt;
  switch(game.state){
    case STATE.TITLE: updateTitle(dt); break;
    case STATE.PLAYING: playerUpdate(dt); updateItems(dt); applyBossDot(dt); if(game.scoreMul>1) game.scoreMul=Math.max(1,game.scoreMul-SCORE_MUL_DECAY*dt); break;
    case STATE.PAUSED: break;
    case STATE.GAMEOVER:
      if(!game._goFade && game.stateT>GAMEOVER_AUTORET-GAMEOVER_FADE){ game._goFade=true; Audio.fadeOutMusic(GAMEOVER_FADE); }   // begin the gentle tail fade so silence lands right at the auto-return
      if(keyEdge('Enter')||game.stateT>GAMEOVER_AUTORET) setState(STATE.TITLE);
      break;
    case STATE.STAGECLEAR: if(keyEdge('Enter')||game.stateT>8) setState(STATE.TITLE); break;
  }
  game.spellIntensity=approach(game.spellIntensity,(game.boss&&game.boss.inSpell&&!game.boss.dead)?1:0,dt*2.5);
}
function updateTitle(dt){ if(keyEdge('Enter')||keyEdge('KeyZ')) startGame(); }

function setState(s){ const prev=game.state; game.state=s; game.stateT=0;
  if(s!==STATE.PLAYING&&s!==STATE.PAUSED) _cutin.active=false;   // tear down any in-flight cut-in entering a menu/terminal state
  if(s===STATE.TITLE){ game.paused=false; game.boss=null; abortStage&&abortStage(); enemies.length=0; items.length=0; enemyBullets.clear(); playerShots.clear(); particles.clear(); Audio.playMusic('none'); if(activeTheme!==THEMES.spring) setTheme('spring'); }   // reset to the Stage-1 (spring) backdrop so a Stage-2 game-over doesn't leave the dusk/ghost scenery under the title
  else if(s===STATE.PAUSED){ game.paused=true; }
  else if(s===STATE.PLAYING){ game.paused=false; }
  else if(s===STATE.GAMEOVER){ game.paused=false; game._goFade=false; saveHiScore(); enemyBullets.clear(); Audio.playMusic('gameover'); }   // somber lament; tail fades out (GAMEOVER_FADE) then auto-returns to TITLE at GAMEOVER_AUTORET (Enter also returns early)
  else if(s===STATE.STAGECLEAR){ game.paused=false; saveHiScore(); enemyBullets.clear(); game.boss=null; if(player) endGrazePower(); Audio.playMusic('none'); }
}
// run = one campaign playthrough. startRun resets the whole loadout (score/lives/bombs/power);
// enterStage does the per-stage spawn reset and CARRIES the run loadout; advanceStage steps the
// campaign. With one stage, the last stage's clear is terminal — identical to today. (Phase 10+
// wires STAGE_INTERMISSION / RESULTS / CONTINUE around these seams.)
function startRun(diff, fromStage){
  run = { difficulty:(diff||'normal'), stage:(fromStage||0), continuesUsed:0, practice:false };
  const D = BALANCE.difficulties[run.difficulty] || BALANCE.difficulties.normal;
  _cutin.active=false; game.score=0; game.grazeCount=0; game.pointTotal=0; game.scoreMul=1; game.extendsTaken=0; game.fullpower=false; game.boss=null; game.spellIntensity=0; game.grazePowerThreshold=GRAZE_POWER_FIRST; game.grazePowerInterval=GRAZE_POWER_FIRST;
  player=makePlayer(); player.lives=D.lives; player.bombs=D.bombs;
  enterStage(run.stage);
}
function enterStage(i){
  run.stage=i; game.boss=null; if(player) endGrazePower();
  game.grazeCount=0; game.grazePowerThreshold=GRAZE_POWER_FIRST; game.grazePowerInterval=GRAZE_POWER_FIRST;   // each stage restarts the graze→power-up milestone ladder, so the grown threshold doesn't starve later stages of power-ups (no-op on the fresh-run first entry; startRun already set these)
  layoutOptions(); items.length=0; enemyBullets.clear(); playerShots.clear(); particles.clear(); enemies.length=0;
  const st=STAGES[i], sm=(st&&st.music&&st.music.stage)||'stage';
  startStage(); setState(STATE.PLAYING); Audio.playMusic(sm);
}
// next-stage entry is DEFERRED (processed in simStep right after Director.update): calling
// enterStage()->startStage()->Director.start() from INSIDE the running stage coro would clear+repush
// the coro array mid-iteration, and update()'s trailing length-compaction would drop the freshly
// started Stage N+1 coro. Setting a flag and entering the stage at a safe point avoids that.
function advanceStage(){ if(run && run.stage < STAGES.length-1){ run._advanceTo=run.stage+1; } else onStageClear(); }
function startGame(){ startRun('normal', 0); }
function togglePause(){ if(game.state===STATE.PLAYING) setState(STATE.PAUSED); else if(game.state===STATE.PAUSED) setState(STATE.PLAYING); }
function onStageClear(){ setState(STATE.STAGECLEAR); }

function playerUpdate(dt){
  player.focus=focusHeld();
  if(player.invuln>0){ player.invuln-=dt; player.blink=(Math.floor(player.invuln/RESPAWN_BLINK)&1)===0; } else player.blink=false;
  if(player.bombActive>0) player.bombActive-=dt;
  if(player.state==='pendingdeath'){ player.pendingDeath-=dt; if(keyEdge('KeyX')&&player.bombs>0){ player.state='alive'; doBomb(true); return; } if(player.pendingDeath<=0){ finalizeDeath(); return; } }
  if(player.state==='dead'){ player.respawnT-=dt; if(player.respawnT<=0) respawnNow(); return; }
  let dx=0,dy=0; if(moveLeft()) dx-=1; if(moveRight()) dx+=1; if(moveUp()) dy-=1; if(moveDown()) dy+=1; if(ext.analogActive){ dx+=ext.analogX; dy+=ext.analogY; } { const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; } } player.mvx=dx; player.mvy=dy;
  const moveMul=player.focus?PLAYER_FOCUS_MUL:(fireHeld()?1:PLAYER_FAST_MUL); const spd=PLAYER_SPEED*moveMul; player.x+=dx*spd*dt; player.y+=dy*spd*dt;
  if(!ext.dragConsumed){ player.x+=ext.dragDX; player.y+=ext.dragDY; ext.dragConsumed=true; } // touch drag = direct displacement, applied once/frame

function respawnNow(){ player.state='alive'; player.dead=false; player.x=PLAYER_START.x; player.y=PLAYER_START.y; player.invuln=RESPAWN_INVULN; player.fireCd=0; player.grazePowerT=0; ext.dragDX=0; ext.dragDY=0; layoutOptions(); }

function shotLevel(){ const p=player.power; let lvl=0; for(let i=1;i<POWER_BREAKS.length;i++) if(p>=POWER_BREAKS[i]) lvl=i; return lvl; }
function optionCount(){ return [0,0,1,2,2,3,4][shotLevel()]; }
function layoutOptions(){ const n=optionCount(); if(player.options.length!==n){ player.options.length=0; for(let i=0;i<n;i++) player.options.push({x:0,y:0,tx:0,ty:0}); } const spread=player.focus?10:22; for(let i=0;i<n;i++){ const side=(i%2===0)?-1:1, rank=Math.floor(i/2)+1, o=player.options[i]; o.tx=side*spread*rank*0.6; o.ty=-6-rank*6; o.x+=(o.tx-o.x)*0.35; o.y+=(o.ty-o.y)*0.35; } }
function addPower(p){ if(player.power>=MAXPOWER){ game.fullpower=true; return; } const before=shotLevel(); player.power=Math.min(MAXPOWER,player.power+p); if(player.power>=MAXPOWER) game.fullpower=true; if(shotLevel()>before){ sfx.powerup&&sfx.powerup(); layoutOptions(); } }

function playerFire(dt){ if(player.fireCd>0) player.fireCd-=dt; if(!fireHeld()||player.fireCd>0) return; player.fireCd+=FIRE_CADENCE;

function fireShot(x,y,a,speed,dmg,style){ const b=playerShots.acquire(); if(!b) return; b.x=x; b.y=y; b.vx=Math.cos(a)*speed; b.vy=Math.sin(a)*speed; b.ax=0; b.ay=0; b.r=4; b.dmg=dmg; b.style=style; b.kind=(style==='option')?'orb':'needle'; b.hue=(style==='option')?200:330; b.pierce=0; b.alive=true; b.born=T; b.update=null; b.life=0; b.pierceSpell=false; }
function nearestEnemy(x,y){ let best=null,bd=1e9; for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(!e||e.dead) continue; const d=(e.x-x)*(e.x-x)+(e.y-y)*(e.y-y); if(d<bd){ bd=d; best=e; } } return best; }
// homing only targets enemies with an effective hitbox — skip invulnerable ones (an entering/announcing "準備中" boss),
// but a boss in a survival/耐久 spell IS targetable since the power-up's pierce damages it.
function nearestHomingTarget(x,y){ let best=null,bd=1e9; for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(!e||e.dead) continue; const owner=e._shareHpWith||e; if(owner.invuln&&!(owner.boss&&owner.survivalActive)) continue; const d=(e.x-x)*(e.x-x)+(e.y-y)*(e.y-y); if(d<bd){ bd=d; best=e; } } return best; }   // owner-gated so a twin body isn't targeted during the shared pool's invuln windows
function clampAngle(a,lo,hi){ while(a>Math.PI) a-=TAU; while(a<-Math.PI) a+=TAU; return a<lo?lo:(a>hi?hi:a); }

// ---- graze power-up: activation + the super-shot (ignores power level; fires regardless of fireHeld) ----
function activateGrazePower(){ player.grazePowerT=GRAZE_POWER_DURATION; player.fireCd=0; clearBulletsToSparkles(player.x,player.y,GRAZE_ACTIVATE_CLEAR_R); /* clear nearby enemy bullets on activation */ sfx.extend&&sfx.extend(); Render.flash(0.5,GRAZE_HUE); Render.shake(0.35); Render.popText(player.x,player.y-22,'POWER UP!',GRAZE_HUE); for(let i=0;i<16;i++){ const a=rng()*TAU,s=80+rng()*120; spawnParticle(player.x,player.y,Math.cos(a)*s,Math.sin(a)*s,{life:0.5,kind:'sparkle',hue:GRAZE_HUE,r:3}); } }

// Only the laser stops, since it's gated on grazePowerT>0. (In-flight homing keeps its pierceSpell flag, so it can still trim a survival timer until it lands.)
function endGrazePower(){ player.grazePowerT=0; player.fireCd=0; }
function firePowerShots(dt){

    player.fireCd-=dt; if(player.fireCd<=0){ player.fireCd+=GRAZE_HOMING_CADENCE; sfx.powerShot&&sfx.powerShot(); spawnParticle(player.x+(rng()-0.5)*GRAZE_LASER_HALFW,player.y-14,(rng()-0.5)*30,-180,{life:0.12,kind:'muzzle',hue:GRAZE_HUE,r:2.4}); }   // laser SFX/muzzle ticks at the homing cadence (same pace as the homing shots)
  } else {                                             // NON-FOCUS — giant homing bullets

}
function spawnHomingShots(){ const n=GRAZE_HOMING_COUNT;
  for(let i=0;i<n;i++){ const t=(n>1)?(i/(n-1)-0.5):0, a=-HALFPI+t*GRAZE_HOMING_SPREAD+(rng()-0.5)*0.12;
    const s=playerShots.acquire(); if(!s) return;

    s.r=GRAZE_HOMING_R; s.dmg=GRAZE_HOMING_DMG; s.style='powerHoming'; s.kind='homing'; s.hue=GRAZE_HUE; s.pierce=0; s.pierceSpell=true; s.update=updHomingShot; s.life=GRAZE_HOMING_LIFE; s.alive=true; s.born=T; }

}
function updHomingShot(s,dt){ const tgt=nearestHomingTarget(s.x,s.y);

// continuous laser: damage every enemy in a vertical column above the player (pierces all; trims survival timers)
function grazeLaserDamage(dt){ const px=player.x, py=player.y, halfW=GRAZE_LASER_HALFW, dmg=GRAZE_LASER_DPS*dt;

    const owner=e._shareHpWith||e; const pierceable=owner.boss&&owner.survivalActive; if(owner.invuln&&!pierceable) continue;   // eligibility reads the shared owner (twin-boss); the column hit stays per-body so either sister can be lasered
    if(e.y>py) continue; if(Math.abs(e.x-px)>halfW+e.r) continue;

    if(pierceable&&(rng()<0.25)) spawnParticle(e.x+(rng()-0.5)*e.r,e.y+(rng()-0.5)*e.r,(rng()-0.5)*60,(rng()-0.5)*60,{life:0.25,kind:'sparkle',hue:GRAZE_HUE,r:2.4}); } }

function tryBomb(){ if(player.state!=='alive'||player.bombs<=0) return false; doBomb(false); return true; }
function doBomb(isDeathbomb){ player.bombs--; player.invuln=Math.max(player.invuln,BOMB_INVULN); player.bombActive=BOMB_INVULN; player.bossDot=BOMB_DOT_TIME; Render.flash(BOMB_FLASH,55); Render.shake(0.6); Render.cancelWave(player.x,player.y,55,1.2); clearBulletsToSparkles(player.x,player.y,1e9); for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(e&&!e.boss&&!e.dead&&!e.invuln) damageEnemy(e,99999,true); } sfx.bomb&&sfx.bomb(); }
function applyBossDot(dt){ if(player.bossDot>0){ player.bossDot-=dt; for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(e&&!e.dead&&!e._shareHpWith&&!e.invuln) damageEnemy(e,BOMB_BOSS_DPS*dt,true); } } }   // skip twin-boss secondary bodies: the DoT must hit a shared HP pool only ONCE per frame (the primary carries it; the redirect would otherwise double-count)
function clearBulletsToSparkles(cx,cy,radius){ const r2=radius*radius; enemyBullets.forEachLive(b=>{ if(!b.alive) return; const d=(b.x-cx)*(b.x-cx)+(b.y-cy)*(b.y-cy); if(d<=r2){ b.alive=false; addScore(10); spawnParticle(b.x,b.y,(rng()-0.5)*60,(rng()-0.5)*60,{life:0.3,kind:'sparkle',hue:b.hue||55,r:2.6}); } }); }

function onPlayerHit(srcBullet,enemy){ if(player.state!=='alive'||player.invuln>0) return;
  if(player.grazePowerT>0){ // a hit during power-up does NOT release it and grants NO i-frames — it only trims the remaining time (no miss). The bullet is consumed so one distinct bullet = one -1s (no per-frame re-hit).
    player.grazePowerT=Math.max(0,player.grazePowerT-GRAZE_HIT_PENALTY); if(srcBullet) srcBullet.alive=false;
    sfx.graze&&sfx.graze(); Render.flash(0.22,GRAZE_HUE); Render.shake(0.22); Render.popText(player.x,player.y-18,'-1s',GRAZE_HUE);
    for(let i=0;i<8;i++){ const a=rng()*TAU,s=50+rng()*80; spawnParticle(player.x,player.y,Math.cos(a)*s,Math.sin(a)*s,{life:0.3,kind:'sparkle',hue:GRAZE_HUE,r:2.2}); }
    if(player.grazePowerT<=0) endGrazePower();   // a hit that drains it to 0 ends the power-up → clean up trailing shots

function finalizeDeath(){ player.state='dead'; player.dead=true; endGrazePower(); game.scoreMul=1; player.lives--; player.bombs=START_BOMBS; player.respawnT=0.55; sfx.death&&sfx.death(); Render.shake(0.7); Render.slowmo(0.4,0.5); clearBulletsToSparkles(player.x,player.y,DEATH_CLEAR_R); for(let i=0;i<26;i++){ const a=rng()*TAU, s=60+rng()*160; spawnParticle(player.x,player.y,Math.cos(a)*s,Math.sin(a)*s,{life:0.5,kind:'death',hue:330,r:3}); } player.power=Math.max(0,player.power-Math.floor(player.power*0.25)-15); game.fullpower=(player.power>=MAXPOWER); dropItems('power',DEATH_POWER_DROP,player.x,player.y-10,80); if(player.lives<0){ player.state='gameover'; setState(STATE.GAMEOVER); } }

function addScore(n){ game.score+=n; while(game.extendsTaken<Math.floor(game.score/EXTEND_INTERVAL)){ game.extendsTaken++; spawnExtendItem(); } if(game.score>game.hi) game.hi=game.score; }
// score-extend no longer adds a life directly — it drops a 1UP at the screen top, straight above the player,
// to be collected (grantExtend('item') fires on pickup). No rng → deterministic, golden-neutral.
function spawnExtendItem(){ const px=(player&&player.x!=null)?player.x:PF_W/2; spawnItem('oneup',px,-ITEM_R,0,EXTEND_ITEM_FALL); Render.popText(px,30,'1UP!',ITEM_HUE.oneup); Render.flash(0.25,ITEM_HUE.oneup); }
function addGraze(n){ n=n||1; game.grazeCount+=n; addScore(GRAZE_SCORE*n); sfx.graze&&sfx.graze();
  // graze-milestone power-up: each crossed threshold (re)activates; interval grows +10 each time.
  while(player&&player.state==='alive'&&game.grazeCount>=game.grazePowerThreshold){ activateGrazePower(); game.grazePowerInterval+=GRAZE_POWER_STEP; game.grazePowerThreshold+=game.grazePowerInterval; } }
function onGraze(bullet){ if(player.invuln>0) return; addGraze(1); spawnParticle(bullet.x,bullet.y,(rng()-0.5)*40,-30,{life:0.18,kind:'graze',hue:55,r:2}); Render.popText(bullet.x,bullet.y,'+'+GRAZE_SCORE,90); }
// At the life cap, a collected 1UP converts to its EXTEND_INTERVAL (1M) value in score instead of a life.
// Pre-bump extendsTaken so the +1M crossing doesn't itself spawn a fresh 1UP (the score's own extend is suppressed).
function grantExtend(reason){ if(player.lives>=MAX_LIVES){ game.extendsTaken++; addScore(EXTEND_INTERVAL); sfx.extend&&sfx.extend(); Render.flash(0.4,150); Render.popText(player.x,player.y-22,'1UP→+1M',ITEM_HUE.oneup); return; } player.lives++; sfx.extend&&sfx.extend(); Render.flash(0.4,150); }

const HISCORE_KEY='danmaku_hiscore_v1';            // legacy v1 int (kept one release for migration)
const SAVE_KEY='danmaku_save_v2';
let save=null;
// migrate any prior save to v2, folding the legacy v1 int hi-score into hiByDiff.normal.
// read-old-before-write-new + never-lower, so returning players never lose their hi-score.
function migrateSave(old){ const s=(old&&typeof old==='object')?old:{}; s.ver=2;
  if(!s.hiByDiff||typeof s.hiByDiff!=='object') s.hiByDiff={};
  for(const k of ['easy','normal','hard','lunatic']) if(typeof s.hiByDiff[k]!=='number') s.hiByDiff[k]=0;
  if(!s.furthestStage) s.furthestStage={}; if(!s.clears) s.clears={}; if(typeof s.lastName!=='string') s.lastName='';
  try{ const v1=localStorage.getItem(HISCORE_KEY); if(v1!=null){ const n=parseInt(v1,10)||0; if(n>s.hiByDiff.normal) s.hiByDiff.normal=n; } }catch(e){}
  return s; }
function loadSave(){ let s=null; try{ const raw=localStorage.getItem(SAVE_KEY); if(raw) s=JSON.parse(raw); }catch(e){ s=null; } return migrateSave(s); }
function loadHiScore(){ save=loadSave(); const d=(run&&run.difficulty)||'normal'; game.hi=save.hiByDiff[d]||0; }
function saveHiScore(){ if(!save) save=loadSave(); const d=(run&&run.difficulty)||'normal'; if(game.score>game.hi) game.hi=game.score; if(game.hi>(save.hiByDiff[d]||0)) save.hiByDiff[d]=game.hi; try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){} }

function spawnItem(kind,x,y,vx,vy){ items.push({ kind, x, y, vx:vx||0, vy:(vy!=null?vy:-60), r:ITEM_R, hue:ITEM_HUE[kind]!=null?ITEM_HUE[kind]:55, magnet:false, dead:false, born:T }); }
function dropItems(kind,count,x,y,spread){ for(let i=0;i<count;i++){ const a=(-HALFPI)+(rng()-0.5)*1.6, s=60+rng()*90; spawnItem(kind,x+(rng()-0.5)*spread,y,Math.cos(a)*s,Math.sin(a)*s); } }
function dropItem(x,y,kind){ spawnItem(kind,x,y,rng.range(-30,30),-rng.range(40,90)); }
function updateItems(dt){ const pAlive=(player.state==='alive'||player.state==='pendingdeath'); const magnetAll=(pAlive&&player.y<=POC_LINE_Y);
  for(let i=items.length-1;i>=0;i--){ const it=items[i];
    if(!it.magnet){ if(magnetAll&&pAlive) it.magnet=true; }
    if(it.magnet&&pAlive){
      // decoupled homing: speed ramps fast (full ACC), heading slews loosely (TURN rad/s),
      // radial floor (PULL) forces the radius to shrink every tick so it can't orbit.
      const dx=player.x-it.x, dy=player.y-it.y, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
      if(it.spd==null){ it.spd=Math.hypot(it.vx,it.vy); it.dir=(it.spd>1)?Math.atan2(it.vy,it.vx):Math.atan2(dy,dx); }
      it.spd=Math.min(ITEM_MAGNET_MAXSPD, it.spd+ITEM_MAGNET_ACC*dt);
      let da=Math.atan2(dy,dx)-it.dir; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
      const maxTurn=ITEM_MAGNET_TURN*dt; if(da>maxTurn)da=maxTurn; else if(da<-maxTurn)da=-maxTurn; it.dir+=da;
      let vx=Math.cos(it.dir)*it.spd, vy=Math.sin(it.dir)*it.spd;
      const radial=vx*ux+vy*uy, minClose=ITEM_MAGNET_PULL*it.spd;
      if(radial<minClose){ const tx=vx-radial*ux, ty=vy-radial*uy, tlen=Math.hypot(tx,ty), maxTang=Math.sqrt(Math.max(0,it.spd*it.spd-minClose*minClose)), sc=tlen>0?Math.min(1,maxTang/tlen):0; vx=minClose*ux+tx*sc; vy=minClose*uy+ty*sc; it.dir=Math.atan2(vy,vx); }
      it.vx=vx; it.vy=vy;
    } else { it.vy+=ITEM_GRAV*dt; if(it.vy>ITEM_TERMINAL) it.vy=ITEM_TERMINAL; it.vx*=0.992; if(it.spd!=null){ it.spd=null; it.dir=null; } }
    it.x+=it.vx*dt; it.y+=it.vy*dt;
    if(pAlive){ const ddx=it.x-player.x, ddy=it.y-player.y; if(ddx*ddx+ddy*ddy<=ITEM_COLLECT_R*ITEM_COLLECT_R){ collectItem(it); swapRemove(items,i); continue; } }
    if(it.y>PF_H+ITEM_DESPAWN_GRACE){ swapRemove(items,i); }
  }
}
function pointItemValue(yAtCollect){ const top=POC_LINE_Y, bot=PF_H; let t=(yAtCollect-top)/(bot-top); t=t<0?0:(t>1?1:t); return Math.round(POINT_BASE-t*(POINT_BASE-POINT_MIN)); }
function takePoint(it){ game.pointTotal++; addScore(Math.round(pointItemValue(it.y)*Math.min(SCORE_MUL_MAX_APPLY,game.scoreMul))); if(it.kind==='point') game.scoreMul=Math.min(SCORE_MUL_CAP,game.scoreMul+SCORE_MUL_GAIN); }   // score at current (capped) mult FIRST, THEN bump — point items only (fullpower power scores x mult but does NOT pump it)
function collectItem(it){ switch(it.kind){ case 'power': game.fullpower?takePoint(it):addPower(POWER_PER_ITEM); break; case 'bigpower': game.fullpower?takePoint(it):addPower(POWER_PER_BIG); break; case 'full': game.fullpower?takePoint(it):addPower(MAXPOWER); break; case 'oneup': grantExtend('item'); break; case 'bomb': player.bombs=Math.min(MAX_BOMBS,player.bombs+1); break; case 'point': takePoint(it); break; } sfx.item&&sfx.item(it.kind); spawnParticle(it.x,it.y,0,-40,{life:0.25,kind:'pickup',hue:it.hue,r:3}); }

function hexHue(hex){ if(!hex||hex[0]!=='#') return 0; const n=parseInt(hex.slice(1),16); let r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b); if(mx===mn) return 0; const d=mx-mn; let h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; return (h/6)*360; }

function spawnDeathPuff(x,y,hue){ spawnParticle(x,y,0,0,{life:0.5,kind:'ring',hue,r:8}); for(let i=0;i<12;i++){ const a=rng()*TAU, s=40+rng()*120; spawnParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,{life:0.4+rng()*0.3,kind:'death',hue,r:2+rng()*2}); } }
function cancelBullets(o){ o=o||{}; const all=o.all, cx=o.x, cy=o.y, rad=o.radius||1e9, r2=rad*rad, frac=o.frac!=null?o.frac:1, itemCap=o.itemCap!=null?o.itemCap:CANCEL_ITEM_MAX; let cleared=0, minted=0; enemyBullets.forEachLive(b=>{ if(!b.alive) return; if(!all){ const dx=b.x-cx,dy=b.y-cy; if(dx*dx+dy*dy>r2) return; } if(frac<1&&rng()>frac) return; b.alive=false; cleared++; addScore(20); spawnParticle(b.x,b.y,(rng()-0.5)*70,(rng()-0.5)*70,{life:0.4,kind:'sparkle',hue:b.hue||55,r:2.6}); if(o.toItems&&(cleared%8===0)&&minted<itemCap){ minted++; spawnItem('point',b.x,b.y,rng.range(-20,20),-40); } }); if(cleared){ Render.cancelWave(all?PF_W/2:cx,all?PF_H*0.42:cy,200,1); Render.flash(0.2,55); } }

// ---- Director: coroutine scheduler with phase epochs ----
const Director=(function(){
  let coros=[]; let curEpoch=0, epochSeq=0;
  function _wrap(gen,owner,epoch){ return { gen, sleep:0, owner:owner||null, alive:true, epoch:epoch }; }
  function start(genFn){ clear(); curEpoch=0; epochSeq=0; const h=_wrap(genFn(),null,-1); coros.push(h); return h; }
  function fork(genFn,owner){ const h=_wrap(genFn(),owner,curEpoch); coros.push(h); return h; }
  function kill(h){ if(h) h.alive=false; }
  function clear(){ coros.length=0; curEpoch=0; }
  function beginGroup(){ epochSeq++; const prev=curEpoch; curEpoch=epochSeq; return { id:epochSeq, prev }; }
  function endGroup(g){ for(let i=0;i<coros.length;i++) if(coros[i].epoch===g.id) coros[i].alive=false; curEpoch=g.prev; }
  function _step(h,dt){ if(!h.alive) return false; if(h.owner&&h.owner.dead) return false; if(h.sleep>0){ h.sleep-=dt; if(h.sleep>0) return true; dt=0; } let res; try{ res=h.gen.next(); }catch(e){ console.error('coro',e); return false; } if(res.done) return false; const y=res.value; if(typeof y==='number') h.sleep=y; else if(y&&typeof y==='object'&&'sleep'in y) h.sleep=y.sleep; return true; }

})();
function tickStage(dt){ Director.update(dt); }

// ---- wait primitives ----
function* waitT(sec){ yield sec; }
function* waitUntil(pred){ while(!pred()) yield; }
function* waitClear(opts){ const minHp=(opts&&opts.minHp)||0; while(true){ let live=0; for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(!e.dead&&!e.boss&&e.hp>minHp) live++; } if(live===0) return; yield; } }
function* parallel(){ const gens=Array.prototype.slice.call(arguments).map(g=>({g,done:false})); while(gens.some(o=>!o.done)){ for(const o of gens) if(!o.done&&o.g.next().done) o.done=true; yield; } }
function* spawnWave(gen){ yield* gen; }
function* delayed(sec,gen){ yield* waitT(sec); yield* gen; }   // stagger a wave inside parallel(): wait, then run the (lazily-iterated) generator

// ---- enemy ----
function spawnEnemy(spec){ const _hp=(spec.hp||1); const e={ x:spec.x, y:spec.y, vx:0, vy:0, hp:_hp, maxHp:_hp, r:spec.r||R_POP_MED, hue:spec.hue!=null?spec.hue:200, boss:!!spec.boss, bodyDamage:!!spec.bodyDamage, score:spec.score||1000, drops:spec.drops||[], dead:false, invuln:false, born:T, _spec:spec, _steered:false }; enemies.push(e); if(spec.coro) Director.fork(()=>spec.coro(e),e); return e; }
function enemyIntegrate(e,dt){ if(e._steered){ e._steered=false; return; } e.x+=e.vx*dt; e.y+=e.vy*dt; }
function damageEnemy(e,dmg,opts){ if(!e) return false; if(e._shareHpWith) e=e._shareHpWith; if(e.dead) return false;   // twin-boss body → all damage lands on the shared HP/invuln pool (the primary)
  // endurance (耐久/survival) spell: invulnerable to normal damage; only pierce-shots act, by trimming the
  // remaining timer in proportion to the HP fraction dealt. Bombs are not pierce-flagged → cannot break it.
  if(e.boss&&e.survivalActive){ if(opts&&opts.pierce){ if(e.survivalTotal>0&&e.maxHp>0) e.timer=Math.max(0,e.timer-e.survivalTotal*(dmg/e.maxHp)); e.hp=Math.max(0,e.hp-dmg); } return false; }   // pierce drains BOTH the HP bar and the survival timer (HP fraction removed == time fraction removed)
  if(e.invuln) return false;
  e.hp-=dmg; if(e.hp<=0&&!e.boss){ killEnemy(e); return true; } return false; }
function killEnemy(e){ if(e.dead) return; e.dead=true; sfx.enemyDeath&&sfx.enemyDeath(); spawnDeathPuff(e.x,e.y,e.hue); if(e._spec&&e._spec.cancelOnDeath) cancelBullets({x:e.x,y:e.y,radius:70,frac:e._spec.cancelOnDeath,toItems:false}); if(e.drops) for(const d of e.drops) dropItem(e.x+rng.range(-8,8),e.y+rng.range(-6,6),d); if(e._spec&&e._spec.onDeath) e._spec.onDeath(e); addScore(e.score||0); }
function despawnEnemy(e){ e.dead=true; }

// ---- movement helpers (generators) ----
function* moveTo(e,tx,ty,dur,ease){ ease=ease||EASE.inOut; const sx=e.x,sy=e.y,t0=T; if(dur<=0){ e.x=tx; e.y=ty; e._steered=true; return; } while(true){ const k=Math.min(1,(T-t0)/dur), u=ease(k); e.x=sx+(tx-sx)*u; e.y=sy+(ty-sy)*u; e._steered=true; if(k>=1) return; yield; } }
function* moveBezier(e,c1,c2,p3,dur,ease){ ease=ease||EASE.inOut; const p0={x:e.x,y:e.y},t0=T; while(true){ const k=Math.min(1,(T-t0)/dur),u=ease(k),iu=1-u; const b0=iu*iu*iu,b1=3*iu*iu*u,b2=3*iu*u*u,b3=u*u*u; e.x=b0*p0.x+b1*c1.x+b2*c2.x+b3*p3.x; e.y=b0*p0.y+b1*c1.y+b2*c2.y+b3*p3.y; e._steered=true; if(k>=1) return; yield; } }
function* holdFire(e,fireGenFn,sec){ const fc=Director.fork(()=>fireGenFn(e),e); yield* waitT(sec); Director.kill(fc); }
function* exitOff(e,dir,speed){ speed=speed||160; e.vx=Math.cos(dir)*speed; e.vy=Math.sin(dir)*speed; while(e.x>-OFFSCREEN_PAD&&e.x<PF_W+OFFSCREEN_PAD&&e.y>-OFFSCREEN_PAD&&e.y<PF_H+OFFSCREEN_PAD){ e.x+=e.vx*STEP; e.y+=e.vy*STEP; e._steered=true; yield; } e.dead=true; }

// ---- firing routines ----
function* fireAimedBursts(e,opts){ const period=opts.period||0.9, count=opts.count||1, n=opts.n||3; while(true){ for(let i=0;i<count;i++){ aimedShot(e,{speed:opts.speed||150,spread:opts.spread||0.2,n,hue:opts.hue!=null?opts.hue:e.hue,style:opts.style||'mid'}); yield* waitT(period/Math.max(1,count)); } } }
function* fireRings(e,opts){ const period=opts.period||1.4; while(true){ ring(e,{count:opts.count||16,speed:opts.speed||120,hue:opts.hue!=null?opts.hue:e.hue,style:opts.style||'mid',aim:opts.aim?Math.atan2(player.y-e.y,player.x-e.x):0}); yield* waitT(period); } }
function* fireSpiralTurret(e,opts){ const period=opts.period||0.06, da=opts.da||0.31; let a=opts.a0||0; while(true){ spiral(e,{angle:a,arms:opts.arms||2,speed:opts.speed||130,hue:(e.hue+(T*40))%360,style:opts.style||'small'}); a+=da; yield* waitT(period); } }

// ---- wave generators ----
// opts.yStep (px) staggers each successive enemy's entry depth → a diagonal ECHELON line instead of a flat
