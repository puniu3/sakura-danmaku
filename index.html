"use strict";
// =====================================================================
//  桜花弾幕 — SAKURA DANMAKU   (single-file Touhou-style bullet hell)
//  Canvas2D + Web Audio. Fixed-timestep sim, pooled bullets, boss spells.
//  Assembled from 6 reconciled subsystem designs.
// =====================================================================

// ============================ CONSTANTS ==============================
const PF_W = 432, PF_H = 576, HUD_W = 208;
const CANVAS_W = PF_W + HUD_W, CANVAS_H = PF_H;
const PF_X = 0, PF_Y = 0;
const DPR_CAP = 2;

const STEP = 1/120, MAX_FRAME_DT = 0.25, MAX_STEPS = 8;
const DEFAULT_SEED = 0x9e3779b9 >>> 0;
const FPS_SMOOTH = 0.92;

const ENEMYBULLET_CAP = 8192, PLAYERSHOT_CAP = 1024, PARTICLE_CAP = 4096;
const BULLET_DESPAWN_MARGIN = 32;

const PLAYER_R = 2.4, GRAZE_R = 14;
const PLAYER_SPEED = 200, PLAYER_FOCUS_MUL = 0.45, PLAYER_FAST_MUL = 1.6, PLAYER_MARGIN = 10;
const PLAYER_START = { x: 216, y: 496 };
const FIRE_CADENCE = 0.055, SHOT_SPEED = 720, SHOT_DMG = 2, OPTION_DMG = 1.4, MUZZLE_PARTICLES = 2;

// ---- graze power-up (temporary super-shot earned at graze milestones) ----
// First fires at 20 cumulative graze; the gap then grows +20 each time (20,40,60,…), so the
// cumulative thresholds are 20,60,120,200,… Lasts GRAZE_POWER_DURATION or until a hit pops it
// (a hit ends the state instead of killing — no miss). Shot ignores power level entirely.
const GRAZE_POWER_FIRST = 20, GRAZE_POWER_STEP = 20;        // first threshold; per-activation interval growth
const GRAZE_POWER_DURATION = 8.0;                           // active seconds (refreshed if it re-triggers while active)
const GRAZE_HIT_PENALTY = 1.0;                              // a hit during power-up subtracts this many seconds of remaining time (no release, no i-frames)
const GRAZE_HUE = 140;                                      // signature colour for all power-up visuals (verdant)
// non-focus: giant homing bullets (pooled playerShots with a steering update)
const GRAZE_HOMING_CADENCE = 0.075, GRAZE_HOMING_COUNT = 2, GRAZE_HOMING_SPEED = 460;
const GRAZE_HOMING_R = 13, GRAZE_HOMING_DMG = 15, GRAZE_HOMING_TURN = 7.5, GRAZE_HOMING_SPREAD = 1.1, GRAZE_HOMING_LIFE = 2.2;
// focus: thick piercing laser — a per-tick column-damage pass (no pooled shots), drawn as a solid beam
const GRAZE_LASER_HALFW = 30, GRAZE_LASER_DPS = 620;  // HALFW drives both the beam render and the damage column
// notional HP an endurance (耐久/survival) spell exposes to the power-up: pierce damage trims the remaining
// survival timer by survivalTotal*(dmg/maxHp). Sized so a full 8s laser focus removes most of a 28s timer.
const GRAZE_SURVIVAL_HP = 6000;
const GRAZE_PIERCE = { pierce:true };                      // shared opts passed to damageEnemy by power-up shots
const POWERUP_KILL_MULT = 10;                              // power-up (homing/laser) kills award this ×score (the pierce opts double as the "killed by a power-up shot" marker)
const GRAZE_LASER_NOSE = 18;                               // laser emerges this far ahead of the player centre (a little past the nose)
const GRAZE_ACTIVATE_CLEAR_R = 100;                        // radius of enemy-bullet clear when the power-up activates

// ---- enemy laser / 御来光 beam (Stage 4 八咫烏 signature; pooled, dense-prefix; FIRE state is the only lethal window) ----
const LASER_CAP = 24;                          // soft cap (makePool grows on exhaustion)
const LASER_WARN = 1.0, LASER_FIRE = 0.6, LASER_FADE = 0.3;   // default WARN→FIRE→FADE seconds (per-beam overridable in fireBeam)
const LASER_GRAZE_CD = 0.12;                   // min seconds between graze awards while skimming ONE fire-beam (bounds the graze→power-up income so a beam isn't a graze flood)
const LASER_HIT_CD = 0.5;                      // min seconds between death-zone interactions from one beam (so parking in a beam during the graze power-up drains it at a bounded rate, not per-tick)

// ---- gravity well / 嵐の渦 (Stage 5 須佐之男 signature; pooled, dense-prefix). A well does NOT spawn bullets —
// it is a FIELD that BENDS already-flying STRAIGHT enemy bullets (applyGravity). State machine WARN→ACTIVE→FADE.
// Empty in Stages 1-4 → golden-inert: applyGravity early-returns on wells.count===0, the integrate/collide/draw
// loops run over 0 items, and no rng is touched. ----
const WELL_CAP = 6;                             // soft cap (makePool grows); the spell design keeps simultaneous ACTIVE wells ≤4 (perf: applyGravity is O(wells×bullets))
const WELL_WARN = 1.0, WELL_ACTIVE = 6.0, WELL_FADE = 0.4;   // default WARN→ACTIVE→FADE seconds (per-well overridable in placeWell)
const WELL_SOFTEN = 22;                         // non-singular softening k in a = strength/(d+k): kills the 1/d² singularity so a bullet at the centre isn't yanked infinitely — it curves smoothly. Lowered (was 28) for a crisper near-core hook now that wells are SMALL + close to the player (the gimmick must read as a sharp bend, not a lazy arc)
const WELL_AMAX = 760;                          // clamp on the per-tick steering-accel magnitude (px/s²) so even a fast bullet near the core bends fairly, never teleports
const WELL_GRAZE_CD = 0.12;                     // (coreR>0 wells) min seconds between graze awards while skimming ONE lethal core
const WELL_HIT_CD = 0.5;                        // (coreR>0 wells) min seconds between death-zone interactions from one lethal core

// ---- gamepad (standard mapping) ----
const PAD_DEADZONE=0.20, PAD_AXIS_LX=0, PAD_AXIS_LY=1;
const PAD_BTN_A=0, PAD_BTN_B=1, PAD_BTN_X=2, PAD_BTN_LB=4, PAD_BTN_RB=5, PAD_BTN_LT=6, PAD_BTN_RT=7;
const PAD_BTN_SELECT=8, PAD_BTN_START=9, PAD_BTN_DUP=12, PAD_BTN_DDOWN=13, PAD_BTN_DLEFT=14, PAD_BTN_DRIGHT=15;
// ---- touch ----  (relative drag to move; sticky SHOT/FOCUS toggles; BOMB/PAUSE momentary)
const TOUCH_DRAG_SENS=1.0, TOUCH_DRAG_SENS_FOCUS=0.55;
// on-screen button rects in logical coords; all live in the HUD strip (x>=PF_W) so they never
// overlap the playfield drag-zone (x<PF_W). Gameplay cluster sits in the lower-mid HUD (thumb zone);
// PAUSE is a *system* action so it is set apart (small, muted, top of the free band) to avoid
// accidental taps and read as a different kind of control.
const TOUCH_BTN={
  shoot:{x:452,y:320,w:80,h:60,label:'FIRE'},
  focus:{x:540,y:320,w:80,h:60,label:'FOCUS'},
  bomb: {x:452,y:392,w:168,h:60,label:'BOMB'},
  pause:{x:582,y:258,w:40,h:32,label:'II'},
};
const START_POWER = 100;

const MAXPOWER = 400, POWER_BREAKS = [0,40,80,150,200,300,400];
const POWER_PER_ITEM = 8, POWER_PER_BIG = 40;

const START_BOMBS = 2, MAX_BOMBS = 6;   // cap matches MAX_LIVES (6-slot HUD). 'bomb' items drop on each stage's midboss defeat; collectItem caps at MAX_BOMBS.
const BOMB_INVULN = 2.5, BOMB_BOSS_DPS = 140, BOMB_DOT_TIME = 2.2, BOMB_FLASH = 0.6;
const DEATHBOMB_TIME = 9/120;
const START_LIVES = 3, MAX_LIVES = 6;
const RESPAWN_INVULN = 3.0, RESPAWN_BLINK = 0.09, DEATH_CLEAR_R = 72, DEATH_POWER_DROP = 8;

const GRAZE_SCORE = 50;
const EXTEND_INTERVAL = 1e6;   // score-extend fires every fixed 1M (was a [1M,3M,6M,10M] table); HUD shows a fill meter toward the next
const EXTEND_ITEM_FALL = 70;   // score-extend drops a 1UP from the top, straight above the player, to be collected
const POINT_BASE = 10000, POINT_MIN = 2000;   // point-item value anchors (collect high = POINT_BASE, low = POINT_MIN)

// score-pitched point-pickup: blip note rises with gained score on a major 6/9 pentatonic ladder (C5..C7; chord-tone steps so adjacent are consonant). Audio-only, no rng → golden-neutral.
const PITCH_DEGS=[0,2,4,7,9], PITCH_ROOT=72, PITCH_TOP=96;
const PITCH_STEPS=(function(){ const s=[]; for(let o=0; PITCH_ROOT+12*o<=PITCH_TOP; o++) for(const d of PITCH_DEGS){ const m=PITCH_ROOT+d+12*o; if(m<=PITCH_TOP) s.push(m); } return s.sort((a,b)=>a-b); })();
function pitchInfoFor(score){ const sT=Math.max(0,Math.min(1,(score-POINT_MIN)/(POINT_BASE*SCORE_MUL_MAX_APPLY-POINT_MIN))); return PITCH_STEPS[Math.round(Math.sqrt(sT)*(PITCH_STEPS.length-1))]; }
// score multiplier (player state): each point-item pickup +GAIN (internal cap CAP), decays DECAY/s; applied & displayed capped at MAX_APPLY.
// Internal headroom (CAP > MAX_APPLY) keeps a hot chain pinned at the cap so the readout doesn't flicker 1.9<->2.0 each pickup/decay.
const SCORE_MUL_MAX_APPLY = 2.0, SCORE_MUL_CAP = 2.1, SCORE_MUL_GAIN = 0.1, SCORE_MUL_DECAY = 0.2;
const ITEM_GRAV = 120, ITEM_TERMINAL = 130, ITEM_R = 11, ITEM_COLLECT_R = 30;
// grace below the visible bottom (PF_H) an item stays alive-but-clipped before it actually despawns.
// at terminal velocity (130px/s) 100px ≈ 0.77s — enough to dart up to the POC line and auto-collect
// an item that just slipped off the bottom (was 40px ≈ 0.3s, which gave no realistic reaction window).
const ITEM_DESPAWN_GRACE = 100;
// magnet: speed ramps at full ACC toward MAXSPD; heading slews loosely at TURN (rad/s);
// PULL is the min closing-speed fraction (radial floor) that guarantees the radius shrinks → no orbit.
const ITEM_MAGNET_ACC = 2400, ITEM_MAGNET_MAXSPD = 1100, ITEM_MAGNET_TURN = 9, ITEM_MAGNET_PULL = 0.45;
const POC_LINE_Y = 140;
const ITEM_HUE = { power:15, point:205, bigpower:15, oneup:340, full:280, bomb:165 };  // bomb = teal (was 200≈point's 205 → indistinguishable); 165 reads clearly apart from point's blue. HUD bomb star now matches this hue (PALETTE.bomb = teal hsl(165,92%,74%), the item's top-stop colour) so HUD↔item read as one resource.

const STATE = { TITLE:0, PLAYING:1, PAUSED:2, GAMEOVER:3, STAGECLEAR:4,
  // reserved for the multi-stage campaign flow (screens wired when stages 2-6 land; unused at 1 stage).
  DIFFICULTY_SELECT:5, STAGE_INTERMISSION:6, CONTINUE:7, RESULTS:8, NAME_ENTRY:9 };
// The "Falling Petals" lament resolves on its final A4 (onset ~10.5s of content); auto-return is
// pulled in to 11.6s so we leave just before the 12.0s loop seam (never re-attacking A5), and the
// last GAMEOVER_FADE seconds gently fade the tail to silence so the exit lands on a clean break.
const GAMEOVER_AUTORET = 11.6, GAMEOVER_FADE = 0.7;
// Period+IntlRo = fire, Slash = bomb, RightShift = focus → the 逆手 (left-hand-WASD) right-hand grip is
// "RightShift + its 2 left-neighbour keys", self-contained with NO gap on every physical layout:
//   ANSI/ISO/Chinese/Korean: [Period(fire) Slash(bomb) RShift]   (Chinese=ANSI 104; Korean's extra 한/영·한자 keys split the spacebar, not this row)
//   JIS/Brazil-ABNT2:        [Slash(bomb) IntlRo(fire) RShift]   (these insert IntlRo next to RShift; Period stays an outer fire alias)
// IntlRo SHARES Period's fire role (not bomb) so the immediate 3-key cluster never has a hole. Bound by
// physical KeyboardEvent.code, so positions are layout-stable (only printed labels drift). In GAME_KEYS so
// preventDefault kills the browser default (e.g. '/' = Firefox quick-find).
const GAME_KEYS = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight','KeyZ','KeyX','Escape','KeyP','Enter','KeyM','Period','Slash','IntlRo']);

const TAU = Math.PI*2, HALFPI = Math.PI/2, DEG = Math.PI/180;
const DEFAULT_R = 4.5;

// ============================ ENGINE CORE ============================
// ---- math helpers ----
function clamp(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function approach(cur,tgt,maxDelta){ const d=tgt-cur; if(d>maxDelta) return cur+maxDelta; if(d<-maxDelta) return cur-maxDelta; return tgt; }
function hypot(dx,dy){ return Math.sqrt(dx*dx+dy*dy); }
function dist2(ax,ay,bx,by){ const dx=ax-bx,dy=ay-by; return dx*dx+dy*dy; }
function swapRemove(arr,i){ const last=arr.length-1; if(i!==last) arr[i]=arr[last]; arr.pop(); }
function polarVel(a,speed){ return { vx:Math.cos(a)*speed, vy:Math.sin(a)*speed }; }

// ---- seeded RNG (mulberry32) ----
function makeRng(seed){
  let s=(seed>>>0)||1;
  const rng=function(){ s|=0; s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
  rng.range=(a,b)=>a+(b-a)*rng();
  rng.int=(n)=>(rng()*n)|0;
  rng.pick=(arr)=>arr[(rng()*arr.length)|0];
  rng.sign=()=>(rng()<0.5?-1:1);
  rng.bool=(p=0.5)=>rng()<p;
  rng.angle=()=>rng()*TAU;
  rng.reseed=(n)=>{ s=(n>>>0)||1; };
  return rng;
}
const rng = makeRng(DEFAULT_SEED);

// ---- generic pool (dense live prefix) ----
function makePool(factory,n){
  const items=new Array(n);
  for(let i=0;i<n;i++){ const o=factory(); o.alive=false; items[i]=o; }
  const pool={
    items, count:0, cap:n, factory,
    acquire(){ if(this.count>=this.items.length) this._grow(); const o=this.items[this.count++]; o.alive=true; return o; },
    release(o){ o.alive=false; },
    compact(){ const it=this.items; let n2=this.count,i=0; while(i<n2){ if(it[i].alive){ i++; } else { n2--; if(i!==n2){ const tmp=it[i]; it[i]=it[n2]; it[n2]=tmp; } } } this.count=n2; },
    forEachLive(fn){ const it=this.items; for(let i=0;i<this.count;i++) fn(it[i],i); },
    clear(){ for(let i=0;i<this.count;i++) this.items[i].alive=false; this.count=0; },
    shrink(toCap){ toCap=Math.max(toCap|0,this.count); if(this.items.length>toCap) this.items.length=toCap; this.cap=this.items.length; },   // release backing capacity down to toCap (never below live count); for STAGE_INTERMISSION
    _grow(){ const add=Math.max(64,this.items.length>>1); for(let k=0;k<add;k++){ const o=this.factory(); o.alive=false; this.items.push(o); } this.cap=this.items.length; },
  };
  return pool;
}

function newBullet(){ return { x:0,y:0,vx:0,vy:0,ax:0,ay:0, r:DEFAULT_R, hitR:null, style:'orb', hue:0, alive:false, born:0,
  speed:0,dir:0,accel:0,av:0, grazed:false, fade:1, update:null, custom:false,
  delay:0,turn:0,turnAbs:false,speed2:null,bounces:0,fired:false,phase:0, _spr:null }; }
function newShot(){ return { x:0,y:0,vx:0,vy:0,ax:0,ay:0, r:4, kind:'needle', style:'main', hue:330, alive:false, born:0, dmg:1, pierce:0, update:null, life:0, pierceSpell:false }; }
function newParticle(){ return { x:0,y:0,vx:0,vy:0,ax:0,ay:0, r:2, kind:'spark', hue:0, alive:false, born:0, age:0, life:0.5, rot:0, av:0, update:null }; }
// enemy laser: a directed line segment from (x,y) along ang for len px, half-width halfW. state machine
// WARN (telegraph, harmless) → FIRE (lethal column) → FADE (afterglow). follow = an enemy whose x,y the
// origin tracks each tick (boss-mounted sweeps); a spell coro rewrites .ang per tick to sweep. Empty in
// Stages 1-3 → golden-inert (integrate/collide/compact over 0 items, no rng touched).
function newLaser(){ return { x:0,y:0, ang:HALFPI, len:0, halfW:0, hue:45, state:'warn', t:0, warnDur:LASER_WARN, fireDur:LASER_FIRE, fadeDur:LASER_FADE, alive:false, born:0, follow:null, grazeCd:0, hitCd:0, sfxFired:false }; }
// gravity well: a circular FIELD of influence radius R. strength = radial pull coefficient (toward centre),
// swirl = tangential (rotation) coefficient — the swirl is what keeps bent bullets ORBITING out instead of
// collapsing to a lethal point (fairness). coreR = lethal core radius (0 = pure harmless lens). follow = an
// enemy whose x,y the centre tracks each tick (boss-mounted vortices); a coro can also rewrite .x/.y to drift it.
function newWell(){ return { x:0,y:0, R:120, strength:0, swirl:0, coreR:0, hue:205, state:'warn', t:0, warnDur:WELL_WARN, activeDur:WELL_ACTIVE, fadeDur:WELL_FADE, alive:false, born:0, follow:null, spin:0, grazeCd:0, hitCd:0 }; }

const enemyBullets = makePool(newBullet, ENEMYBULLET_CAP);
const playerShots  = makePool(newShot, PLAYERSHOT_CAP);
const particles    = makePool(newParticle, PARTICLE_CAP);
const lasers       = makePool(newLaser, LASER_CAP);
const wells        = makePool(newWell, WELL_CAP);
const enemies = [];
const items = [];

// ---- canonical spawners ----
function spawnBullet(o){
  const b=enemyBullets.acquire(); if(!b) return null;
  b.x=o.x; b.y=o.y; b.vx=o.vx||0; b.vy=o.vy||0; b.ax=o.ax||0; b.ay=o.ay||0;
  b.r=(o.r!=null)?o.r:DEFAULT_R; b.hitR=(o.hitR!=null)?o.hitR:null; b.style=o.style||'orb'; b.hue=(o.hue!=null)?o.hue:0;
  b.alive=true; b.born=T; b.grazed=false; b.fade=1;
  b.speed=(o.speed!=null)?o.speed:Math.hypot(b.vx,b.vy);
  b.dir=(o.dir!=null)?o.dir:Math.atan2(b.vy,b.vx);
  b.av=o.av||0; b.accel=o.accel||0;
  b.update=o.update||null; b.custom=!!o.custom;
  b.delay=o.delay||0; b.bounces=o.bounces||0; b.turn=o.turn||0; b.turnAbs=!!o.turnAbs;
  b.speed2=(o.speed2!=null)?o.speed2:null; b.fired=false; b.phase=o.phase||0;
  b._spr=getBulletSprite(b.style,b.hue);
  return b;
}
function spawnPolar(o,a,speed,extra){ const v=polarVel(a,speed); const opts=extra?Object.assign({},extra):{}; opts.x=o.x; opts.y=o.y; opts.vx=v.vx; opts.vy=v.vy; opts.dir=a; opts.speed=speed; return spawnBullet(opts); }
function spawnParticle(x,y,vx,vy,opts){
  const p=particles.acquire(); if(!p) return null;
  p.x=x; p.y=y; p.vx=vx; p.vy=vy; p.ax=(opts&&opts.ax)||0; p.ay=(opts&&opts.ay)||0;
  p.age=0; p.life=(opts&&opts.life)||0.4; p.kind=(opts&&opts.kind)||'spark';
  p.hue=(opts&&opts.hue!=null)?opts.hue:0; p.r=(opts&&opts.r!=null)?opts.r:2.5;
  p.rot=(opts&&opts.rot)||0; p.av=(opts&&opts.av)||0; p.alive=true; p.born=T;
  return p;
}

// ---- integration ----
function integrateBullets(dt){
  const it=enemyBullets.items, n=enemyBullets.count;
  const minX=-BULLET_DESPAWN_MARGIN, maxX=PF_W+BULLET_DESPAWN_MARGIN, minY=-BULLET_DESPAWN_MARGIN, maxY=PF_H+BULLET_DESPAWN_MARGIN;
  for(let i=0;i<n;i++){ const b=it[i];
    if(b.update){ b.update(b,dt); }
    else if(b.av!==0){ b.dir+=b.av*dt; b.speed+=b.accel*dt; b.vx=Math.cos(b.dir)*b.speed; b.vy=Math.sin(b.dir)*b.speed; b.x+=b.vx*dt; b.y+=b.vy*dt; }
    else { b.vx+=b.ax*dt; b.vy+=b.ay*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; }
    if(b.hitR!=null){ const m=b.r+40; if(b.x<-m||b.x>PF_W+m||b.y<-m||b.y>PF_H+m) b.alive=false; }   // giant bullets (日輪) use a radius-aware despawn margin so they can spawn off-screen and cross the field (the fixed ±32 margin killed them on tick 1). Gated on hitR → existing bullets keep the exact original branch (golden-identical)
    else if(b.x<minX||b.x>maxX||b.y<minY||b.y>maxY) b.alive=false;
  }
}
function integrateShots(dt){
  const it=playerShots.items, n=playerShots.count;
  for(let i=0;i<n;i++){ const s=it[i];
    if(s.update){ s.update(s,dt); } else { s.x+=s.vx*dt; s.y+=s.vy*dt; }
    if(s.life>0 && T-s.born>=s.life){ s.alive=false; continue; }
    if(s.y<-BULLET_DESPAWN_MARGIN||s.x<-BULLET_DESPAWN_MARGIN||s.x>PF_W+BULLET_DESPAWN_MARGIN) s.alive=false; }
}
function integrateParticles(dt){
  const it=particles.items, n=particles.count;
  for(let i=0;i<n;i++){ const p=it[i];
    if(p.update){ p.update(p,dt); } else { p.vx+=p.ax*dt; p.vy+=p.ay*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.av*dt; }
    p.age+=dt; if(p.age>=p.life) p.alive=false; }
}

// ---- collision ----
function collidePlayerBullets(){
  if(!player||player.dead||player.invuln>0) return;
  const px=player.x, py=player.y, it=enemyBullets.items, n=enemyBullets.count;
  // Two passes — resolve EVERY graze before the lethal check. A graze that crosses the power-up threshold fires
  // activateGrazePower → clearBulletsToSparkles, which can dissolve a would-be killer near the player; doing grazes
  // first means that save can't be lost on the same tick to a lethal bullet at a lower pool index. Cleared bullets
  // drop out via the !b.alive guard.
  for(let i=0;i<n;i++){ const b=it[i]; if(!b.alive||b.grazed||b.fade<0.2) continue; const dx=b.x-px,dy=b.y-py,d2=dx*dx+dy*dy; const gr=b.r+GRAZE_R; if(d2<=gr*gr){ b.grazed=true; onGraze(b); } }

// ---- enemy laser system (御来光): verb + integrate state-machine + FIRE-only collision ----
// fireBeam is the spell-coro verb; the returned handle lets a coro sweep it (`b.ang+=…`) until it dies.
function fireBeam(o){ const L=lasers.acquire(); if(!L) return null;
  L.x=o.x; L.y=o.y; L.ang=(o.ang!=null)?o.ang:HALFPI; L.len=o.len||(PF_H*1.5);

  return L; }

    if(L.follow){ if(L.follow.dead) L.follow=null; else { L.x=L.follow.x; L.y=L.follow.y; } }   // boss-mounted origin tracks the body
    L.t+=dt; if(L.grazeCd>0) L.grazeCd-=dt; if(L.hitCd>0) L.hitCd-=dt;
    if(L.state==='warn'){ if(L.t>=L.warnDur){ L.state='fire'; L.t=0; if(!L.sfxFired){ L.sfxFired=true; sfx.beam&&sfx.beam(); } } }

// ---- gravity-well system (嵐の渦): verb + integrate state-machine + the gravity-application pass + (coreR>0) collision ----
// placeWell is the spell-coro verb; the returned handle lets a coro drift it (`w.x/y+=…`, or follow:boss) until it dies.
function placeWell(o){ const w=wells.acquire(); if(!w) return null;
  w.x=o.x; w.y=o.y; w.R=o.R||120; w.strength=o.strength||0; w.swirl=(o.swirl!=null)?o.swirl:0; w.coreR=o.coreR||0;

  w.warnDur=(o.warn!=null)?o.warn:WELL_WARN; w.activeDur=(o.active!=null)?o.active:WELL_ACTIVE; w.fadeDur=(o.fade!=null)?o.fade:WELL_FADE;
  w.state='warn'; w.t=0; w.alive=true; w.born=T; w.follow=o.follow||null; w.spin=o.spin0||0; w.grazeCd=0; w.hitCd=0;
  return w; }
function integrateWells(dt){ const it=wells.items, n=wells.count;
  for(let i=0;i<n;i++){ const w=it[i]; if(!w.alive) continue;
    if(w.follow){ if(w.follow.dead) w.follow=null; else { w.x=w.follow.x; w.y=w.follow.y; } }   // boss-mounted centre tracks the body
    w.t+=dt; w.spin+=(w.swirl<0?-1:1)*dt;   // visual rotation accumulator (sign follows the swirl direction)
    if(w.grazeCd>0) w.grazeCd-=dt; if(w.hitCd>0) w.hitCd-=dt;
    if(w.state==='warn'){ if(w.t>=w.warnDur){ w.state='active'; w.t=0; } }
    else if(w.state==='active'){ if(w.t>=w.activeDur){ w.state='fade'; w.t=0; } }
    else { if(w.t>=w.fadeDur) w.alive=false; }
  } }
// THE GRAVITY PASS — the Stage-5 signature; placed immediately BEFORE integrateBullets, gated on wells.count so

// (b.av===0 AND no b.update = integrateBullets' branch 3): polar-curve bullets (b.av!==0) recompute vx/vy from
// dir/speed every tick and would simply ignore Δv, and b.update bullets steer themselves. So Stage-5 spirals/
// sprays MUST be fired av:0 (straight) to feel the field. Self-targets enemyBullets only (player shots untouched).
// Bend ONE free-flying {x,y,vx,vy} by every ACTIVE well (the same radial+tangential field bullets feel).
// setDir keeps oriented sprites (rice/arrow) pointing along the bent path; items pass setDir=false (they don't render by .dir).
// Early-returns on wells.count===0 → complete no-op (Stages 1-4 / item callers stay byte-identical, golden-inert).

// ---- FPS + main loop ----
const fps = { frame:60 };
let T = 0, renderAlpha = 0, _acc = 0, _lastMs = 0;
// dev profiling HUD (?dev=1, never ?golden) — read-only overlay for the perf phase; ship/golden-inert (computed once, sim untouched)
const DEV_HUD = (typeof location!=='undefined') && /[?&]dev=1/.test(location.search) && !/[?&]golden=1/.test(location.search);
let _devSteps=0, _devWorkMs=0, _devPeakMs=0, _devPeakAcc=0, _devPeakT=0;   // last-frame substeps · whole-frame work ms · rolling 1s-peak ms (+accumulator/timer)

function simStep(dt){
  T += dt;
  updateGameSystems(dt);
  if(game.state===STATE.PLAYING){
    tickStage(dt);
    if(run && run._advanceTo!=null){ const ns=run._advanceTo; run._advanceTo=null; enterStage(ns); }   // deferred stage handoff — safe here (Director.update's coro loop has finished); the rest of this tick runs on the freshly-reset (empty) stage state
    for(let i=enemies.length-1;i>=0;i--){ const e=enemies[i]; if(e.dead){ swapRemove(enemies,i); } else { enemyIntegrate(e,dt); } }
    integrateWells(dt);                  // advance well state machines + follow positions BEFORE the gravity pass…
    applyGravity(dt);                    // …then bend straight enemy bullets (no-op when no wells live → Stages 1-4 byte-identical)
    integrateBullets(dt);
    integrateShots(dt);
    integrateLasers(dt);
    collideShotsEnemies();
    collidePlayerBullets();
    collidePlayerLasers();
    collidePlayerWells();
    collidePlayerEnemies();
  }
  integrateParticles(dt);
  enemyBullets.compact(); playerShots.compact(); particles.compact(); lasers.compact(); wells.compact();
}

function frame(nowMs){
  requestAnimationFrame(frame);
  const _t0=DEV_HUD?performance.now():0;
  if(_lastMs===0) _lastMs=nowMs;
  let dt=(nowMs-_lastMs)/1000; _lastMs=nowMs;
  if(dt>MAX_FRAME_DT) dt=MAX_FRAME_DT;
  if(dt>0) fps.frame=fps.frame*FPS_SMOOTH+(1/dt)*(1-FPS_SMOOTH);
  pollGamepad();     // feed gamepad → rawKeys/edgeKeys/ext BEFORE edges are promoted (no 1-frame lag)
  handleInput(STEP); // promote input edges once per frame (runs even while paused)
  if((game.state===STATE.PLAYING||game.state===STATE.PAUSED) && keyEdge('Escape')) togglePause();
  ext.dragConsumed=false;
  if(!game.paused){
    _acc += dt*(Render.timeScale||1);
    let steps=0;
    while(_acc>=STEP && steps<MAX_STEPS){ simStep(STEP); _acc-=STEP; steps++; }
    if(steps>=MAX_STEPS) _acc=0;
    renderAlpha=_acc/STEP;
    if(DEV_HUD) _devSteps=steps;
  }
  if(ext.dragConsumed){ ext.dragDX=0; ext.dragDY=0; } // drag applied this frame; carry-forward on 0-substep frames (120Hz)
  for(const k in stepEdge) stepEdge[k]=false; // edges are per-frame; clear leftovers
  Render.frame(nowMs, game.paused?1:renderAlpha);
  if(DEV_HUD){ _devWorkMs=performance.now()-_t0; if(_devWorkMs>_devPeakAcc) _devPeakAcc=_devWorkMs; _devPeakT+=dt; if(_devPeakT>=1){ _devPeakMs=_devPeakAcc; _devPeakAcc=0; _devPeakT=0; } }
}

// ===================== bgm-engine.js =====================
// High-quality procedural BGM engine for the danmaku game.
// Drop-in replacement for the simple 2-bar-loop tracks. Designed to be INLINED
// into both bgm-demo.html (audition harness) and index.html (live game).
//
// Assumes these already exist in the host scope (they do in index.html's Audio module):
//   ctx, musicGain, mtof(midi)->Hz, tone(opts), noise(opts), now()
// where tone/noise schedule one-shot self-cleaning voices on opts.dest at opts.t0.
//
// ---- DATA MODEL ----------------------------------------------------------
// A track is authored as SECTIONS (intro/A/B/bridge/...) plus an ARRANGEMENT
// (the order the sections play; it loops at the end). At first use the track is
// COMPILED: sections are concatenated in arrangement order into long per-lane
// arrays, note gate-lengths are precomputed (legato), pad chords get hold-lengths,
// and a flat drum map is built. The scheduler then just walks `step % totalSteps`.
//
// Lanes (each is an array of absolute MIDI numbers; 0 = rest):
//   lead    main melody (THE hook) — layered/detuned for body
//   harm    secondary harmony voice (3rd/6th under lead, softer)
//   counter counter-melody that answers in the lead's rests
//   arp     fast plucky arpeggio of the chord
//   bass    main bassline
//   sub     sine sub-octave on accents (optional)
//   chords  pad: non-null entry = chord (MIDI array) struck & held until next chord
//   kick/snare/hat/crash  drums. hat: 0 none, 1 closed, 2 open. crash: 0/1.
// Any lane may be omitted from a section (treated as all-rests of correct length).
// 1 bar = 16 sixteenth steps, 4/4.

// ---- per-lane default voice timbres (a track overrides via track.voices) ----
const DEFAULT_VOICES = {
  lead: {
    maxGate: 6,
    layers: [
      { type: 'triangle', octave: 0, detune: 0, gain: 1.00 },
      { type: 'triangle', octave: 0, detune: 7, gain: 0.45 },
      { type: 'sawtooth', octave: -1, detune: 0, gain: 0.30, filter: 'lowpass', filterFreq: 1900 },
    ],
    atk: 0.006, dec: 0.06, sus: 0.55, rel: 0.14,
  },
  harm: {
    maxGate: 6,
    layers: [{ type: 'triangle', octave: 0, detune: -5, gain: 1.0 }],
    atk: 0.008, dec: 0.06, sus: 0.5, rel: 0.16, filter: 'lowpass', filterFreq: 2400,
  },
  counter: {
    maxGate: 5,
    layers: [{ type: 'square', octave: 0, detune: 0, gain: 1.0, filter: 'lowpass', filterFreq: 2200 }],
    atk: 0.006, dec: 0.05, sus: 0.4, rel: 0.12,
  },
  arp: {
    maxGate: 1,
    layers: [{ type: 'triangle', octave: 0, detune: 0, gain: 1.0 }],
    atk: 0.002, dec: 0.03, sus: 0.18, rel: 0.06, filter: 'lowpass', filterFreq: 2800,
  },
  bass: {
    maxGate: 4,
    layers: [{ type: 'sawtooth', octave: 0, detune: 0, gain: 1.0 }],
    atk: 0.005, dec: 0.06, sus: 0.6, rel: 0.09, filter: 'lowpass', filterFreq: 720,
  },
  sub: {
    maxGate: 8,
    layers: [{ type: 'sine', octave: 0, detune: 0, gain: 1.0 }],
    atk: 0.006, dec: 0.08, sus: 0.7, rel: 0.12,
  },
  pad: {
    octave: 1, voices: 2, detune: 9, type: 'sawtooth',
    atk: 0.09, dec: 0.14, sus: 0.7, rel: 0.4, filter: 'lowpass', filterFreq: 1700,
  },
  drums: {
    kick:  { f0: 150, f1: 47, peak: 0.30, atk: 0.002, dec: 0.07, rel: 0.12, dur: 0.20, click: true },
    snare: { tone1: 190, tone2: 250, hp: 1500, peak: 0.20, rel: 0.13, dur: 0.15 },
    hatC:  { hp: 9000, peak: 0.055, rel: 0.028, dur: 0.032 },
    hatO:  { hp: 8000, peak: 0.05, rel: 0.13, dur: 0.16 },
    crash: { hp: 5500, peak: 0.12, rel: 0.5, dur: 0.6 },
  },

const DEFAULT_GAINS = {
  lead: 0.135, harm: 0.07, counter: 0.085, arp: 0.06, bass: 0.16, sub: 0.13, pad: 0.05,
  kick: 1, snare: 1, hat: 1, crash: 1, // drum gains baked into voice peaks; these scale them
};

// deep-ish merge of a track's partial voices over the defaults
function mergeVoices(over) {
  over = over || {};

  for (const k in DEFAULT_VOICES) {
    const d = DEFAULT_VOICES[k], o = over[k];
    if (!o) { out[k] = d; continue; }
    if (k === 'drums') {
      out.drums = {};
      for (const dk in d) out.drums[dk] = Object.assign({}, d[dk], o[dk] || {});
    } else {
      out[k] = Object.assign({}, d, o);
      if (o.layers) out[k].layers = o.layers; // replace layers wholesale if given

// ---- COMPILE -------------------------------------------------------------
// Concatenate sections (per arrangement) into flat lanes; precompute gates.
const MELODIC_LANES = ['lead', 'harm', 'counter', 'arp', 'bass', 'sub'];

function laneFromSections(track, lane) {
  const out = [];
  for (const secName of track.arrangement) {
    const sec = track.sections[secName];
    const len = sec.bars * 16;
    const a = sec[lane];
    for (let i = 0; i < len; i++) out.push((a && a[i]) ? a[i] : 0);
  }
  return out;
}

function drumFromSections(track, lane) {
  const out = [];
  for (const secName of track.arrangement) {
    const sec = track.sections[secName];
    const len = sec.bars * 16;
    const a = sec[lane];
    for (let i = 0; i < len; i++) out.push((a && a[i]) ? a[i] : 0);
  }
  return out;
}

// for each onset (note!=0) compute how many steps it sounds: to next onset, capped.
function computeGates(notes, maxGate) {
  const n = notes.length, gate = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    if (!notes[i]) continue;
    let d = 1;
    while (d < n && !notes[(i + d) % n]) d++;
    gate[i] = Math.min(d, maxGate);
  }
  return gate;
}

function compile(track) {
  if (track._compiled) return track._compiled;
  const voices = mergeVoices(track.voices);
  const gains = Object.assign({}, DEFAULT_GAINS, track.gains || {});
  const step16 = 60 / track.bpm / 4;

  const lanes = {};
  for (const ln of MELODIC_LANES) {
    const notes = laneFromSections(track, ln);
    lanes[ln] = { notes, gate: computeGates(notes, voices[ln].maxGate) };
  }
  const totalSteps = lanes.lead.notes.length;

  // pad chords: flatten, then hold each chord until the next non-null chord
  const padFlat = new Array(totalSteps).fill(null);
  {
    let w = 0;
    for (const secName of track.arrangement) {
      const sec = track.sections[secName];
      const len = sec.bars * 16;
      const c = sec.chords;
      for (let i = 0; i < len; i++) { padFlat[w++] = (c && c[i]) ? c[i] : null; }
    }
  }
  const pad = new Array(totalSteps).fill(null);
  for (let i = 0; i < totalSteps; i++) {
    if (!padFlat[i]) continue;
    let d = 1;
    while (d < totalSteps && !padFlat[(i + d) % totalSteps]) d++;
    pad[i] = { notes: padFlat[i], hold: d };
  }

  const drums = {
    kick: drumFromSections(track, 'kick'),
    snare: drumFromSections(track, 'snare'),
    hat: drumFromSections(track, 'hat'),
    crash: drumFromSections(track, 'crash'),
  };

  track._compiled = { totalSteps, step16, lanes, pad, drums, voices, gains };
  return track._compiled;
}

// ---- SYNTH ---------------------------------------------------------------
function playLaneNote(dst, when, midi, vcfg, gain, gateSteps, step16) {
  const dur = Math.max(0.05, gateSteps * step16 * 0.92);
  const layers = vcfg.layers || [{ type: vcfg.type || 'triangle', octave: 0, detune: 0, gain: 1 }];
  for (let i = 0; i < layers.length; i++) {

function playPad(dst, when, chord, holdSteps, vcfg, gain, step16) {
  const dur = Math.max(0.2, holdSteps * step16 * 0.96);
  const nVoices = vcfg.voices || 1;

        dest: dst, t0: when, type: vcfg.type || 'sawtooth',
        f0: mtof(base), detune: det,
        peak: Math.max(0.0008, gain / Math.sqrt(chord.length * nVoices)),
        atk: vcfg.atk, dec: vcfg.dec, sus: vcfg.sus, rel: vcfg.rel, dur: dur,
        filter: vcfg.filter, filterFreq: vcfg.filterFreq, filterFreq1: vcfg.filterFreq1,

  }
}

function playKick(dst, when, d, g) {

    peak: d.peak * g, atk: 0.001, rel: d.rel, dur: d.dur });

    atk: 0.001, dec: 0.02, sus: 0.2, rel: 0.06, dur: 0.07 });

    atk: 0.001, dec: 0.02, sus: 0.2, rel: 0.05, dur: 0.06 });

function playHat(dst, when, open, d, g) {

    peak: cfg.peak * g, atk: 0.001, rel: cfg.rel, dur: cfg.dur });

    peak: d.crash.peak * g, atk: 0.002, rel: d.crash.rel, dur: d.crash.dur });

// schedule one 16th step `s` of compiled track `C` at ctx time `when`
function scheduleTrackStep(C, dst, s, when) {
  // melodic lanes
  for (let li = 0; li < MELODIC_LANES.length; li++) {
    const ln = MELODIC_LANES[li];

    const note = L.notes[s];
    if (note) playLaneNote(dst, when, note, C.voices[ln], C.gains[ln], L.gate[s], C.step16);

  const p = C.pad[s];
  if (p) playPad(dst, when, p.notes, p.hold, C.voices.pad, C.gains.pad, C.step16);

  else if (q === 'aug' || q === '+') iv = [0,4,8];

function bassBar(sym, nextSym, style) {

    case 'half': a[0] = r; a[8] = r; break;
    case 'pumpQ': a[0] = r; a[4] = fifth; a[8] = r; a[12] = fifth; break;
    case 'pump8': for (let i = 0; i < 16; i += 2) a[i] = ((i % 4) === 0) ? r : fifth; a[14] = appr; break;
    case 'walk8': a[0]=r; a[2]=r; a[4]=fifth; a[6]=r; a[8]=oct; a[10]=fifth; a[12]=r; a[14]=appr; break;
    case 'gallop': [0,4,8,12].forEach(b => { a[b]=r; a[b+2]=r; a[b+3]=(b===12?appr:r); }); break;
    case 'drive8': for (let i = 0; i < 16; i += 2) a[i] = r; a[8] = oct; a[14] = appr; break;
    case 'sparseRoot': a[0]=r; a[6]=r; a[10]=fifth; break;   // breathing 和-feel (Stage 3 boss "Mirror of Two Moons")
    default: a[0] = r; a[8] = r;
  }

}

    case 'four': [0,4,8,12].forEach(i => k[i]=1); [4,12].forEach(i => s[i]=1); for (let i=0;i<16;i++) h[i] = (i%4===2)?2:(i%2===0?1:0); break;
    case 'fourLite': [0,8].forEach(i => k[i]=1); [4,12].forEach(i => s[i]=1); for (let i=0;i<16;i+=2) h[i] = (i%4===2)?2:1; break;
    case 'halfTime': [0,8].forEach(i => k[i]=1); s[8]=1; for (let i=0;i<16;i+=4) h[i]=1; break;
    case 'midGroove': [0,8].forEach(i => k[i]=1); k[15]=1; [4,12].forEach(i => s[i]=1); for (let i=0;i<16;i++) h[i] = (i%4===2)?2:1; break;
    case 'midGallop': [0,3,8,11].forEach(i => k[i]=1); [4,12].forEach(i => s[i]=1); for (let i=0;i<16;i++) h[i] = (i===14?2:1); break;
    case 'bossDrive': [0,6,8,14].forEach(i => k[i]=1); [4,12].forEach(i => s[i]=1); for (let i=0;i<16;i++) h[i] = (i===14?2:1); break;
    case 'bossClimax': for (let i=0;i<16;i+=2) k[i]=1; [4,12].forEach(i => s[i]=1); s[15]=1; for (let i=0;i<16;i++) h[i]=1; break;
    case 'bossBridge': [0,8].forEach(i => k[i]=1); [4,12].forEach(i => s[i]=1); break;
    // ---- Stage 3 boss "Mirror of Two Moons": sparse 和太鼓 boom-bap (half-time ritual pulse) ----
    case 'taikoBoomBap': k[0]=1; k[10]=1; s[8]=1; h[4]=1; h[12]=2; break;
    // ---- its fuller antiphonal "call" section (still 和-spacious, not a rock beat) ----
    case 'taikoCall':    k[0]=1; k[6]=1; k[10]=1; s[4]=1; s[12]=1; h[2]=1; h[8]=2; h[14]=1; break;

    case 'serpentLurch': [0,3,7,10,13].forEach(i=>k[i]=1); [5,11].forEach(i=>s[i]=1); h[2]=1; h[6]=2; h[9]=1; h[14]=2; break;

function buildBambooScenery(srng){

    _bambooStalks.push({ worldY:i*(BAMBOO_SPAN/N)+srng()*12, lat:side*(0.5+srng()*0.7), ph:srng()*TAU, sw:0.7+srng()*0.7, th:0.82+srng()*0.5, hj:(srng()*2-1)*10, seg:5+((srng()*3)|0) }); }

// ---- First Light Summit (Stage 4) scenery: a road-LESS fly-over of the SEA OF CLOUDS toward the dawn ----

function buildSummitScenery(srng){

function drawSummitRidges(sc){   // distant mountain ridgelines silhouetted at the horizon (2 hazy parallax layers); they sit on the sun so the peaks read against the 御来光

// ---- High Plain Tempest (Stage 5) scenery: a road-LESS fly-over of a TURBULENT cloud sea toward the storm's EYE ----
// Same far→near depth scheme as summit, re-registered for 嵐: the play band is held to a STORM GREY-BLUE mid-tone
// (bullet readability) while the brightness is concentrated in (a) the bright calm EYE at the horizon centre — the
// clearing the cruise flies toward, where the boss arena forms — and (b) periodic LIGHTNING that briefly lights the
// dark cloud WALL and the whole field. Bolt times/paths are baked off the independent srng and replayed against the
// sim clock T (render-only → gameplay rng untouched; the flash freezes on pause / scales with slow-mo like the rest).
function buildStormScenery(srng){
  _stormClouds.length=0; const NC=20;
  for(let i=0;i<NC;i++) _stormClouds.push({ worldY:i*(STORM_SPAN/NC)+srng()*10, lat:(srng()*2-1), w:0.7+srng()*0.9, ph:srng()*TAU, dark:0.45+srng()*0.5 });
  // baked lightning: a sequence of bolts, each a jagged forked polyline + a flash at sim-time t (irregular gaps)
  _stormBolts.length=0; let bt=1.4;
  for(let i=0;i<64;i++){ bt+=1.0+srng()*2.8; const cx=(srng()*0.74-0.37)+0.5, pts=[]; let x=cx*PF_W, y=STORM_HOR-6;   // strike from just above the horizon
    const H=PF_H*(0.16+srng()*0.18), steps=6+((srng()*3)|0); for(let s=0;s<=steps;s++){ pts.push([x,y]); x+=(srng()*2-1)*16; y+=H/steps; }
    const br=(srng()<0.6), bIdx=2+((srng()*(steps-3))|0), branch=[]; if(br){ let bx2=pts[bIdx][0],by2=pts[bIdx][1]; for(let s=0;s<3;s++){ branch.push([bx2,by2]); bx2+=(srng()*2-1)*14-6; by2+=H/steps*0.9; } }
    _stormBolts.push({ t:bt, pts, branch }); }
}
function drawStormCloud(x,y,s,a,dark){   // a turbulent storm swell — darker blue-grey, NO bright crest (the eye/lightning carry the light)
  const w=66*s, h=20*s; ctx.save(); ctx.globalAlpha=a;
  for(let k=-1;k<=1;k++){ const lx=x+k*w*0.56, lw=w*(k===0?1:0.7); const g=ctx.createRadialGradient(lx,y,2,lx,y,lw); g.addColorStop(0,'rgba('+(72-dark*30)+','+(86-dark*30)+','+(120-dark*30)+',0.78)'); g.addColorStop(1,'rgba(40,52,80,0)'); ctx.fillStyle=g; ctx.save(); ctx.translate(lx,y); ctx.scale(1,h/lw); ctx.beginPath(); ctx.arc(0,0,lw,0,TAU); ctx.fill(); ctx.restore(); }
  ctx.restore();
}
function drawSceneryStorm(sc){
  ctx.save();

  let flash=0, fb=null;
  for(let i=0;i<_stormBolts.length;i++){ const dt0=T-_stormBolts[i].t; if(dt0<0||dt0>0.22) continue; const e=(dt0<0.04)?(dt0/0.04):Math.max(0,1-(dt0-0.04)/0.18); if(e>flash){ flash=e; fb=_stormBolts[i]; } }

  // 4) the turbulent sea of clouds: depth-projected swells flowing DOWN (far→near, painted back-to-front)

// Tsuchigumo (土蜘蛛) earth-spider sprite: bulbous abdomen + cephalothorax (the hit point) + 8 jointed legs + cold eyes.

// Tokoyo (常夜) BLACK-SUN/eclipse sprite: a near-black occluding disk ringed by a cold violet-white corona, turning rays,

// generic fallback (original ellipse-with-wings) — drawn at origin; used when boss.design is unset
function drawBossGeneric(c,t){ c.save(); c.globalCompositeOperation='lighter'; for(let k=0;k<2;k++){ c.save(); c.rotate(t*BOSS_AURA_SPIN*(k?-1:1)+k); const col=k?PALETTE.auraB:PALETTE.auraA; const g=c.createRadialGradient(0,0,6,0,0,46+k*10); g.addColorStop(0,hexA(col,0.5)); g.addColorStop(1,hexA(col,0)); c.fillStyle=g; for(let p=0;p<6;p++){ c.rotate(Math.PI/3); c.beginPath(); c.ellipse(20,0,26,9,0,0,TAU); c.fill(); } c.restore(); } c.restore(); c.fillStyle=PALETTE.bossBody; c.beginPath(); c.ellipse(0,4,16,22,0,0,TAU); c.fill(); c.beginPath(); c.arc(0,-16,9,0,TAU); c.fill(); c.strokeStyle=PALETTE.bossRim; c.lineWidth=1.6; c.beginPath(); c.ellipse(0,4,16,22,0,0,TAU); c.stroke(); c.beginPath(); c.arc(0,-16,9,0,TAU); c.stroke(); c.fillStyle=hexA(PALETTE.bossRim,0.5); c.beginPath(); c.moveTo(-16,-2); c.quadraticCurveTo(-40,-18,-30,12); c.quadraticCurveTo(-22,2,-16,6); c.fill(); c.beginPath(); c.moveTo(16,-2); c.quadraticCurveTo(40,-18,30,12); c.quadraticCurveTo(22,2,16,6); c.fill(); }
// hitbox radius per design — covers the SOLID silhouette (opaque petals/leaves/core); the translucent
// 'lighter' flame/halo is aura, excluded. +shot.r(4) = effective hit radius. Sized so anything that
// visually lands registers (player-favourable over-coverage is fine). Keep in sync with the scales below.

function drawBoss(boss,t){ const x=boss.x,y=boss.y+Math.sin(t*1.4)*2; ctx.save(); ctx.translate(x,y); const D=BOSS_DESIGNS[boss.design]; if(D){ ctx.scale(D.scale,D.scale); D.draw(ctx,t); } else drawBossGeneric(ctx,t); ctx.restore(); }
function drawBanner(dt){ if(!_banner.active) return; _banner.t+=dt; const tt=_banner.t; let x; if(tt<0.35) x=PF_W*(1-easeOut(tt/0.35)); else if(tt<1.6) x=0; else if(tt<2.0) x=-PF_W*easeIn((tt-1.6)/0.4); else { _banner.active=false; return; } ctx.save(); ctx.translate(x,0); const by=PF_H*0.34; ctx.fillStyle=PALETTE.banner; ctx.fillRect(0,by,PF_W,46); ctx.fillStyle=hexA(PALETTE.bossRim,0.9); ctx.fillRect(0,by,PF_W,2); ctx.fillRect(0,by+44,PF_W,2); ctx.fillStyle=PALETTE.uiText; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 19px "Trebuchet MS",sans-serif'; ctx.fillText(_banner.name,PF_W/2,by+24); ctx.restore(); }
function triggerBanner(name){ _banner={active:true,t:0,name:name||''}; }

// ---- character cut-in (一枚絵 演出): a brief screen-dim 暗転 on a spell-card declaration (no portrait art; see drawCutin) ----
const CUTIN_IN=0.30, CUTIN_OUT=0.40;
function triggerCutin(o){ o=o||{}; const hold=(o.announce!=null)?Math.max(0.3,o.announce-CUTIN_IN-CUTIN_OUT):(o.hold!=null?o.hold:0.7); _cutin={ active:true, t:0, hold, hue:(o.hue!=null?o.hue:null) }; }   // dim 暗転 (no portrait art); optional faint hue tint per spell
function drawCutin(dt){
  const ci=_cutin; if(!ci.active) return;
  ci.t+=dt; const t=ci.t, inD=CUTIN_IN, outD=CUTIN_OUT, total=inD+ci.hold+outD;
  if(t>=total){ ci.active=false; return; }
  let a;                                                   // fade envelope (0..1)
  if(t<inD) a=easeOut(t/inD);
  else if(t<inD+ci.hold) a=1;
  else a=1-easeIn((t-inD-ci.hold)/outD);
  // Spell-declaration "暗転" — dim the playfield only (no portrait art: playtest found the images noisy).
  // Uniform darken + soft centre-focused vignette, fading in→hold→out with the same envelope.
  const DIM=0.52;                                          // peak darkening (0..1) — tune to taste
  ctx.save();
  ctx.globalAlpha=a; ctx.fillStyle='rgba(8,3,16,'+DIM+')'; ctx.fillRect(0,0,PF_W,PF_H);
  const vg=ctx.createRadialGradient(PF_W/2,PF_H*0.46,PF_H*0.30,PF_W/2,PF_H*0.5,PF_H*0.85); vg.addColorStop(0,'rgba(6,2,12,0)'); vg.addColorStop(1,'rgba(6,2,12,0.5)'); ctx.fillStyle=vg; ctx.fillRect(0,0,PF_W,PF_H);
  if(ci.hue!=null){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a*0.16; ctx.fillStyle='hsl('+ci.hue+',75%,55%)'; ctx.fillRect(0,0,PF_W,PF_H); ctx.globalCompositeOperation='source-over'; }   // optional per-spell hue wash (inert unless spec sets cutinHue)
  ctx.globalAlpha=1; ctx.restore();
}

// ---- particles / bullets / shots / player / items / enemies ----
function drawParticles(){ const it=particles.items,n=particles.count; ctx.save(); ctx.globalCompositeOperation='lighter'; for(let i=0;i<n;i++){ const p=it[i]; const k=p.age/p.life, fade=1-k; if(p.kind==='ring'){ const rr=p.r*(0.3+k*1.6); ctx.globalAlpha=fade*0.8; ctx.strokeStyle='hsl('+p.hue+',100%,70%)'; ctx.lineWidth=2*fade+0.5; ctx.beginPath(); ctx.arc(p.x,p.y,rr,0,TAU); ctx.stroke(); } else if(p.kind==='sparkle'){ ctx.globalAlpha=fade; ctx.fillStyle='hsl('+p.hue+',100%,85%)'; const s=p.r*(1+k); ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.age*8); ctx.fillRect(-s,-0.6,2*s,1.2); ctx.fillRect(-0.6,-s,1.2,2*s); ctx.restore(); } else { ctx.globalAlpha=fade; const e=getParticleSprite(p.hue), w=p.r*2; ctx.drawImage(e.canvas,p.x-p.r,p.y-p.r,w,w); } } ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.restore(); }

function reqFlash(intensity,hue){ cam.flash=Math.max(cam.flash,intensity==null?1:intensity); cam.flashHue=hue||0; }
function reqShake(amount){ cam.trauma=Math.min(1,cam.trauma+(amount==null?0.6:amount)); }
function reqCancelWave(x,y,hue,strength){ waves.push({x,y,hue:hue==null?200:hue,t:0,life:CANCEL_WAVE_LIFE,strength:strength==null?1:strength}); }
function reqSlowmo(scale,dur){ cam.slowTarget=scale==null?0.25:scale; cam.slowT=dur==null?0.5:dur; }function updateCam(dt){ cam.trauma=Math.max(0,cam.trauma-TRAUMA_DECAY*dt); const sh=cam.trauma*cam.trauma*MAX_SHAKE; cam.shakeX=(Math.random()*2-1)*sh; cam.shakeY=(Math.random()*2-1)*sh; cam.flash=Math.max(0,cam.flash-FLASH_DECAY*dt); if(cam.slowT>0){ cam.slowT-=dt; cam.timeScale+=(cam.slowTarget-cam.timeScale)*Math.min(1,dt*12); if(cam.slowT<=0) cam.slowTarget=1; } else cam.timeScale+=(1-cam.timeScale)*Math.min(1,dt*6); Render.timeScale=cam.timeScale; }
function drawWaves(dt){ ctx.save(); ctx.globalCompositeOperation='lighter'; for(let i=waves.length-1;i>=0;i--){ const w=waves[i]; w.t+=dt; const k=w.t/w.life; if(k>=1){ waves.splice(i,1); continue; } const r=k*CANCEL_WAVE_SPEED*w.life; ctx.globalAlpha=(1-k)*0.7*w.strength; ctx.lineWidth=(1-k)*6+1; ctx.strokeStyle='hsl('+w.hue+',100%,75%)'; ctx.beginPath(); ctx.arc(w.x,w.y,r,0,TAU); ctx.stroke(); ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(w.x,w.y,r*0.92,0,TAU); ctx.stroke(); } ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.restore(); }function drawFlash(){ if(cam.flash<=0) return; ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='hsla('+cam.flashHue+',80%,90%,'+cam.flash+')'; ctx.fillRect(0,0,PF_W,PF_H); ctx.restore(); }
function drawVignette(t){ if(_vig) ctx.drawImage(_vig,0,0,PF_W,PF_H); }

function icon_star(x,y){ ctx.save(); ctx.translate(x,y-1); ctx.beginPath(); for(let i=0;i<10;i++){ const r=(i&1)?2.6:6, a=-HALFPI+i*Math.PI/5, X=Math.cos(a)*r, Y=Math.sin(a)*r; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); } ctx.closePath(); ctx.fill(); ctx.restore(); }
function drawHUD(){ ctx.save(); ctx.translate(PF_W,0); ctx.fillStyle=PALETTE.hudBg; ctx.fillRect(0,0,HUD_W,PF_H); ctx.fillStyle=PALETTE.hudPanel; ctx.fillRect(8,8,HUD_W-16,PF_H-16); ctx.strokeStyle=PALETTE.hudEdge; ctx.lineWidth=2; ctx.strokeRect(8,8,HUD_W-16,PF_H-16); ctx.textAlign='left'; let y=34; const lx=22; const label=s=>{ ctx.fillStyle=PALETTE.uiDim; ctx.font='10px "Trebuchet MS",sans-serif'; ctx.textAlign='left'; ctx.fillText(s,lx,y); }; const val=(s,col)=>{ ctx.fillStyle=col||PALETTE.uiText; ctx.font='bold 17px "Trebuchet MS",sans-serif'; ctx.textAlign='right'; ctx.fillText(s,HUD_W-22,y); ctx.textAlign='left'; };
  const lives=player?player.lives:0, bombs=player?player.bombs:0, pw=player?player.power:0;

    ctx.fillStyle=(t<0.01)?PALETTE.uiDim:'hsl('+(48-t*40)+',100%,'+(60+t*10)+'%)'; ctx.font='bold 12px "Trebuchet MS",sans-serif'; ctx.textAlign='right'; ctx.fillText('x'+mul.toFixed(1),HUD_W-22,y); ctx.textAlign='left';
    const emw=HUD_W-44, eh=4, my=y+5, ef=(game.score%EXTEND_INTERVAL)/EXTEND_INTERVAL; ctx.fillStyle=PALETTE.powerBg; roundRect(lx,my,emw,eh,2); ctx.fill(); ctx.fillStyle=PALETTE.uiGold; roundRect(lx,my,emw*ef,eh,2); ctx.fill();
  } y+=18;
  label('Player'); y+=16; for(let i=0;i<MAX_LIVES&&i<6;i++){ ctx.fillStyle=(i<lives)?PALETTE.life:'rgba(255,93,143,0.18)'; icon_heart(lx+i*18,y); } y+=26;
  label('Bomb'); y+=16; for(let i=0;i<MAX_BOMBS&&i<6;i++){ ctx.fillStyle=(i<bombs)?PALETTE.bomb:'rgba(128,250,219,0.18)'; icon_star(lx+i*18,y); } y+=28;
  label('Power'); y+=8; const barw=HUD_W-44, ph=12, pf=Math.max(0,Math.min(1,pw/MAXPOWER)); ctx.fillStyle=PALETTE.powerBg; roundRect(lx,y,barw,ph,4); ctx.fill(); const pg=ctx.createLinearGradient(lx,0,lx+barw,0); pg.addColorStop(0,PALETTE.power0); pg.addColorStop(1,PALETTE.power1); ctx.fillStyle=pg; roundRect(lx,y,barw*pf,ph,4); ctx.fill(); ctx.fillStyle=game.fullpower?PALETTE.uiGold:PALETTE.uiText; ctx.font='9px sans-serif'; ctx.textAlign='right'; ctx.fillText(game.fullpower?'MAX':(pw/100).toFixed(2),lx+barw,y-3); ctx.textAlign='left'; y+=30;
  { const active=player&&player.grazePowerT>0; label('Graze'); ctx.fillStyle=active?'hsl('+GRAZE_HUE+',100%,72%)':PALETTE.graze; ctx.font='bold 16px "Trebuchet MS",sans-serif'; ctx.textAlign='right'; ctx.fillText(''+(game.grazeCount||0),HUD_W-22,y+2); ctx.textAlign='left';
    // graze-power gauge: when active = remaining-time fraction (power hue); else = progress toward next milestone
    const gx=lx, gw=HUD_W-44, gy=y+8, gh=5, prevTh=game.grazePowerThreshold-game.grazePowerInterval, prog=active?clamp(player.grazePowerT/GRAZE_POWER_DURATION,0,1):clamp((game.grazeCount-prevTh)/Math.max(1,game.grazePowerInterval),0,1);
    ctx.fillStyle='rgba(120,255,140,0.14)'; roundRect(gx,gy,gw,gh,2.5); ctx.fill(); ctx.fillStyle=active?'hsl('+GRAZE_HUE+',100%,66%)':'rgba(185,255,106,0.85)'; roundRect(gx,gy,gw*prog,gh,2.5); ctx.fill(); } y+=30;

function drawBossHUD(boss){ ctx.save();
  if(boss.survivalActive){ drawSurvivalBar(boss); ctx.restore(); return; }
  const frac=Math.max(0,Math.min(1,boss.hp/boss.hpMax)); const bw=PF_W-40, bh=8, bx=20, by=6; ctx.fillStyle='rgba(0,0,0,0.45)'; roundRect(bx,by,bw,bh,4); ctx.fill(); const hg=ctx.createLinearGradient(bx,0,bx+bw,0); hg.addColorStop(0,PALETTE.hp0); hg.addColorStop(1,PALETTE.hp1); ctx.fillStyle=hg; roundRect(bx,by,bw*frac,bh,4); ctx.fill(); const ph=boss.phasesLeft||0; for(let i=0;i<ph;i++){ ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(bx+8+i*10,by+bh+7,2,0,TAU); ctx.fill(); } if(boss.spellName){ ctx.fillStyle=PALETTE.uiText; ctx.font='italic 13px "Trebuchet MS",sans-serif'; ctx.textAlign='right'; ctx.fillText(boss.spellName,PF_W-22,34); ctx.textAlign='left'; } if(boss.timer!=null){ const warn=boss.timer<8; ctx.fillStyle=warn?PALETTE.timerWarn:PALETTE.uiText; ctx.font='bold 16px "Trebuchet MS",monospace'; ctx.fillText(boss.timer.toFixed(2),22,34); } ctx.restore();
}
// Endurance (耐久 / Last Word) bar. Same geometry + rounded HP fill as the normal boss HP bar above
// (unified look). The HP bar IS the goal: damaging it shrinks it from the right. goalFrac = hp/hpMax,
// gap = timer/survivalTotal, cursor(elapsed) = goalFrac − gap. A cyan "time" cursor starts at the LEFT
// and advances right; pierce damage drops hp AND timer equally → the goal (HP right edge) slides left
// without moving the cursor. Cursor reaches the HP right edge ⇒ clear (timer 0); HP→0 also clears.
function drawSurvivalBar(boss){
  const bx=20, by=6, bw=PF_W-40, bh=8, r=4;
  const total=boss.survivalTotal>0?boss.survivalTotal:1;
  const gapFrac=clamp(boss.timer/total,0,1);             // remaining survival (the gap)
  const hpFrac=clamp(boss.hp/boss.hpMax,0,1);            // GOAL = HP bar right edge
  const cursorFrac=clamp(hpFrac-gapFrac,0,1);            // elapsed time; == hpFrac exactly at clear
  const xCur=bx+bw*cursorFrac, xGoal=bx+bw*hpFrac;
  const near=gapFrac<0.18, pulse=near?0.5+0.5*Math.sin(T*9):0.5;
  // base track + rounded HP fill (identical roundRect idiom to the normal HP bar), shaded into the
  // elapsed (dim, behind the cursor) and remaining (lit, cursor→edge) stretches.
  ctx.fillStyle='rgba(0,0,0,0.45)'; roundRect(bx,by,bw,bh,r); ctx.fill();
  const hw=bw*hpFrac;
  if(hw>0){ ctx.save(); roundRect(bx,by,hw,bh,r); ctx.clip();
    const hg=ctx.createLinearGradient(bx,0,bx+bw,0); hg.addColorStop(0,PALETTE.hp0); hg.addColorStop(1,PALETTE.hp1); ctx.fillStyle=hg; ctx.fillRect(bx,by,hw,bh);
    if(xCur>bx){ ctx.fillStyle='rgba(6,3,14,0.46)'; ctx.fillRect(bx,by,xCur-bx,bh); }                 // dim the elapsed stretch
    if(xGoal>xCur+0.5){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(255,255,255,'+(0.08+0.12*pulse).toFixed(3)+')'; ctx.fillRect(xCur,by,xGoal-xCur,bh); ctx.restore(); }   // highlight remaining survival
    ctx.restore(); }
  // goal cursor (elapsed time): a cyan line + soft glow column, riding the bar left → right
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(94,224,255,'+(0.22*(0.5+0.5*pulse)).toFixed(3)+')'; ctx.fillRect(xCur-3,by-2,6,bh+4); ctx.restore();
  ctx.fillStyle='#5ee0ff'; ctx.fillRect(xCur-1,by-3,2,bh+6); ctx.fillStyle='#eaffff'; ctx.fillRect(xCur-0.5,by-3,1,bh+6);
  ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=1; roundRect(bx,by,bw,bh,r); ctx.stroke();   // crisp border
  // spell name (right) + remaining-seconds readout (left, warn-red as it nears clear) + label
  if(boss.spellName){ ctx.fillStyle=PALETTE.uiText; ctx.font='italic 13px "Trebuchet MS",sans-serif'; ctx.textAlign='right'; ctx.fillText(boss.spellName,PF_W-22,34); ctx.textAlign='left'; }
  const warn=boss.timer<8, numStr=boss.timer.toFixed(2); ctx.font='bold 16px "Trebuchet MS",monospace'; ctx.fillStyle=warn?PALETTE.timerWarn:PALETTE.uiText; ctx.fillText(numStr,22,34); const numW=ctx.measureText(numStr).width;
  ctx.fillStyle=PALETTE.uiDim; ctx.font='9px "Trebuchet MS",sans-serif'; ctx.fillText('SURVIVE',22+numW+7,34);
}

 blink=(Math.floor(game.stateT*2)&1)===0; if(blink) ctext(inputMode==='touch'?'Tap to continue':'Press Enter',cx,PF_H/2+78,'14px "Trebuchet MS",sans-serif','#cfa8e8'); } else if(game.state===STATE.STAGECLEAR){ const allClear=(run&&run.stage===STAGES.length-1); dimPlayfield(allClear?0.32:0.5);   /* the FINAL stage's clear = ALL CLEAR (game complete); the dawn cave shows brighter behind it */
    if(allClear){ ctext('ALL CLEAR',cx,PF_H/2-34,'bold 40px "Trebuchet MS",sans-serif','#ffe6a0'); ctext('Score  '+pad(game.score||0,9),cx,PF_H/2+10,'16px "Trebuchet MS",monospace','#fff4e0'); ctext('thank you for playing',cx,PF_H/2+40,'12px "Trebuchet MS",sans-serif','#f0c890'); const blink=(Math.floor(game.stateT*2)&1)===0; if(blink) ctext(inputMode==='touch'?'Tap to continue':'Press Enter',cx,PF_H/2+72,'14px "Trebuchet MS",sans-serif','#ffe6a0'); }
    else { ctext('STAGE CLEAR',cx,PF_H/2-30,'bold 38px "Trebuchet MS",sans-serif','#b9ff6a'); ctext('Score  '+pad(game.score||0,9),cx,PF_H/2+12,'16px "Trebuchet MS",monospace','#ffe9fb'); ctext('Graze  '+(game.grazeCount||0),cx,PF_H/2+38,'13px "Trebuchet MS",monospace','#b9ff6a'); const blink=(Math.floor(game.stateT*2)&1)===0; if(blink) ctext(inputMode==='touch'?'Tap to continue':'Press Enter',cx,PF_H/2+82,'14px "Trebuchet MS",sans-serif','#cfa8e8'); } } }

// ---- dev profiling HUD (?dev=1) — read-only entity counts + whole-frame/1s-peak ms + substeps; never drawn under ship/golden (DEV_HUD false) ----
function drawDevHud(){
  const nb=enemyBullets.count, ns=playerShots.count, np=particles.count, ne=enemies.length, nl=lasers.count, nw=wells.count, ni=items.length, tot=nb+ns+np+ne+nl+nw+ni;

  const col=_devPeakMs>33?'#ff6b6b':(_devPeakMs>17?'#ffd45e':'#7CFC8A');   // 1s-peak >33ms (<30fps) red · >17ms (<60fps) amber · else green
  for(let i=0;i<lines.length;i++) ctext(lines[i],x,y0+i*lh,'10px monospace',col,'left');

// ---- master frame ----
function RenderFrame(now,alpha){ const dt=_lastNow?Math.min(0.05,(now-_lastNow)/1000):0.016; _lastNow=now; _fpsAcc+=dt; _fpsN++; if(_fpsAcc>=0.25){ _fps=_fps*0.5+(_fpsN/_fpsAcc)*0.5; _fpsAcc=0; _fpsN=0; } updateCam(dt); const paused=game.paused; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle='#05030a'; ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  ctx.save(); ctx.beginPath(); ctx.rect(PF_X,PF_Y,PF_W,PF_H); ctx.clip();
  ctx.save(); ctx.translate(PF_X,PF_Y); drawBackground(T); drawScenery(); updateAndDrawPetals(paused?0:dt,T); const spellI=(game.boss&&game.boss.inSpell&&!game.boss.dead)?(game.spellIntensity!=null?game.spellIntensity:1):0; drawSpellBackground(T,spellI); if(game.state===STATE.PLAYING||game.state===STATE.PAUSED||game.boss){ ctx.fillStyle='rgba(22,9,38,0.36)'; ctx.fillRect(0,0,PF_W,PF_H); } if(game.state===STATE.PLAYING) drawPocLine(); ctx.restore();
  ctx.save(); ctx.translate(PF_X,PF_Y); drawCutin(paused?0:dt); ctx.restore();   // cut-in: above background, BELOW bullets/sprites (no shake — it's a backdrop)
  ctx.save(); ctx.translate(PF_X+cam.shakeX,PF_Y+cam.shakeY); drawWells(T); drawEnemyLasers(T); drawGrazeLaser(T); drawItems(T); drawPlayerShots(alpha); if(game.boss&&!game.boss.dead){ drawBoss(game.boss,T); const _tw=game.boss._twin; if(_tw&&!_tw.dead) drawBoss(_tw,T); } drawEnemies(ctx,T,alpha); drawParticles(); drawLaserBulletContrast(alpha); drawEnemyBullets(alpha); drawPlayer(T); drawWaves(dt); ctx.restore();  // laser drawn first (back-most) so enemy bullets & items stay visible on top; contrast backing keeps on-beam bullets readable
  ctx.save(); ctx.translate(PF_X,PF_Y); drawBanner(paused?0:dt); drawFlash(); drawVignette(T); ctx.restore();
  ctx.restore();
  ctx.setTransform(dpr,0,0,dpr,0,0); drawHUD(); drawTouchControls(); drawOverlays(); if(DEV_HUD) drawDevHud();
}

function _updGhost(b,dt){ if(!b.fired && (T-b.born)>=b.delay){ b.fired=true; let na; if(b.turn==='aim') na=angleToPlayer(b.x,b.y); else na=b.dir+b.turn; if(b.turnAbs) na=b.turn; b.dir=na; const v=polarVel(na,b.speed2!=null?b.speed2:b.speed); b.vx=v.vx; b.vy=v.vy; } b.vx+=b.ax*dt; b.vy+=b.ay*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; }
// 日輪 (Stage 4): a giant solar bullet that RISES from the ridgeline (smoothstep over b._riseT to b._crestY)
// then CROSSES slowly (b._vx / b._vy). Big visual r, small hitR (set at spawn) → 東方流儀 fair giant. Custom
// fields are stamped on the bullet post-spawn; the standard integrateBullets out-of-bounds despawn still applies.
function _updSun(b,dt){ const age=T-b.born; if(b._riseT>0 && age<b._riseT){ const k=age/b._riseT, u=k*k*(3-2*k); b.y=b._y0+(b._crestY-b._y0)*u; b.x+=b._vx*dt*0.3; } else { b.x+=b._vx*dt; b.y+=b._vy*dt; } }
function spawnSun(o){ const b=spawnBullet({ x:o.x, y:o.y, vx:0, vy:0, r:o.r||42, hitR:(o.hitR!=null)?o.hitR:11, style:'sun', hue:(o.hue!=null)?o.hue:46, dir:HALFPI, speed:0, custom:true, update:_updSun }); if(!b) return null; b._y0=o.y; b._crestY=(o.crestY!=null)?o.crestY:o.y; b._riseT=(o.riseT!=null)?o.riseT:0; b._vx=o.vx||0; b._vy=(o.vy!=null)?o.vy:0; return b; }
// ---- Stage 6 (天岩戸) gimmick bullets: 留まる弾 (lingering "stopping" bullet) + 弾を生む弾 (breeder seed). Both ride the
// existing enemyBullets pool + b.update — NO new pool / simStep pass / collide / doBomb wiring (they are ordinary
// enemyBullets, so doBomb's clearBulletsToSparkles wipes them = panic-button contract free). Spawned only by Stage 6
// content → never in Stages 1-5 → golden byte-identical. Custom _foo fields are stamped AFTER the spawn null-check.
// lingering bullet: travels at launch speed until it reaches the player's vicinity (_trigD ≈100px), THEN brakes to
// _spdFloor (20%) over _decelT and LINGERS there. After lingering it RESUMES (flies off & despawns) or FADES &
// self-removes; untriggered it just flies past. hitR null → kill/graze use b.r; the b.fade<0.2 guard drops it once faded.
function _updLinger(b,dt){

    if(b._home>0){ let d=angleToPlayer(b.x,b.y)-b.dir; while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU; b.dir+=clamp(d,-b._home*dt,b._home*dt); b.vx=Math.cos(b.dir)*b.speed; b.vy=Math.sin(b.dir)*b.speed; }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(player){ const dx=player.x-b.x, dy=player.y-b.y; if(dx*dx+dy*dy<=b._trigD2) b._trig=T; }    // entered the player's vicinity → start braking HERE
    return;
  }
  const age=T-b._trig;
  if(age<b._decelT){ const k=age/b._decelT; b.speed=b._spd0+(b._spdFloor-b._spd0)*k; b.vx=Math.cos(b.dir)*b.speed; b.vy=Math.sin(b.dir)*b.speed; }   // brake launch→20% over _decelT
  else if(age<b._decelT+b._holdT){ /* linger: drifting at the 20% floor speed, right in the player's space */ }
  else if(b._resume>0){ b.speed=b._resume; b.vx=Math.cos(b.dir)*b.speed; b.vy=Math.sin(b.dir)*b.speed; }   /* RESUME → flies off & despawns normally */
  else { b.fade=Math.max(0,(b.fade!=null?b.fade:1)-dt*2.2); if(b.fade<=0.03){ b.alive=false; return; } }    /* FADE & self-remove */
  b.x+=b.vx*dt; b.y+=b.vy*dt;

function spawnLinger(o){ const a=o.aim?angleToPlayer(o.x,o.y):(o.dir!=null?o.dir:HALFPI), sp=(o.speed!=null)?o.speed:185;
  const b=spawnBullet({ x:o.x, y:o.y, dir:a, speed:sp, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:o.r||6.5, style:o.style||'lamp', hue:(o.hue!=null)?o.hue:200, custom:true, update:_updLinger }); if(!b) return null;

// Used by every spawnSeed call (road seedfall + tsuchigumo + tokoyo); P8's dawn has no seeds so no warm-on-warm clash.
const SEED_HUE = 44, SEED_CHILD_HUE = 48;

// breed → bounded to ONE generation (n×births) so the pool can't balloon.
function _updSeed(b,dt){ b.x+=b.vx*dt; b.y+=b.vy*dt; b._breedCd-=dt;
  if(b._breedCd<=0 && (b._untilOff || b._birthsLeft>0)){ b._breedCd+=b._breedEvery; if(!b._untilOff) b._birthsLeft--;   // untilOff: breed until end of life (no births cap; stops on off-screen despawn / _life). Otherwise breed exactly births times.
    if(b._breedFan){ const pd=Math.atan2(b.vy,b.vx), lo=pd-b._breedSpread*0.5, seq=(b._breedSeq=(b._breedSeq|0)+1);   // childFan: a narrow fan along the parent's direction (the parent aim-locked to the player at spawn)

        const a=lo+b._breedSpread*((i+j)/b._breedN);   // stratified jitter: slot i + random j → same angular span (_breedSpread) but the distribution shifts each breed so the safe gaps move
        const cx=Math.cos(a)*b._breedSpeed+b.vx*b._breedCarry, cy=Math.sin(a)*b._breedSpeed+b.vy*b._breedCarry, cs=Math.hypot(cx,cy);   // children inherit part of the parent's velocity (_breedCarry<1) so angled children keep forward momentum
        spawnBullet({ x:b.x, y:b.y, vx:cx, vy:cy, dir:Math.atan2(cy,cx), speed:cs, hue:b._breedHue, style:b._breedStyle, r:b._breedR, av:0 }); } }
    else { let base, step;

      else { base=b._breedPhase; step=TAU/b._breedN; b._breedPhase+=b._breedTwist; }   // default = a radial ring (byte-identical for every non-aim/non-fan seed)
      for(let i=0;i<b._breedN;i++) spawnPolar(b,base+step*i,b._breedSpeed,{hue:b._breedHue,style:b._breedStyle,r:b._breedR,av:0}); } }

// ========================= SPELL REGISTRY ===========================
// "registry over generators": a boss phase declares either body:'raw' (+ raw: a generator,
// the mainstream case) or body:'<motifId>' (+ params:) referencing a SPELLS motif. compileSpell
// resolves a phase to its emitter generator-function (boss => generator), matching runPhase's
// contract. Promote a motif into SPELLS only when 3+ cards reuse it; raw stays mainstream.
const SPELLS = {};
// twin counter-rotating spirals + a periodic aimed wall fork — midboss "Petal Whirlpool".
SPELLS.twinSpiralWall = (P)=>function*(b){ let a=0;
  Director.fork(function*(){ while(true){ wall(b,{n:P.wallN,speed:P.wallSpd,hue:P.hueB,style:'dart'}); yield* waitT(P.wallGap); } },b);
  while(true){ spiral(b,{angle:a,arms:P.arms,speed:P.spd,hue:(P.hueA+T*30)%360,style:'small'}); spiral(b,{angle:-a*P.cross,arms:P.arms,speed:P.spd,hue:(P.hueA2+T*30)%360,style:'small'}); a+=P.da; yield* waitT(P.gap); } };
function compileSpell(ph){ if(ph.body && ph.body!=='raw'){ const m=SPELLS[ph.body]; if(m) return m(ph.params||{}); } return ph.raw || ph.emitter; }

// BALANCE / WAVES / SPELLS refs / BOSSES / STAGES / CAMPAIGN — declarative data.

// BALANCE — master tuning table (ARCHITECTURE-V2 §6). difficulties = the cross-cutting knobs applied
// by resolveWave/resolveBoss at spawn time; normal is identity (×1.0) so default play is byte-for-byte
// unchanged. Per-phase base numbers stay in the stage specs/timeline (their single source); BALANCE
// scales them by difficulty. New difficulties / per-stage ranks append here.
const BALANCE = {
  difficulties: {
    easy:   { countMul:0.7, hpMul:0.8,  lives:4, bombs:3 },
    normal: { countMul:1.0, hpMul:1.0,  lives:3, bombs:2 },
    hard:   { countMul:1.2, hpMul:1.15, lives:3, bombs:2 },
    lunatic:{ countMul:1.4, hpMul:1.3,  lives:2, bombs:2 },
  },
};
/*END:CONTENT*/

// ============================== INTERP ==============================
// Difficulty resolution: scale a wave's count / a boss's phase HP by the selected difficulty.
// At normal the multipliers are 1.0 so both return the ORIGINAL object unchanged (identity) — the
// default playthrough is byte-for-byte unaffected. (runStage itself lives in STAGE/ENEMIES.)
function resolveWave(opts, diff){ const D=BALANCE.difficulties[diff]||BALANCE.difficulties.normal; if(D.countMul===1) return opts;
  const o=Object.assign({},opts); if(o.n!=null) o.n=Math.max(1,Math.round(o.n*D.countMul)); if(o.half!=null) o.half=Math.max(1,Math.round(o.half*D.countMul)); return o; }
function resolveBoss(spec, diff){ const D=BALANCE.difficulties[diff]||BALANCE.difficulties.normal; if(D.hpMul===1) return spec;
  const s=Object.assign({},spec); s.phases=spec.phases.map(ph=>{ if(ph.hp==null) return ph; const p=Object.assign({},ph); p.hp=Math.round(ph.hp*D.hpMul); return p; }); return s; }

// ============================ SYSTEMS ================================
const rawKeys=Object.create(null), edgeKeys=Object.create(null), stepEdge=Object.create(null);
// shared movement seam: gamepad writes analog* (velocity), touch writes drag* (positional). playerUpdate reads both.
const ext={ analogX:0, analogY:0, analogActive:false, dragDX:0, dragDY:0, dragConsumed:false };
let touchShoot=true, touchFocus=false;                      // touch toggle state (shoot default ON)
// active input method (last-used wins). Gates touch UI rendering + whether touch toggles affect play,
// so using keyboard/gamepad hides the on-screen controls and stops the toggles from interfering.
let inputMode=(typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches)?'touch':'key';
const touchPointers=new Map(); let movePointerId=-1;        // per-finger roles for multi-touch
const _padPrev=Object.create(null); let _padIndex=-1;       // gamepad cross-frame edge memory
function clearTransientInput(){ touchPointers.clear(); movePointerId=-1; ext.dragDX=0; ext.dragDY=0; ext.analogActive=false; ext.analogX=0; ext.analogY=0; for(const k in _padPrev) _padPrev[k]=false; }
function attachInput(targetEl){ const el=targetEl||window;
  el.addEventListener('keydown',e=>{ const code=e.code; inputMode='key'; if(GAME_KEYS.has(code)) e.preventDefault(); if(Audio&&Audio.unlock) Audio.unlock(); if(code==='KeyM'){ if(!rawKeys[code]) Audio.toggleMute(); } if(!rawKeys[code]) edgeKeys[code]=true; rawKeys[code]=true; },{passive:false});
  el.addEventListener('keyup',e=>{ const code=e.code; if(GAME_KEYS.has(code)) e.preventDefault(); rawKeys[code]=false; },{passive:false});
  window.addEventListener('blur',()=>{ for(const k in rawKeys) rawKeys[k]=false; clearTransientInput(); });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) Audio.suspendForHidden(); else Audio.resumeFromHidden(); });
}
function held2(a,b){ return !!(rawKeys[a]||rawKeys[b]); }
function keyEdge(code){ if(stepEdge[code]){ stepEdge[code]=false; return true; } return false; }
const moveLeft=()=>held2('ArrowLeft','KeyA'), moveRight=()=>held2('ArrowRight','KeyD'), moveUp=()=>held2('ArrowUp','KeyW'), moveDown=()=>held2('ArrowDown','KeyS');
const focusHeld=()=>held2('ShiftLeft','ShiftRight')||(inputMode==='touch'&&touchFocus), fireHeld=()=>!!rawKeys['KeyZ']||!!rawKeys['Period']||!!rawKeys['IntlRo']||(inputMode==='touch'&&touchShoot);
function handleInput(dt){ for(const k in edgeKeys){ if(edgeKeys[k]){ stepEdge[k]=true; edgeKeys[k]=false; } } if(stepEdge['ShiftRight']) stepEdge['ShiftLeft']=true; if(stepEdge['KeyP']) stepEdge['Escape']=true; if(stepEdge['Slash']) stepEdge['KeyX']=true; }

// ---- gamepad: poll once per frame, BEFORE handleInput, so pad edges land in edgeKeys in time ----
function pollGamepad(){
  ext.analogActive=false; ext.analogX=0; ext.analogY=0;
  const pads=navigator.getGamepads?navigator.getGamepads():null; if(!pads) return;
  let gp=(_padIndex>=0)?pads[_padIndex]:null;
  if(!gp){ for(let i=0;i<pads.length;i++){ if(pads[i]&&pads[i].connected){ gp=pads[i]; _padIndex=i; break; } } }
  if(!gp) return;
  const b=gp.buttons, ax=gp.axes;
  const down=i=>!!(b[i]&&(b[i].pressed||b[i].value>0.5));
  // pad becomes the active input only on real activity (a button or stick past deadzone) — an idle
  // connected pad must NOT hijack a keyboard/touch player or hide the touch UI.
  let anyBtn=false; for(let i=0;i<b.length;i++){ if(down(i)){ anyBtn=true; break; } }
  let sx=ax[PAD_AXIS_LX]||0, sy=ax[PAD_AXIS_LY]||0, mag=Math.hypot(sx,sy);
  if(anyBtn||mag>PAD_DEADZONE) inputMode='pad';
  if(inputMode!=='pad'){ for(let i=0;i<b.length;i++) _padPrev[i]=down(i); return; } // present but not active → keep clean edges, don't write rawKeys/ext
  const rising=i=>{ const now=down(i), was=!!_padPrev[i]; _padPrev[i]=now; return now&&!was; };
  // held → rawKeys (pad owns these while it is the active input)
  rawKeys['KeyZ']=down(PAD_BTN_A)||down(PAD_BTN_X);
  rawKeys['ShiftLeft']=down(PAD_BTN_LB)||down(PAD_BTN_RB)||down(PAD_BTN_LT)||down(PAD_BTN_RT);
  rawKeys['ArrowUp']=down(PAD_BTN_DUP); rawKeys['ArrowDown']=down(PAD_BTN_DDOWN); rawKeys['ArrowLeft']=down(PAD_BTN_DLEFT); rawKeys['ArrowRight']=down(PAD_BTN_DRIGHT);
  // edges → edgeKeys (state-gated so a single press maps to exactly one intended action)
  const menu=(game.state===STATE.TITLE||game.state===STATE.GAMEOVER||game.state===STATE.STAGECLEAR);
  if(rising(PAD_BTN_B)) edgeKeys['KeyX']=true;                                  // bomb
  if(rising(PAD_BTN_A)&&menu){ edgeKeys['Enter']=true; edgeKeys['KeyZ']=true; } // confirm/start on menus
  if(rising(PAD_BTN_START)){ if(game.state===STATE.PLAYING||game.state===STATE.PAUSED) edgeKeys['Escape']=true; else { edgeKeys['Enter']=true; edgeKeys['KeyZ']=true; } }
  if(rising(PAD_BTN_SELECT)){ if(Audio&&Audio.unlock) Audio.unlock(); Audio.toggleMute(); }
  // left stick → analog velocity vector (deadzone-rescaled, magnitude preserved up to 1)
  if(mag>PAD_DEADZONE){ let n=(mag-PAD_DEADZONE)/(1-PAD_DEADZONE); if(n>1)n=1; const k=n/mag; ext.analogX=sx*k; ext.analogY=sy*k; ext.analogActive=true; }
}

// ---- touch: relative-drag move + on-canvas toggle/momentary buttons (Pointer Events, multi-touch) ----
function eventToLogical(e){ const r=canvas.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*CANVAS_W, y:(e.clientY-r.top)/r.height*CANVAS_H }; }
function ptInRect(x,y,r){ return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }
function inPlayfield(x,y){ return x>=PF_X&&x<PF_W&&y>=PF_Y&&y<PF_H; }
function onPointerDown(e){
  const isTouch=(e.pointerType==='touch'||e.pointerType==='pen');
  if(isTouch) inputMode='touch';                               // touch becomes the active input method
  if(Audio&&Audio.unlock) Audio.unlock();                       // touch-first audio unlock (keydown path misses this)
  if(e.pointerType==='touch') e.preventDefault();
  const p=eventToLogical(e), st=game.state;
  if(st===STATE.TITLE||st===STATE.GAMEOVER||st===STATE.STAGECLEAR){ edgeKeys['Enter']=true; if(st===STATE.TITLE) edgeKeys['KeyZ']=true; touchPointers.set(e.pointerId,{role:'menu'}); return; }
  if(st===STATE.PAUSED){ edgeKeys['Escape']=true; touchPointers.set(e.pointerId,{role:'btn'}); return; }   // any tap resumes
  if(inputMode==='touch'){
    if(ptInRect(p.x,p.y,TOUCH_BTN.pause)){ edgeKeys['Escape']=true; touchPointers.set(e.pointerId,{role:'btn'}); return; }
    if(ptInRect(p.x,p.y,TOUCH_BTN.shoot)){ touchShoot=!touchShoot; touchPointers.set(e.pointerId,{role:'btn'}); return; }
    if(ptInRect(p.x,p.y,TOUCH_BTN.focus)){ touchFocus=!touchFocus; touchPointers.set(e.pointerId,{role:'btn'}); return; }
    if(ptInRect(p.x,p.y,TOUCH_BTN.bomb)){ edgeKeys['KeyX']=true; touchPointers.set(e.pointerId,{role:'btn'}); return; }
  }
  if(isTouch&&st===STATE.PLAYING&&inPlayfield(p.x,p.y)&&movePointerId===-1){ movePointerId=e.pointerId; touchPointers.set(e.pointerId,{role:'move',lastX:p.x,lastY:p.y}); try{ canvas.setPointerCapture(e.pointerId); }catch(_){} }
}
function onPointerMove(e){ const rec=touchPointers.get(e.pointerId); if(!rec||rec.role!=='move'||game.state!==STATE.PLAYING) return; if(e.pointerType==='touch') e.preventDefault(); const p=eventToLogical(e); const s=focusHeld()?TOUCH_DRAG_SENS_FOCUS:TOUCH_DRAG_SENS; ext.dragDX+=(p.x-rec.lastX)*s; ext.dragDY+=(p.y-rec.lastY)*s; rec.lastX=p.x; rec.lastY=p.y; }
function onPointerUp(e){ const rec=touchPointers.get(e.pointerId); if(rec){ if(rec.role==='move') movePointerId=-1; touchPointers.delete(e.pointerId); } try{ canvas.releasePointerCapture(e.pointerId); }catch(_){} }
function attachTouch(el){
  el.addEventListener('pointerdown',onPointerDown,{passive:false}); el.addEventListener('pointermove',onPointerMove,{passive:false});
  el.addEventListener('pointerup',onPointerUp,{passive:false}); el.addEventListener('pointercancel',onPointerUp,{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('gamepadconnected',e=>{ _padIndex=e.gamepad.index; });
  window.addEventListener('gamepaddisconnected',e=>{ if(e.gamepad.index===_padIndex){ _padIndex=-1; clearTransientInput(); rawKeys['KeyZ']=false; rawKeys['ShiftLeft']=false; rawKeys['ArrowUp']=rawKeys['ArrowDown']=rawKeys['ArrowLeft']=rawKeys['ArrowRight']=false; if(inputMode==='pad') inputMode=(typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches)?'touch':'key'; } });
}

function makePlayer(){ return { x:PLAYER_START.x, y:PLAYER_START.y, r:PLAYER_R, focus:false, state:'alive', dead:false, invuln:0, blink:false, fireCd:0, power:START_POWER, bombs:START_BOMBS, lives:START_LIVES, itemR:14, bombActive:0, bossDot:0, pendingDeath:0, respawnT:0, options:[], mvx:0, mvy:0, grazePowerT:0 }; }
function makeGame(){ return { state:STATE.TITLE, score:0, hi:0, grazeCount:0, pointTotal:0, scoreMul:1, extendsTaken:0, stateT:0, fullpower:false, paused:false, boss:null, spellIntensity:0, powerMax:MAXPOWER, grazePowerThreshold:GRAZE_POWER_FIRST, grazePowerInterval:GRAZE_POWER_FIRST }; }

function updateGameSystems(dt){ game.stateT+=dt;
  switch(game.state){
    case STATE.TITLE: updateTitle(dt); break;

    case STATE.PAUSED: break;
    case STATE.GAMEOVER:
      if(!game._goFade && game.stateT>GAMEOVER_AUTORET-GAMEOVER_FADE){ game._goFade=true; Audio.fadeOutMusic(GAMEOVER_FADE); }   // begin the gentle tail fade so silence lands right at the auto-return
      if(keyEdge('Enter')||game.stateT>GAMEOVER_AUTORET) setState(STATE.TITLE);
      break;
    case STATE.STAGECLEAR: if(keyEdge('Enter')||game.stateT>8) setState(STATE.TITLE); break;
